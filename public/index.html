<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Mar 10 nov 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'investingLive (Fed)', time:'06:00', title:'La Fed non frena: il rialzo dei tassi di dicembre è ormai dato per certo', sintesi:'Il governatore Waller dice che a dicembre i tassi saliranno comunque, qualunque sia il dato sull’inflazione in uscita oggi: sarà solo da capire se di un quarto di punto o di mezzo. Il mercato ora dà il 99% di probabilità al rialzo. Il rendimento dei titoli di Stato Usa a 10 anni è al 4,87%.', perche:'Tassi più alti vogliono dire mutui e prestiti più cari, e la Borsa è già nervosa.', spunto:'La Fed alza i tassi con le Borse in affanno: stringe la cinghia a un’economia che già suda, e il conto lo paga chi ha un mutuo.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Alta', source:'AP / Reuters', time:'06:10', title:'Wall Street rimbalza: miglior giornata da aprile, ma la paura dell’IA non è passata', sintesi:'Lunedì l’S&P 500 è salito del 2,3% a 7.550 punti, il Dow Jones del 2,2% e il Nasdaq del 2,7%, dopo il crollo della settimana scorsa. AMD ha preso il 13,3%. Restano i timori su chi pagherà l’energia dei centri dati per l’intelligenza artificiale, dopo le vittorie democratiche nel voto Usa.', perche:'Se hai un fondo o un piano pensionistico, dentro ci sono questi titoli: un rimbalzo non è ancora una ripartenza.', spunto:'Un giorno di rialzo dopo una settimana di crollo non è una ripartenza: è una pausa, e chi la scambia per fiducia rischia caro.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'AP / Reuters', time:'06:20', title:'Nvidia sotto inchiesta: il capo Jensen Huang e il sospetto di spionaggio cinese', sintesi:'Nvidia ha perso il 4,3% in Borsa, unico grande titolo in calo nel rimbalzo. Il New York Times riporta che l’intelligence Usa ritiene che una dirigente legata a Huang raccogliesse informazioni per la Cina; il consiglio di amministrazione dice di non avere motivi per credere che segreti siano stati compromessi. Pechino parla di “calunnie”.', perche:'Nvidia pesa moltissimo sui listini: quando traballa lei, traballano anche i tuoi investimenti.', spunto:'Quando il cuore dell’intelligenza artificiale diventa una questione di spie, la tecnologia smette di essere solo business e diventa una partita di potere.', tags:['X','Video']},
    {cat:'Commodities', rel:'Media', source:'AP / Rigzone', time:'06:30', title:'Il petrolio affonda del 6%: basta una frase di Trump per far scendere il prezzo', sintesi:'Il Brent, riferimento mondiale del greggio, è sceso del 5,8% a 92,57 dollari, mentre a inizio mese superava i 112. Trump ha detto che nuovi attacchi all’Iran sono “molto improbabili” se i negoziati avanzano. Ma le navi colpite vicino allo stretto di Hormuz tengono ancora alta la tensione.', perche:'Meno petrolio caro vuol dire benzina e bollette più leggere, ma solo finché la tregua regge.', spunto:'Il petrolio ormai si muove sulle parole di un presidente più che sulla domanda reale: e noi paghiamo l’umore di Washington alla pompa.', tags:['X','Video']},
    {cat:'Crypto', rel:'Media', source:'The Sunday Guardian (dati di mercato)', time:'06:40', title:'Bitcoin a 74.000 dollari: il rifugio digitale scappa alla prima paura', sintesi:'Il bitcoin è sceso a circa 74.200 dollari dal picco di 80.935, perdendo il 4,9% in una settimana; l’ether è vicino a 2.120. Pesano le liquidazioni di chi scommetteva a leva, i ritardi della legge Usa sulle crypto dopo il voto e la notizia, non verificata in modo indipendente, di un blocco Usa alla piattaforma MEXC. Sotto 73.700 gli analisti temono un trend ribassista.', perche:'Se il bitcoin scende insieme alle azioni, non è il paracadute che ti hanno venduto.', spunto:'“Oro digitale” è uno slogan comodo finché sale: al primo scossone il bitcoin corre via insieme alle azioni tecnologiche.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'TheStreet / CoinDesk (dati BLS e CME)', time:'14:30', title:'L’inflazione non molla: la Fed ora pensa a una stangata doppia', sintesi:'A ottobre i prezzi Usa sono saliti dello 0,4% in un mese contro lo 0,3% atteso, e quelli “di fondo” (senza cibo ed energia) dello 0,3% contro lo 0,2%. Il rendimento del titolo di Stato a 10 anni sfiora il 5% e il mercato vede ora un 15% di probabilità che a dicembre la Fed alzi i tassi di mezzo punto invece di un quarto.', perche:'Se l’inflazione resta appiccicata, mutui, prestiti e carte di credito costeranno di più ancora per mesi.', spunto:'Ci avevano promesso che l’inflazione era domata: è tornata a mordere, e a pagarla sarà chi ha un mutuo, non chi l’ha sottovalutata.', tags:['LinkedIn','Video']},
    {cat:'Azionario', rel:'Alta', source:'TheStreet / CoinDesk', time:'15:00', title:'Nvidia sprofonda ancora: meno 26% in un mese, ora indaga anche l’FBI', sintesi:'Nvidia cede circa il 6% in giornata: secondo i resoconti l’FBI indaga sul capo Jensen Huang, è partita una causa degli azionisti e un’inchiesta giornalistica collega il caso a 7,5 miliardi di dollari di chip spediti in Cina. Il deputato Usa John Moolenaar chiede al Congresso di “andare fino in fondo”.', perche:'Nvidia è dentro quasi ogni fondo e piano pensione: quando perde un quarto del valore, lo perdi un po’ anche tu.', spunto:'Abbiamo affidato il futuro dell’intelligenza artificiale a un’azienda sola: ora scopriamo quanto costa quando quell’azienda trema.', tags:['X','Video']},
    {cat:'Azionario', rel:'Media', source:'TheStreet', time:'15:30', title:'SoftBank svaluta 3,7 miliardi: la corsa ai centri dati IA presenta il primo conto', sintesi:'SoftBank ha dichiarato una perdita contabile di 3,7 miliardi di dollari legata alle apparecchiature elettriche per i centri dati. A Wall Street GE Vernova, che produce proprio impianti per l’energia, perde oltre il 7%, e First Solar oltre il 6%.', perche:'Chi ha comprato “l’energia dell’IA” come scommessa sicura scopre che anche lì si può perdere, e tanto.', spunto:'La febbre dell’intelligenza artificiale ha un problema: qualcuno ha comprato le pale prima di sapere se c’era l’oro.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Lookonchain', time:'16:00', title:'Bitcoin sotto 73.000 dollari: e anche le aziende “fedelissime” vendono', sintesi:'Dopo il dato sull’inflazione il bitcoin è sceso sotto 73.000 dollari, minimo dal 20 agosto; ether, XRP e Solana perdono intorno al 6%. Secondo Lookonchain, 14 società quotate hanno venduto nel 2026 oltre 108.000 bitcoin (circa 8 miliardi), più della metà dai “minatori” MARA e Riot, mentre i fondi ETF sul bitcoin registrano uscite crescenti.', perche:'Se chi produce bitcoin per mestiere lo vende, chi lo compra al dettaglio dovrebbe chiedersi perché.', spunto:'Quando i minatori vendono il bitcoin che estraggono, il racconto del “non vendere mai” è solo per i piccoli risparmiatori.', tags:['X','Threads']},
    {cat:'Commodities', rel:'Media', source:'TheStreet / CoinDesk', time:'16:30', title:'Petrolio ai minimi da agosto, ma l’oro non fa più da paracadute', sintesi:'Il petrolio Usa (WTI) scende a 85,5 dollari e il Brent a 90,8, i livelli più bassi da fine agosto, dopo che Trump ha detto di voler rinviare nuovi attacchi all’Iran. Anche l’oro perde circa l’1%, sotto i 4.100 dollari l’oncia, schiacciato dai tassi in salita.', perche:'Benzina più leggera è una buona notizia, ma se anche l’oro scende nei giorni di paura vuol dire che non c’è un vero posto sicuro.', spunto:'Oggi è caduto tutto, perfino l’oro: con i tassi verso il 5%, il vero bene rifugio è diventato il contante.', tags:['X','Video']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
