<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Mer 30 set 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'Motley Fool (indiscrezione non confermata)', time:'09:00', title:'Anthropic a 2.000 miliardi? Wall Street brinda, gli allarmi suonano', sintesi:'Secondo indiscrezioni non confermate, Anthropic potrebbe arrivare a una valutazione di 2.000 miliardi di dollari. Intanto l’indice Shiller CAPE, che misura quanto sono care le azioni rispetto agli utili di dieci anni, è ai livelli più alti dal 1999, l’anno prima dello scoppio della bolla dot-com.', perche:'Se i prezzi corrono più degli utili, chi compra oggi paga il conto se la festa dell’IA si ferma: e nei fondi pensione ci siamo tutti.', spunto:'Una società valutata quanto un Paese intero, senza aver ancora dimostrato di saper guadagnare a quella scala, non è un investimento: è una scommessa collettiva sulla fede.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Motley Fool', time:'08:00', title:'Il debito USA costa come nel 2007: il mercato non si fida più', sintesi:'Il rendimento dei titoli di Stato USA a 10 anni sale al 5,28%, il livello più alto dal 2007, mentre quello a 30 anni tocca il massimo dal 2002. Wall Street a metà giornata perde intorno allo 0,3% (S&P 500) e allo 0,6% (Dow Jones).', perche:'Quando lo Stato più solido del mondo paga di più per indebitarsi, mutui e finanziamenti salgono ovunque, Europa compresa.', spunto:'Se chi presta soldi agli Stati Uniti ne pretende sempre di più, il problema non è la Fed: è la fiducia nel conto che Washington non riesce a pagare.', tags:['LinkedIn','Video']},
    {cat:'Geopolitica', rel:'Alta', source:'Yahoo Finance', time:'07:30', title:'Iran, il petrolio scende: il Golfo ha già ripreso a pompare', sintesi:'Dopo il balzo di lunedì il petrolio (WTI) cala dell’1,5% a 91,21 dollari, mentre Stati Uniti e Iran trattano in modo indiretto sullo stretto di Hormuz. Secondo gli analisti, i flussi di greggio dal Golfo sono già tornati oltre il 90% dei livelli prima della guerra.', perche:'Se il petrolio scorre quasi come prima, la paura dei prezzi alti pesa più delle barche ferme: e a Teheran questo dà forza al tavolo.', spunto:'La guerra fa meno male al petrolio di quanto ci hanno raccontato: chi grida al blocco totale ha spesso qualcosa da vendere.', tags:['X','Threads']},
    {cat:'Crypto', rel:'Media', source:'FinanceFeeds', time:'09:30', title:'Bitcoin +42% nel trimestre, ma quest’anno resta in perdita', sintesi:'Bitcoin ha guadagnato circa il 42% nel terzo trimestre, ma quasi tutto il rialzo è arrivato in una sola settimana di agosto. Da inizio anno perde ancora il 5,17%, mentre gli ETF USA hanno raccolto 6,43 miliardi di dollari.', perche:'Un guadagno concentrato in pochi giorni dice che chi compra e vende in fretta vince, chi aspetta fermo rischia di restare a mani vuote.', spunto:'Il bitcoin “sempre in crescita” è una favola: in dieci settimane su undici non ha mosso un dito, e chi ha creduto ai racconti si è annoiato.', tags:['X','Video']},
    {cat:'Commodities', rel:'Media', source:'Yahoo Finance', time:'08:30', title:'L’oro risale a 4.205 dollari, anche con i tassi alle stelle', sintesi:'L’oro guadagna lo 0,89% e sale a 4.205,30 dollari l’oncia, anche se i rendimenti dei titoli USA sono ai massimi da anni e in teoria dovrebbero penalizzarlo. Bitcoin, nello stesso momento, resta fermo intorno a 83.900 dollari.', perche:'Se l’oro regge nonostante tassi che gli fanno concorrenza, qualcuno sta comprando per paura e non per calcolo.', spunto:'Chi compra oro con i tassi al massimo non sta facendo un affare: sta pagando un’assicurazione contro qualcosa che teme di non poter dire ad alta voce.', tags:['LinkedIn','X']}
  ],
  afternoon: [
    {cat:'Geopolitica', rel:'Alta', source:'TheStreet', time:'11:30', title:'Iran, il petrolio prende fiato: la pace è più vicina di quanto sembri', sintesi:'Dopo il no di Trump, Stati Uniti e Iran hanno tenuto colloqui indiretti tramite mediatori. Il petrolio scende: WTI a 92 dollari (-0,6%), Brent a 104,80. Secondo alcune analisi i flussi dal Golfo Persico sono già tornati a oltre il 90% dei livelli d’anteguerra.', perche:'Se il petrolio cala, calano benzina e bollette: il rifiuto di ieri potrebbe essere stato solo una mossa al tavolo, non la fine dei negoziati.', spunto:'Chi ieri urlava alla guerra imminente ha scambiato una trattativa dura per una rottura: i mercati sono spesso più nervosi dei negoziatori.', tags:['X','LinkedIn']},
    {cat:'Azionario', rel:'Alta', source:'Reuters Business', time:'10:30', title:'Anthropic in Borsa: vuole 2.000 miliardi, ma perde miliardi', sintesi:'Dal prospetto per la quotazione, visto da Reuters, emerge una valutazione puntata sopra i 2.000 miliardi di dollari, con ricavi 2025 di 4,59 miliardi, perdita operativa di oltre 8 miliardi e 518 miliardi di impegni futuri su cloud e infrastrutture.', perche:'Se i risparmiatori dovranno comprare queste azioni, si ritroveranno a scommettere su una promessa gigantesca, non su utili già visibili.', spunto:'Pagare 2.000 miliardi per un’azienda che oggi perde più di quanto incassa non è investire: è comprare un sogno a prezzo di realtà.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'TheStreet', time:'09:00', title:'AMD compra il laboratorio di Fei-Fei Li per 8,2 miliardi', sintesi:'AMD ha accettato di acquisire World Labs, la startup fondata dalla pioniera dell’intelligenza artificiale Fei-Fei Li, pagando 8,2 miliardi di dollari interamente in azioni. Il titolo AMD guadagna l’1,2% prima dell’apertura, a 615 dollari.', perche:'I colossi dei chip non si accontentano più di vendere i chip: comprano chi inventa l’IA, e chi resta piccolo rischia di restare fuori.', spunto:'Pagare in azioni una cifra così alta significa usare i prezzi gonfiati di Borsa come moneta: finché dura, l’IA si compra da sola.', tags:['X','Threads']},
    {cat:'Crypto', rel:'Media', source:'Rio Times', time:'10:00', title:'Il Bitcoin cala, ma Strategy continua a comprare', sintesi:'Bitcoin è sceso dell’1,13% a 83.503 dollari dopo il no di Trump all’Iran. Strategy ha però acquistato altri 1.665 Bitcoin per 142,7 milioni di dollari e Strive ne ha presi 1.107 per 94,5 milioni. Domani i dati sull’inflazione PCE guideranno le mosse della Fed.', perche:'Chi ha grandi cassaforti aziendali compra i cali; chi guarda solo il prezzo del giorno vende con la paura.', spunto:'Le aziende che comprano Bitcoin a ogni ribasso non sono investitori: sono tifosi con un bilancio da difendere, e il rischio lo pagano gli azionisti.', tags:['X','Video']},
    {cat:'Macro', rel:'Media', source:'Invezz', time:'09:30', title:'Fed, il mercato dà il 70% a un altro rialzo: oggi i posti di lavoro', sintesi:'Alle 16:00 italiane escono i dati sulle offerte di lavoro di agosto (JOLTS), primo di una serie di appuntamenti con PCE, l’indice d’inflazione preferito dalla Fed, e occupazione. Il mercato vede circa il 70% di probabilità di un rialzo dei tassi a ottobre; il decennale USA resta vicino al 5,25%.', perche:'Se il lavoro tiene forte, la Fed ha un motivo in più per stringere: mutui e prestiti restano cari più a lungo.', spunto:'Un’economia che regge non è una buona notizia per chi ha un mutuo: più tiene il lavoro, più a lungo pagheremo tassi alti.', tags:['LinkedIn','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
