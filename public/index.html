<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Dom 1 nov 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Crypto', rel:'Alta', source:'Bitcoin.com News / Share Talk', time:'09:00', title:'Binance svaligiata: 6,3 miliardi rubati, il furto crypto più grande della storia', sintesi:'Hacker hanno portato via circa 6,3 miliardi di dollari da Binance, la più grande piattaforma di scambio di criptovalute: quasi 3 miliardi sono stati congelati. Bitcoin è scivolato verso i 77.000 dollari. Le prime stime parlavano di 2,5 miliardi.', perche:'Se chi custodisce i soldi di milioni di persone si fa svuotare la cassaforte, il tuo “portafoglio sicuro” su una piattaforma è una promessa, non una garanzia.', spunto:'Non sono tue le chiavi, non sono tuoi i soldi: dopo Binance, chi lascia le crypto su una piattaforma sta solo prestando fiducia.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Share Talk', time:'08:00', title:'Wall Street, la festa dell’IA inciampa: Amazon e Intel spaventano il Nasdaq', sintesi:'Venerdì il Nasdaq è crollato: pesano i timori sulle enormi spese per l’intelligenza artificiale e le previsioni deboli di Amazon e Intel. Il mercato comincia a chiedersi quando arriveranno i guadagni.', perche:'Se i colossi della tecnologia frenano, trascinano giù i fondi e le pensioni che li hanno nel portafoglio, cioè anche i tuoi risparmi.', spunto:'Miliardi buttati nell’IA senza profitti: la bolla non scoppia quando lo dice un critico, ma quando lo dicono i bilanci.', tags:['LinkedIn','Video']},
    {cat:'Geopolitica', rel:'Alta', source:'Share Talk', time:'08:30', title:'Petrolio sopra i 100 dollari: la guerra in Medio Oriente si paga alla pompa', sintesi:'Il Brent (il prezzo di riferimento mondiale del greggio) vale circa 115,8 dollari, il WTI americano oltre 101. Le tensioni con l’Iran tengono alti petrolio e gas. Shell ha raddoppiato l’utile a 10,8 miliardi in tre mesi.', perche:'Il barile caro arriva nelle bollette e al distributore: lo paghi anche se non hai mai comprato un’azione.', spunto:'Mentre noi paghiamo il pieno, le compagnie petrolifere festeggiano utili record: la guerra ha sempre qualcuno che ci guadagna.', tags:['X','Threads']},
    {cat:'Macro', rel:'Alta', source:'Share Talk / Bitcoin.com News', time:'08:45', title:'Oro sotto i 4.000 dollari per la prima volta da luglio: il rifugio cede', sintesi:'La Fed ha lasciato i tassi fermi, ma il rendimento dei titoli di Stato Usa a 10 anni è vicino al 5% e il petrolio caro alimenta l’inflazione. L’oro, che non paga interessi, è sceso sotto i 4.000 dollari l’oncia.', perche:'Con i titoli di Stato vicini al 5%, tenere oro costa di più e le rate di mutui e prestiti restano pesanti.', spunto:'Il bene rifugio per eccellenza perde appeal appena il denaro torna a rendere: nessun porto è sicuro quando i tassi alzano la voce.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'Share Talk', time:'07:30', title:'Utili record, Borsa in rosso: HSBC e NatWest puniti prima della manovra britannica', sintesi:'HSBC ha alzato l’utile del 32% a 9,6 miliardi di dollari, ma il titolo ha perso fino al 7%. NatWest è calata del 7,4% e ha tagliato 1.000 posti in tre mesi. Il mercato teme nuove tasse sulle banche nel Budget di Londra.', perche:'Se il fisco pesca più nelle banche, spesso il conto arriva ai clienti sotto forma di commissioni e prestiti più cari.', spunto:'Le banche fanno profitti record e tagliano posti di lavoro: il problema non sono i conti, è a chi vanno i soldi.', tags:['X','Video']}
  ],
  afternoon: [
    {cat:'Geopolitica', rel:'Alta', source:'TheStreet / CNN', time:'09:00', title:'Iran, Washington ha il dito sul grilletto: attacco possibile in 96 ore', sintesi:'Secondo la CNN, gli Usa possono lanciare attacchi di grande portata contro l’Iran entro 96 ore da un ordine di Trump, che molti funzionari si aspettano dopo le elezioni di metà mandato. Intanto i mediatori del Qatar sono volati a Teheran e il Brent (il prezzo di riferimento del petrolio) scende dell’1,3% a 115,20 dollari.', perche:'Il prezzo del petrolio oggi dipende da una telefonata: se salta la trattativa, benzina e bollette salgono di nuovo.', spunto:'Se la guerra si decide in base al calendario elettorale, il petrolio che paghiamo è politica travestita da mercato.', tags:['X','Video']},
    {cat:'Azionario', rel:'Alta', source:'TheStreet (dati premarket)', time:'08:30', title:'Lula vince e la Borsa punisce: XP dimezza, Nu perde un quarto', sintesi:'Prima dell’apertura di Wall Street, XP Inc. (broker brasiliano) lascia sul terreno il 50% e Nu Holdings (la banca digitale) circa il 25%, dopo la vittoria di Lula al ballottaggio contro Flávio Bolsonaro.', perche:'Se hai investito in mercati emergenti o in titoli brasiliani, una notte di voto può cancellarti mesi di guadagni.', spunto:'I mercati non votano, ma puniscono chi vince: la politica per loro è solo un rischio da prezzare.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'TheStreet / documenti Sec', time:'08:20', title:'EQT si compra Range Resources: nasce un gigante del gas da 50 miliardi', sintesi:'EQT ha accettato di acquisire Range Resources in uno scambio di sole azioni da oltre 50 miliardi di dollari, debiti compresi. Il titolo Range è balzato del 10% prima dell’apertura.', perche:'Meno aziende, più grandi: chi controlla il gas americano controlla anche una fetta di ciò che paghi in bolletta.', spunto:'Quando il gas finisce in poche mani, il prezzo lo decidono loro, non il mercato.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'TheStreet (dichiarazioni di Elon Musk)', time:'08:22', title:'Musk avverte: “Oltre 200 aziende del cloud per l’IA possono fallire”', sintesi:'Elon Musk ha detto che più di 200 “neocloud” (società che affittano potenza di calcolo per l’intelligenza artificiale) potrebbero crollare. Nebius, CoreWeave e Iren sono scese in Borsa prima dell’apertura.', perche:'Se il boom dell’IA poggia su aziende così fragili, anche i fondi che le contengono rischiano di pagare il conto.', spunto:'Quando lo dice chi l’IA la vende, forse la bolla non è più un sospetto: è un avviso.', tags:['X','Threads']},
    {cat:'Azionario', rel:'Media', source:'TheStreet / Verizon', time:'07:28', title:'Verizon conquista clienti e rialza le stime, ma gli incassi deludono', sintesi:'Verizon ha aggiunto 406.000 nuovi abbonati di telefonia nel trimestre, quasi il doppio dei 209.439 attesi, e alza le previsioni annuali. Però i ricavi, 34,3 miliardi di dollari, sono sotto i 34,74 attesi.', perche:'Più clienti non significa più guadagni: se per attirarli si regala, a pagare è chi ha le azioni.', spunto:'Crescere regalando è un modo elegante di perdere soldi, e il mercato prima o poi presenta il conto.', tags:['LinkedIn','Video']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
