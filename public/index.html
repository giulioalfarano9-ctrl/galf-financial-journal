<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Ven 4 set 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'Reuters / CME FedWatch', time:'06:05', title:'Basta una frase di Waller e il rialzo dei tassi torna in bilico', sintesi:'Il governatore della Fed Christopher Waller ha detto che sarebbe disposto a lasciare i tassi fermi se l\'inflazione continuerà a scendere. In poche ore le probabilità di un rialzo il 15-16 settembre sono passate dal 63,2% al 50,4% e il rendimento del titolo di Stato americano a dieci anni è sceso al 4,75%, dai massimi da novembre 2023 del giorno prima.', perche:'Da quel numero dipende quanto pagherai di mutuo e di prestito nei prossimi mesi, anche in Europa.', spunto:'Un uomo dice una frase e il costo del denaro per mezzo pianeta cambia in tre ore: chiamarlo mercato libero è una gentilezza che non ci possiamo più permettere.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'CNBC / TheStreet', time:'06:40', title:'Wall Street festeggia il rialzo che forse non ci sarà: Dow su di 624 punti', sintesi:'Giovedì il Dow Jones ha guadagnato 624 punti (+1,18%) a 53.686, l\'S&P 500 l\'1,06% a 7.747,71 e il Nasdaq l\'1,4% a 26.584,06. L\'indice della paura, il Vix, è crollato del 7% a 15,20. Nessun dato nuovo sull\'economia: solo le parole di Waller.', perche:'Se il tuo fondo guadagna l\'1% perché un banchiere centrale ha cambiato tono, non stai investendo in aziende: stai scommettendo su discorsi.', spunto:'Le Borse hanno guadagnato in un giorno più di quanto valga un trimestre di utili, e nell\'economia reale non è cambiato nulla: questo non è ottimismo, è dipendenza.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Alta', source:'DailyCoin / Cointelegraph', time:'07:15', title:'Il bitcoin vola a 82 mila dollari: massimo da maggio in una notte', sintesi:'Dopo le parole di Waller il bitcoin è salito del 6,8% a 82.200 dollari, il livello più alto da maggio. L\'intero mercato delle criptovalute è cresciuto del 3,7%, a 2.814 miliardi di dollari complessivi.', perche:'Il bitcoin si muove ormai come un titolo tecnologico: sale quando il denaro costa meno, scende quando costa di più.', spunto:'Il bitcoin doveva essere la moneta libera dalle banche centrali e sale del 7% perché un governatore della Fed ha detto forse: più che indipendenza, è devozione.', tags:['X','LinkedIn']},
    {cat:'Geopolitica', rel:'Alta', source:'CBS News / Al Jazeera', time:'07:45', title:'Iran e Oman aprono un corridoio: le navi potrebbero tornare a Hormuz', sintesi:'Dopo settimane di consultazioni, Teheran e Mascate hanno raggiunto un\'intesa su un corridoio marittimo congiunto temporaneo per far ripartire il traffico commerciale nello Stretto di Hormuz. L\'Iran nega di trattare con Washington e parla solo con l\'Oman. Da quel canale passava il 20% del petrolio mondiale prima della guerra.', perche:'Se le navi tornano a passare, il prezzo dell\'energia scende: è la voce che pesa di più sulla tua bolletta in questo momento.', spunto:'La pace vera la sta negoziando un piccolo Paese del Golfo mentre le grandi potenze si sparano addosso: chi tiene aperte le rotte conta più di chi possiede le portaerei.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Trading Economics', time:'08:10', title:'Il petrolio si ferma a 95 dollari e interrompe tre giorni di corsa', sintesi:'Il Brent è sceso intorno ai 95 dollari al barile giovedì, spezzando un rialzo durato tre sedute. Il mercato ha messo sul piatto le nuove ostilità in Medio Oriente da una parte e i tentativi di riaprire lo Stretto di Hormuz dall\'altra.', perche:'Ogni dollaro in meno sul barile è una spinta in meno all\'inflazione, e una rata in meno da temere.', spunto:'Il petrolio scende perché si tratta, non perché si produce di più: la nostra bolletta oggi dipende da un tavolo diplomatico, non da un impianto.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'CNBC / Broadcom', time:'08:35', title:'Broadcom triplica i chip per l\'intelligenza artificiale e il titolo scende lo stesso', sintesi:'Nel trimestre i ricavi sono saliti dell\'86% a 29,6 miliardi di dollari e le vendite di chip per l\'AI sono più che triplicate, a 16,7 miliardi (+221%). L\'azienda prevede 58 miliardi di ricavi dall\'AI nel 2026, 115 nel 2027 e 230 nel 2028. Eppure il titolo è sceso: la stima per il trimestre in corso, 34,8 miliardi, è appena sotto le attese.', perche:'Quando numeri record non bastano più, vuol dire che il prezzo delle azioni tecnologiche incorpora già un futuro perfetto.', spunto:'Un\'azienda che quasi raddoppia il fatturato viene punita perché manca lo 0,7% delle stime: il mercato non compra più i risultati, compra la profezia, e le profezie prima o poi si sbagliano.', tags:['LinkedIn','X']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'ADP / CNBC', time:'09:35', title:'Il lavoro americano si sta fermando proprio mentre la Fed vuole alzare i tassi', sintesi:'Ad agosto le aziende private americane hanno creato appena 38.000 posti di lavoro, contro i 47.000 attesi e i 46.000 di luglio: il dato più debole da gennaio. L\'industria ne ha persi 17.000 e i servizi alle imprese altri 16.000. Delle assunzioni rimaste, 34.000 su 38.000 arrivano dai grandi gruppi: le piccole imprese hanno praticamente smesso di assumere. Mohamed El-Erian continua a giudicare «troppo alte» le probabilità di un rialzo dei tassi a settembre.', perche:'Se le assunzioni si spengono e insieme sale il costo del denaro, chi cerca lavoro o ha un mutuo viene colpito due volte.', spunto:'Alzare i tassi mentre le piccole imprese smettono di assumere non è rigore: è curare la febbre spegnendo il riscaldamento.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Trading Economics / Reuters', time:'11:20', title:'La Bce si sveglia con anni di ritardo: ora il rialzo lo danno per fatto', sintesi:'Con l\'inflazione dell\'area euro salita al 3,3% ad agosto, il livello più alto da tre anni, i mercati prezzano ormai per intero un aumento dei tassi di un quarto di punto, al 2,5%. A spingere i prezzi è l\'energia, rincarata del 14,3% in un anno. In Germania si è passati dal 2,4% al 2,8%, in Francia dal 2% al 2,4%, in Spagna al 3,9%.', perche:'Un rialzo dei tassi in Europa significa mutui e prestiti più cari qui da noi, non dall\'altra parte dell\'oceano.', spunto:'L\'inflazione europea la fanno le petroliere, non gli stipendi: la Bce può alzare i tassi quanto vuole, non farà scendere di un centesimo il prezzo di un barile.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Alta', source:'Investrade / TheStreet', time:'10:05', title:'La Borsa premia chi arma l\'esercito e punisce chi cerca una cura', sintesi:'Palantir è salita dell\'8,7% dopo aver ottenuto dall\'esercito americano il contratto da capofila per costruire e consegnare otto sistemi di terra TITAN. Nella stessa seduta Snowflake ha guadagnato oltre il 20% sui conti, mentre la biotech Ultragenyx ha perso il 44% perché il suo studio decisivo su una malattia rara ha fallito.', perche:'In una sola giornata si vede dove il mercato crede che stiano i soldi sicuri: nella difesa e nel software, non nella medicina.', spunto:'La stessa seduta ha regalato l\'8,7% a chi fornisce l\'esercito e tolto il 44% a chi cercava una cura: chiamatelo pure mercato efficiente, resta un problema di priorità.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Fairway / Al Jazeera', time:'13:05', title:'Assicurare una petroliera a Hormuz costa fino a quaranta volte più di prima', sintesi:'Il premio di guerra per far passare una nave dallo Stretto di Hormuz è salito dallo 0,25% al 3-10% del valore dello scafo. Tradotto: una petroliera da 150 milioni di dollari paga oggi tra 1,5 e 4,5 milioni per un solo viaggio, contro i 375.000 di prima. Molte compagnie preferiscono semplicemente non assicurare più quelle rotte.', perche:'Quel costo non resta in banchina: finisce spalmato su ogni litro di carburante e su ogni prodotto che arriva via nave.', spunto:'Per strangolare il commercio mondiale non serve chiudere lo Stretto di Hormuz: basta renderlo troppo caro da assicurare, e sta già accadendo senza che nessuno lo abbia dichiarato.', tags:['X','Threads']},
    {cat:'Commodities', rel:'Media', source:'Fortune / World Gold Council', time:'12:40', title:'Le banche centrali fanno incetta di oro proprio mentre il prezzo crolla', sintesi:'L\'oro è risalito a 4.491 dollari l\'oncia, 157 in più rispetto a ieri e oltre 930 in più di un anno fa. Nel secondo trimestre le banche centrali ne hanno comprato 289 tonnellate, il record assoluto per quel periodo e il 62% in più di un anno prima: e lo hanno fatto mentre il prezzo segnava il peggior calo trimestrale in dieci anni.', perche:'Quando gli Stati accumulano oro invece di dollari, stanno dicendo senza dirlo che si fidano meno del debito americano.', spunto:'I risparmiatori vendono l\'oro quando scende, le banche centrali lo comprano proprio allora: prova a indovinare quale dei due gruppi sa dove sta andando il mondo.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / SEC', time:'12:15', title:'La SEC riscrive dopo quarant\'anni le regole su chi tiene i registri dei titoli', sintesi:'L\'autorità americana dei mercati ha pubblicato una proposta di 421 pagine per riformare le regole sui transfer agent, cioè su chi tiene il registro di chi possiede cosa: è la prima riscrittura sostanziale dai primi anni Ottanta. Il testo si rivolge esplicitamente a chi vuole tenere quei registri su blockchain, per i fondi tokenizzati.', perche:'È il passo che porta azioni e fondi tradizionali dentro l\'infrastruttura delle criptovalute, in silenzio e senza titoloni.', spunto:'La vera rivoluzione crypto non arriverà da un rialzo del bitcoin ma da 421 pagine di regolamento noioso: mentre tutti guardano il prezzo, l\'impianto dei mercati sta cambiando davvero.', tags:['X','LinkedIn']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
