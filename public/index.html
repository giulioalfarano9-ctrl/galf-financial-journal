<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Lun 10 ago 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Geopolitica', rel:'Alta', source:'Al Jazeera / CNBC / Bloomberg', time:'08:30', title:'Teheran rompe il tavolo e detta la lista: il petrolio riparte, Brent a 84 dollari', sintesi:'L\'Iran ha dichiarato di non essere in trattativa con gli Stati Uniti e ha consegnato una lista di richieste per riaprire lo Stretto di Hormuz. Il Brent è salito dell\'1,2% a 84,58 dollari al barile e il greggio americano a 79,28. Nel frattempo gli Houthi rivendicano nuovi attacchi contro la raffineria saudita di Jazan.', perche:'Ogni giorno di stallo su quel braccio di mare si trasforma in centesimi in più alla pompa, per tutti.', spunto:'Chi controlla un braccio di mare largo cinquanta chilometri decide quanto paghi il pieno a Milano: la globalizzazione ci ha reso ricchi e ricattabili nello stesso momento.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Bloomberg', time:'17:00', title:'Alphabet si fa prestare 25 miliardi e il mondo fa la fila per darglieli', sintesi:'La casa madre di Google ha piazzato un\'emissione di obbligazioni da 25 miliardi di dollari in dieci tranche, con scadenze da due a quarant\'anni, raccogliendo richieste per circa 115 miliardi: quasi cinque volte l\'offerta. È la terza operazione più grande dell\'anno sul debito di qualità.', perche:'Una delle aziende più ricche del pianeta preferisce indebitarsi piuttosto che spendere i propri soldi, e questo dice qualcosa su quanto le costerà l\'intelligenza artificiale.', spunto:'Quando chi ha centinaia di miliardi in cassa va a chiedere un prestito, il problema non è la fiducia: è che il conto dell\'AI è più grande di quanto ammettano.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Bureau of Labor Statistics / Kiplinger', time:'09:00', title:'Mercoledì arriva l\'inflazione americana: è lì che si decide tutto il resto', sintesi:'Il dato sui prezzi di luglio negli Stati Uniti esce mercoledì 12: gli analisti si aspettano un +0,2% nel mese e un +0,3% sulla parte di fondo. Giovedì tocca ai prezzi all\'ingrosso, venerdì alle vendite al dettaglio. La prossima riunione della banca centrale è solo il 16 settembre.', perche:'È il numero che dirà se il denaro tornerà a costare meno o se il rincaro della vita continuerà a mangiarsi lo stipendio.', spunto:'Il mercato ha già festeggiato il taglio dei tassi prima ancora di vedere il dato sull\'inflazione: sta scommettendo su un finale di cui non ha ancora letto la trama.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Media', source:'Statistics Canada / Bloomberg', time:'14:30', title:'Il Canada crea 75mila posti di lavoro mentre l\'America ne perde 23mila', sintesi:'L\'economia canadese ha aggiunto 75.100 posti di lavoro netti, portando la disoccupazione al 6,4%, il livello più basso da luglio 2024. Nello stesso mese gli Stati Uniti hanno distrutto 23.000 posti.', perche:'Due economie vicine e legate a filo doppio stanno andando in direzioni opposte, e la differenza la fanno le scelte politiche, non la sfortuna.', spunto:'Se il vicino di casa assume mentre tu licenzi, smetti di dare la colpa al ciclo economico: la colpa è di come hai deciso di governarlo.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'Bloomberg / MSCI', time:'10:15', title:'I mercati emergenti si riprendono tutto in una seduta grazie a un dato americano', sintesi:'L\'indice MSCI delle Borse dei Paesi emergenti è salito dello 0,7% in avvio di settimana, cancellando tutte le perdite della settimana precedente, dopo che le scommesse su un rialzo dei tassi americani a settembre sono scese dal 60% al 40%.', perche:'Le Borse di mezzo mondo dipendono ancora da un singolo numero pubblicato a Washington.', spunto:'Un dato americano cancella una settimana intera di perdite dall\'Indonesia al Brasile: chiamarla indipendenza economica è un\'illusione che costa cara.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / The Block', time:'12:00', title:'I fondi comprano Bitcoin come ad aprile, ma il 2026 resta in perdita di 5 miliardi', sintesi:'La scorsa settimana i fondi quotati sul Bitcoin hanno raccolto 853,5 milioni di dollari, la settimana migliore da metà aprile, con BlackRock a farla da padrone. Da inizio anno però il saldo resta negativo per circa 5 miliardi e il prezzo viaggia sui 65.000 dollari.', perche:'Una settimana buona non cambia un anno in rosso: chi è entrato nel 2026 sta ancora aspettando.', spunto:'Festeggiare 853 milioni entrati in una settimana quando ne sono usciti 5.000 da gennaio è raccontare la partita guardando un solo minuto.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'CNBC / Trivium China', time:'08:45', title:'La Cina esporta il 23% in più ma spedisce le stesse merci: a crescere sono i prezzi', sintesi:'A luglio le esportazioni cinesi sono salite del 23% in dollari, sopra le attese, trainate dai chip a +117% e dalle navi quasi raddoppiate. Ma contando i pezzi spediti invece dei dollari incassati il movimento quasi sparisce: i volumi dei chip crescono dell\'1,7% e telefoni e materie prime calano. L\'avanzo commerciale si ferma a 112,5 miliardi, in calo dell\'1,1% sull\'anno.', perche:'Il record cinese non significa che il mondo compri di più: significa che paga di più le stesse cose, e quel rincaro arriva anche nei negozi europei.', spunto:'Il boom cinese di luglio è un boom di prezzi, non di merci: chi festeggia il +23% sta leggendo la fattura, non il magazzino.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'CNN / Bloomberg', time:'11:15', title:'Anche con l\'accordo su Hormuz il petrolio resta caro: il Brent chiude a 83,55 dollari', sintesi:'Iran e Oman si dicono vicini a un\'intesa sulla gestione dello Stretto, ma Teheran chiede concessioni a Washington e frena sui tempi. Il Brent ha chiuso venerdì a 83,55 dollari al barile dopo essere sceso sotto gli 80 a inizio settimana. Secondo gli analisti il traffico difficilmente tornerà ai 130-140 passaggi al giorno di prima della guerra.', perche:'Anche nello scenario migliore, quello dell\'accordo, il petrolio resta più caro di prima: e il conto arriva alla pompa di benzina.', spunto:'Ci raccontano l\'accordo su Hormuz come la fine dell\'emergenza: è invece il momento in cui il prezzo alto smette di essere emergenza e diventa normalità.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Reuters / Investing.com', time:'10:00', title:'Il mercato smette di temere il rialzo dei tassi, ma mercoledì arriva la prova vera', sintesi:'Dopo i 23.000 posti di lavoro persi a luglio, le scommesse su un aumento del costo del denaro a settembre negli Stati Uniti sono scese al 43,9% dal 57% precedente al dato. Mercoledì 12 agosto arriva l\'inflazione americana di luglio: è quel numero a decidere se la banca centrale può davvero restare ferma.', perche:'Da questo si capisce se i tuoi risparmi renderanno di più o se il mutuo tornerà a costare meno.', spunto:'Il mercato ha già deciso che i tassi non salgono: se mercoledì l\'inflazione dice il contrario, non sarà una sorpresa ma una sberla.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'Yahoo Finance / The Cryptonomist', time:'12:10', title:'Un solo fondo sta per toccare mille miliardi: non era mai successo a nessuno', sintesi:'Il fondo di Vanguard che copia l\'indice delle 500 maggiori società americane ha chiuso a 710,71 dollari ed è vicino a diventare il primo al mondo a gestire mille miliardi di dollari. A spingerlo è il costo: chi usa il concorrente storico SPY paga circa tre volte tanto per lo stesso identico paniere di titoli.', perche:'Una fetta enorme del risparmio mondiale finisce ogni mese negli stessi titoli, comprati senza che nessuno ne guardi il prezzo.', spunto:'Mille miliardi in un solo fondo che compra sempre le stesse 500 azioni: la scelta più prudente del risparmio è diventata la concentrazione più rischiosa del mercato.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Banco Central do Brasil', time:'12:40', title:'Il Brasile mette 24 ore di attesa sui trasferimenti crypto sopra i 10mila dollari', sintesi:'La banca centrale brasiliana ha pubblicato il 7 agosto la regola 584/2026: dal 1° gennaio 2027 gli exchange dovranno trattenere per 24 ore i trasferimenti verso portafogli privati o società estere sopra i 10.000 dollari, stablecoin comprese. Anche somme minori potranno essere bloccate se i controlli antifrode le segnalano.', perche:'Il fermo serve a bloccare le truffe prima che i soldi spariscano all\'estero, ma toglie alle criptovalute proprio la cosa che le rendeva diverse dalle banche.', spunto:'Ventiquattro ore di attesa cancellano l\'unico vantaggio vero delle criptovalute: se devo comunque aspettare un giorno, tanto vale fare un bonifico.', tags:['X','Threads']},
    {cat:'Crypto', rel:'Media', source:'SoSoValue / The Cryptonomist', time:'13:20', title:'Tornano i soldi nei fondi su Bitcoin, ma l\'anno resta in rosso di 4,5 miliardi', sintesi:'Nella settimana chiusa il 7 agosto i fondi americani su Bitcoin hanno incassato 853,5 milioni di dollari, il dato migliore da metà aprile, con 693 milioni finiti nel solo prodotto di BlackRock: l\'81% del totale. Da inizio anno restano però 4,5 miliardi usciti più di quanti ne siano entrati, e il prezzo resta sotto i 65.000 dollari.', perche:'Una settimana buona non ripaga sette mesi di fughe: chi guarda solo il titolo del giorno vede l\'opposto di quello che sta accadendo.', spunto:'Chiamare ripresa una settimana positiva dentro un anno da meno 4,5 miliardi è il modo più elegante che ha il settore per non ammettere di aver perso.', tags:['X','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
