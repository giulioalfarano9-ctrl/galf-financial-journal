<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Mer 7 ott 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'CNBC / Yahoo Finance', time:'07:00', title:'Appena 29.000 nuovi posti di lavoro, ma i tassi restano ai massimi dal 2002', sintesi:'A settembre l’economia USA ha creato solo 29.000 posti, molto meno del previsto. Eppure il tasso sui titoli di Stato a 10 anni, cioè quanto paga lo Stato per indebitarsi, resta al 5,28%, il livello più alto dal 2002. I mercati danno ancora il 24% di probabilità a un nuovo rialzo dei tassi della Fed a ottobre.', perche:'Se i tassi non scendono nemmeno con il lavoro in frenata, mutui e prestiti restano cari più a lungo di quanto speri.', spunto:'Economia che rallenta e tassi che salgono: la Fed è in trappola, e il conto lo paghiamo noi.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Yahoo Finance / TheStreet', time:'06:30', title:'Wall Street fa un altro record, ma i piccoli restano a piedi', sintesi:'L’S&P 500 chiude a 7.818,93 punti (+0,58%), nuovo massimo storico, trainato da Nvidia e AMD. Ma le piccole imprese (Russell 2000) perdono lo 0,57%. Gli analisti si aggrappano a utili record dell’IA, attesi in crescita di circa il 30%.', perche:'Se il tuo investimento non è nei giganti tech, il record di Borsa potrebbe non riguardarti affatto.', spunto:'Questo non è un mercato che sale: è un mercato in cui vincono in pochi, e tutti fingono sia una festa per tutti.', tags:['LinkedIn','Threads']},
    {cat:'Geopolitica', rel:'Alta', source:'UKMTO / Trading Economics', time:'07:15', title:'Nove attacchi alle petroliere in sei giorni: l’Iran stringe ancora Hormuz', sintesi:'L’agenzia britannica per la sicurezza marittima (UKMTO) conta nove incidenti da inizio ottobre nello Stretto di Hormuz, da dove passa gran parte del petrolio mondiale. Il Brent sale a 101,70 dollari al barile (+1,1%), oltre il 50% in più di un anno fa.', perche:'Ogni petroliera colpita si traduce in benzina, bollette e spesa più care, anche per chi non ha mai sentito parlare di Hormuz.', spunto:'Il petrolio a 100 dollari non è più un’emergenza: è la nuova normalità, ed è un errore farci l’abitudine.', tags:['X','Video']},
    {cat:'Commodities', rel:'Media', source:'TheStreet / Trading Economics', time:'06:45', title:'Il G7 apre i serbatoi: 100 milioni di barili, ma il prezzo non crolla', sintesi:'Il G7 rilascia 100 milioni di barili dalle riserve strategiche nell’arco di quattro mesi. Martedì il Brent era sceso a 98,67 dollari, oggi è già risalito oltre 101. L’Arabia Saudita ha intanto riportato il suo oleodotto est-ovest a 5,8 milioni di barili al giorno.', perche:'Le riserve sono un cerotto: tamponano il prezzo per qualche mese, ma non risolvono un problema che resta aperto.', spunto:'Svuotare le scorte per frenare il prezzo è come pagare il mutuo con la carta di credito: funziona finché dura.', tags:['X','Threads']},
    {cat:'Crypto', rel:'Media', source:'Fortune / Analytics Insight', time:'07:30', title:'Un anno dopo il record, Bitcoin ha perso un terzo del suo valore', sintesi:'Bitcoin vale circa 86.000 dollari, il 31% in meno di un anno fa (record storico: 126.198 dollari il 6 ottobre 2025), anche se è salito di circa l’8% in un mese. A frenarlo, secondo gli analisti, i rendimenti dei titoli di Stato al 5,3%, che rendono i titoli sicuri più appetibili.', perche:'Se lo Stato ti paga più del 5% senza rischi, tenere crypto che oscillano diventa una scelta molto più costosa.', spunto:'Chi chiamava Bitcoin "oro digitale" dovrebbe spiegare perché un anno fa valeva un terzo in più.', tags:['X','Video']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'Bloomberg', time:'13:00', title:'Il bond a 30 anni punta al 6%: il debito americano presenta il conto', sintesi:'Il rendimento dei titoli di Stato USA a 30 anni, cioè quanto paga lo Stato per farsi prestare soldi per tre decenni, è al 5,63%, ai massimi dal 2002. Per BMO si dirige verso il 6% già a ottobre; Barclays ne vede il rischio.', perche:'Quel tasso è il metro per mutui e prestiti a lunga scadenza: se sale, la casa e le rate costano di più per anni.', spunto:'Lo Stato americano sta diventando il debitore più caro del mondo, e a pagare il conto saranno mutuatari e imprese.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Reuters / Investrade', time:'12:30', title:'AMD: "la domanda di chip resterà fortissima per anni". Il Nasdaq la prende in parola', sintesi:'Il Nasdaq ha chiuso a +1,05% a 27.477 punti e l’S&P 500 a 7.773,95 (+0,66%). Il capo di AMD, produttrice di chip, prevede una domanda "eccezionalmente forte" per i prossimi anni, trainata dall’intelligenza artificiale.', perche:'Se il tuo fondo è pieno di tecnologia, il tuo guadagno dipende da una sola scommessa: che l’IA non rallenti.', spunto:'Quando a dirti che la festa durerà anni è chi vende i biglietti, un po’ di prudenza non guasta.', tags:['LinkedIn','Threads']},
    {cat:'Geopolitica', rel:'Media', source:'OilPrice / Kpler', time:'11:00', title:'Hormuz sopra i livelli pre-guerra, ma il petrolio resta a 100: chi ci crede?', sintesi:'Secondo Kpler, l’export di greggio dallo Stretto di Hormuz è tornato sopra i livelli prima della guerra (19,5-22,5 milioni di barili al giorno). Il Brent resta a 101 dollari, QatarEnergy è ancora in "forza maggiore" e gli attacchi non si fermano.', perche:'Se il petrolio non scende nemmeno con i flussi normali, il prezzo di benzina e bollette sconta ancora la paura.', spunto:'Il mercato non paga il petrolio che c’è: paga il rischio che domani non ci sia.', tags:['X','Video']},
    {cat:'Azionario', rel:'Media', source:'Indiscrezioni di mercato (non confermato)', time:'10:30', title:'Alphabet vuole l’atomo per l’IA: maxi accordo con Constellation da oltre 1 miliardo', sintesi:'Secondo indiscrezioni, Alphabet, la società di Google, sarebbe vicina a un accordo pluriennale da oltre un miliardo di dollari con Constellation Energy per alimentare l’IA con energia nucleare. Non è confermato né da Alphabet né da Constellation.', perche:'Le bollette dell’IA sono enormi: chi controlla l’energia pulita e continua controlla il futuro dei data center.', spunto:'La vera corsa all’intelligenza artificiale non è sui chip, è sulle centrali: chi ha l’energia vince.', tags:['Threads','Video']},
    {cat:'Macro', rel:'Media', source:'Reuters / Banca Mondiale', time:'09:30', title:'La Banca Mondiale alza le stime sull’Asia: la spinta arriva dai chip dell’IA', sintesi:'La Banca Mondiale porta al 4,5% la crescita 2026 dell’Asia orientale, citando la forte domanda di hardware e semiconduttori per l’intelligenza artificiale.', perche:'Una parte della crescita mondiale oggi poggia sulla stessa scommessa che muove la Borsa: l’IA.', spunto:'Il mondo cresce meno per l’economia reale e più per la febbre dei chip: se la febbre passa, che cosa resta?', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph', time:'08:30', title:'Crypto, il denaro cambia cavallo: Bitcoin attira, Ethereum e Zcash perdono', sintesi:'I fondi ETF su Bitcoin raccolgono 241 milioni di dollari, terza settimana di fila; quelli su Ethereum perdono 138 milioni e Zcash registra il primo deflusso settimanale di sempre (circa 94 milioni). L’indice della paura e avidità è a 70, in zona "avidità".', perche:'Chi investe in crypto sta già scegliendo i suoi favoriti: Bitcoin come rifugio, il resto come scommessa.', spunto:'Le crypto non salgono più tutte insieme: Bitcoin resta il re, il resto è una lotteria.', tags:['X','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
