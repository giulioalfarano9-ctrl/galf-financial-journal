<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Lun 27 lug 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Geopolitica', rel:'Alta', source:'Reuters Business', time:'05:30', title:'Tregua tra USA e Iran: il petrolio crolla e le Borse tirano il fiato', sintesi:'Nel fine settimana Stati Uniti e Iran hanno sospeso gli attacchi dopo quasi due settimane di scontri sullo Stretto di Hormuz. Il Brent è crollato fino al 7%, tornando sotto i 90 dollari dai 102 della scorsa settimana, e i future di Wall Street sono saliti (Nasdaq +1,4%).', perche:'Meno tensione nel Golfo vuol dire benzina e bollette più leggere: la pace, quando arriva, la senti anche al distributore.', spunto:'Bastano due giorni di tregua per far crollare il petrolio del 7%: quello che paghiamo dipende più dalle notizie di guerra che dal mercato.', tags:['X','LinkedIn']},
    {cat:'Macro', rel:'Alta', source:'Reuters / CME FedWatch', time:'05:40', title:'La Fed decide mercoledì e stavolta si teme un rialzo, non un taglio', sintesi:'Mercoledì la banca centrale americana annuncia i tassi, fermi al 3,50-3,75% da quattro riunioni. Ma il nuovo presidente Kevin Warsh ha alzato la stima di inflazione al 3,6% e i mercati danno ormai un 25-30% di probabilità a un aumento. La maggioranza scommette comunque sul nulla di fatto, con i rialzi rimandati a settembre.', perche:'Se la Fed alza invece di tagliare, mutui e prestiti restano cari più a lungo: chi aspettava un po\' di respiro dovrà pazientare.', spunto:'Sei mesi fa tutti sognavano i tagli, ora si trema per un rialzo: sui mercati l\'entusiasmo arriva sempre troppo presto e si paga in ritardo.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Fortune / CNBC', time:'05:10', title:'Settimana da 470 miliardi: la grande tech mette sul tavolo i conti dell\'AI', sintesi:'Da martedì arrivano gli utili di Microsoft, Meta, Apple e Amazon. I quattro giganti quest\'anno spenderanno oltre 470 miliardi di dollari in intelligenza artificiale, contro i 350 del 2025. Il mercato non applaude più: vuole sapere quando quella montagna di spesa produrrà profitti veri.', perche:'Chi ha fondi pensione legati alla Borsa americana sta per scoprire se la scommessa sull\'AI regge o comincia a fare acqua.', spunto:'Spendono mezzo trilione in AI ma nessuno dice quando renderà: il mercato ha smesso di sognare e ha iniziato a chiedere il conto.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Markets.com', time:'05:25', title:'L\'oro sopra i 4.100 dollari: la paura torna a comprare rifugio', sintesi:'L\'oro è salito quasi dell\'1% oltre i 4.100 dollari l\'oncia, spinto da dollaro debole, rendimenti in calo e attesa per la Fed. Un rimbalzo dai minimi di nove mesi, proprio mentre il crollo del petrolio raffredda i timori sull\'inflazione.', perche:'Quando l\'oro sale prima di una riunione della Fed, è il mercato che si copre le spalle: un segnale di nervi tesi che riguarda tutti.', spunto:'L\'oro torna a correre proprio mentre il petrolio crolla: il mercato non crede alla calma e si tiene pronto al prossimo colpo.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / CoinMarketCap News', time:'05:00', title:'Bitcoin risale a 65 mila mentre torna un filo di coraggio', sintesi:'Bitcoin ha superato di nuovo i 65.000 dollari, in rialzo dell\'1% in un giorno, con l\'intero mercato crypto su dell\'1,7%. L\'indice di paura degli investitori è risalito da 26 a 30: ancora zona timore, ma un po\' meno buio di ieri.', perche:'Chi ha comprato crypto per diversificare vede un piccolo segnale di ripresa, ma il clima resta di prudenza, non di festa.', spunto:'Bitcoin recupera ma la paura resta padrona: finché l\'indice del terrore comanda, ogni rialzo è un passo su un filo teso.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Geopolitica', rel:'Alta', source:'Reuters Business', time:'13:30', title:'Trump ferma le bombe sull\'Iran: il petrolio crolla e i mercati tirano il fiato', sintesi:'Dopo tredici notti di attacchi, gli Stati Uniti hanno sospeso i raid sull\'Iran, aprendo a una possibile trattativa. Il petrolio è precipitato: il Brent ha perso quasi il 6% scendendo verso i 91 dollari, dopo aver sfiorato i 102 la settimana scorsa. È scattato il sollievo su tutto: salgono Borse, obbligazioni e oro, mentre il dollaro si indebolisce.', perche:'Meno bombe nel Golfo vuol dire benzina e bollette meno care: per una volta la geopolitica gioca a favore del nostro portafoglio, non contro.', spunto:'Basta una tregua di poche ore per far crollare il petrolio del 6%: il prezzo alla pompa non lo decide il mercato, lo decidono i missili.', tags:['X','LinkedIn']},
    {cat:'Azionario', rel:'Alta', source:'Bloomberg Markets', time:'13:00', title:'Settimana di conti per i giganti tech, e il mercato è in rivolta contro l\'AI', sintesi:'Da domani Microsoft, Apple, Amazon e Meta pubblicano i conti, e gli investitori vogliono una sola risposta: la spesa enorme per l\'intelligenza artificiale sta portando profitti veri? Chi ha frenato viene premiato: Apple, che ha evitato i grandi investimenti scegliendo di allearsi con altri, è salita del 15% a luglio. Microsoft, che spende tantissimo, perde il 18% da inizio anno.', perche:'Chi ha fondi legati alla tecnologia scoprirà questa settimana se la corsa all\'AI è un investimento serio o solo una montagna di soldi bruciati.', spunto:'Il mercato premia Apple che l\'AI la compra dagli altri e punisce Microsoft che la costruisce: spendere di più non è più sinonimo di valere di più.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Media', source:'Charles Schwab (Liz Ann Sonders)', time:'12:30', title:'Sonders: «È finita l\'era della calma, preparatevi agli shock a ripetizione»', sintesi:'Liz Ann Sonders, capo strategist di Charles Schwab, avverte che la lunga stagione di crescita tranquilla e prezzi stabili è finita. Ci aspetta un\'epoca "instabile", simile agli anni tra il 1960 e il 1990: inflazione ballerina, tensioni geopolitiche continue e shock sulle materie prime sempre più frequenti e violenti.', perche:'Se ha ragione, il vecchio consiglio "compra e aspetta con calma" non basta più: chi investe dovrà convivere con alti e bassi bruschi senza farsi prendere dal panico.', spunto:'Ci hanno cresciuti col mito dei mercati che salgono piano e sicuri: quel mondo è finito, e chi non se ne accorge investe guardando nello specchietto retrovisore.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Cointelegraph', time:'12:00', title:'Coinbase conquista l\'Europa, Binance costretta alla ritirata', sintesi:'Con una sola licenza ottenuta in Lussemburgo, Coinbase può ora operare legalmente in tutti i 27 Paesi dell\'Unione Europea grazie alle nuove regole europee sulle crypto ("MiCA"). La rivale Binance, che quella licenza non l\'ha ottenuta, dal 1° luglio ha smesso di servire i clienti europei, lasciati solo con la possibilità di ritirare i propri soldi. Fuori dai listini anche USDT, la principale moneta stabile.', perche:'Chi in Italia usa un\'app per le crypto scopre che d\'ora in poi conta chi ha il timbro di Bruxelles: le regole decidono chi resta e chi sparisce.', spunto:'Le crypto nate per sfuggire alle regole ora in Europa sopravvivono solo col bollino dello Stato: la libertà assoluta è durata giusto il tempo di diventare un business serio.', tags:['X','LinkedIn']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Trading Economics', time:'11:40', title:'L\'oro sale anche con il ritorno della calma: a spingerlo ora è il dollaro debole', sintesi:'Di solito quando torna la fiducia l\'oro scende, perché nessuno cerca più un rifugio. Oggi invece sale insieme a tutto il resto, oltre i 4.060 dollari l\'oncia. Il motivo è il dollaro, che si è indebolito con l\'allentarsi delle tensioni: un biglietto verde più debole rende l\'oro più conveniente per chi compra in altre valute.', perche:'Chi tiene oro come "assicurazione" scopre che oggi il suo prezzo dipende più dal dollaro che dalla paura: le vecchie regole del rifugio sicuro non valgono sempre.', spunto:'L\'oro che sale mentre tornano calma e fiducia manda un messaggio scomodo: non lo comprano più per paura, ma per scommettere contro il dollaro.', tags:['LinkedIn','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
