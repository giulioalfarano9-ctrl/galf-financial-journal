<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Gio 6 ago 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'CNBC / Reuters', time:'05:50', title:'SpaceX brucia 18 miliardi in tre mesi e il titolo crolla del 13%', sintesi:'SpaceX ha incassato più del previsto, 7,81 miliardi di dollari contro i 6,93 attesi, e ha perso meno del temuto. Ma gli investitori hanno guardato altrove: le spese per investimenti sono salite di oltre sei volte in un anno, a 18,37 miliardi in un solo trimestre, di cui 15,83 finiti nell\'intelligenza artificiale. Il titolo ha chiuso a 108,27 dollari, giù del 13,6%.', perche:'È il primo giorno in cui il mercato non ha applaudito la spesa in intelligenza artificiale ma l\'ha punita, e riguarda chiunque abbia risparmi legati al tech.', spunto:'Per la prima volta spendere in intelligenza artificiale non è stato premiato ma punito: il mercato ha smesso di chiedere quanto investi e ha iniziato a chiedere quando rientri.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Reuters / ADP', time:'05:40', title:'Il lavoro americano frena di colpo: solo 44 mila assunzioni a luglio', sintesi:'Le imprese private americane hanno creato appena 44 mila posti di lavoro a luglio, il dato peggiore da gennaio e molto sotto i 70 mila attesi. Il mercato ha subito ridotto le scommesse su un rialzo dei tassi a settembre, ora date al 57% contro il 67% del giorno prima.', perche:'Se le aziende smettono di assumere il costo del denaro può scendere prima del previsto, ma è una buona notizia che nasce da una brutta notizia.', spunto:'I mercati hanno festeggiato un dato sul lavoro debole: quando la disgrazia di chi cerca un impiego diventa la fortuna di chi investe, qualcosa nel meccanismo si è rotto.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Washington Post / CNBC', time:'05:30', title:'Il Dow non si ferma: quinto rialzo di fila e nuovo record, ma il Nasdaq arretra', sintesi:'Il Dow Jones ha guadagnato 263 punti (+0,49%) toccando un altro record, quinto giorno positivo consecutivo, spinto dai conti oltre le attese di Eli Lilly (+6,5%) e Disney (+2%). L\'S&P 500 ha però chiuso in calo dello 0,2% dopo aver segnato un nuovo massimo in giornata, e il Nasdaq ha perso lo 0,8%.', perche:'Le aziende di sempre, farmaci e intrattenimento, tirano il mercato mentre la tecnologia si ferma: il motore della Borsa sta cambiando.', spunto:'Sale il Dow e scende il Nasdaq: dopo due anni in cui contava solo la tecnologia, il mercato torna a pagare chi vende medicine e cartoni animati.', tags:['LinkedIn','Threads']},
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg', time:'05:20', title:'Iran e Oman trovano l\'intesa sulla rotta: Hormuz si avvicina alla riapertura', sintesi:'Iran e Oman hanno raggiunto un accordo su una rotta di navigazione attraverso lo Stretto di Hormuz, primo passo concreto verso il ritorno del petrolio dal Golfo. Un funzionario iraniano avverte però che l\'intesa regge solo se nessun terzo la ostacola. Il Brent resta sopra i 79 dollari e il greggio americano intorno ai 75, dopo aver perso l\'11% in tre sedute.', perche:'La guerra dura da sei mesi e ogni giorno di Stretto chiuso lo abbiamo pagato alla pompa: questa è la prima crepa vera nel muro.', spunto:'Un accordo tra Iran e Oman vale più di sei mesi di dichiarazioni americane: le crisi dell\'energia non le chiudono le superpotenze, le chiudono i vicini di casa.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Trading Economics', time:'05:10', title:'L\'oro torna ai massimi da giugno: 4.278 dollari e la corsa non si ferma', sintesi:'L\'oro è salito a 4.278 dollari l\'oncia (+0,72%), il livello più alto dal 18 giugno, con un guadagno del 4,2% in un mese e del 26% in un anno. A spingerlo il lavoro americano più debole e l\'attesa di una banca centrale meno dura.', perche:'Un metallo che vale un quarto in più rispetto a un anno fa racconta che la fiducia nel denaro normale si sta consumando.', spunto:'L\'oro guadagna il 26% in un anno mentre i governi giurano che l\'inflazione è sotto controllo: il mercato ha già votato, e non ha creduto a loro.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Fortune / CoinMarketCap News', time:'05:00', title:'Bitcoin risale a 64.800 e ormai si muove come il Dow', sintesi:'Bitcoin guadagna lo 0,82% a 64.808 dollari, sostenuto dai fondi quotati: 211 milioni di dollari di nuovi soldi in un giorno, di cui oltre 170 arrivati dal solo fondo di BlackRock. Oggi si muove quasi in parallelo con la Borsa americana, con una somiglianza vicina al 58%.', perche:'Chi ha comprato bitcoin per uscire dalla finanza tradizionale si ritrova un bene che sale e scende insieme a Wall Street.', spunto:'Bitcoin ormai copia il Dow Jones: nato per essere l\'alternativa alla finanza, è finito per diventarne un settore come gli altri.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'Reuters / Bloomberg', time:'13:15', title:'Palantir travolge le attese e vola del 17%: l\'AI regala ancora un trimestre record', sintesi:'Palantir, tra i simboli dell\'azionario legato all\'intelligenza artificiale, ha battuto tutte le stime: ricavi per 1,94 miliardi di dollari contro gli 1,80 attesi e utili a 41 centesimi per azione. L\'azienda ha alzato le previsioni per tutto l\'anno e il titolo è schizzato di quasi il 17%. A dare una spinta anche la scommessa su SpaceX, che ha aggiunto qualche centesimo agli utili.', perche:'Quando l\'azienda-bandiera dell\'AI supera ogni attesa e rilancia le stime, riaccende l\'entusiasmo su tutto il settore: chi ha fondi o risparmi legati al tech oggi respira.', spunto:'Palantir continua a battere le attese e il mercato applaude ancora, ma un titolo costretto a stupire ogni trimestre per non crollare non è un investimento solido: è una corsa che non può permettersi di rallentare mai.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Reuters / Bloomberg', time:'11:30', title:'La Fed di Warsh spiazza i mercati: meno riunioni e zero promesse sui tassi', sintesi:'Il presidente della banca centrale americana, Kevin Warsh, non ha dato indicazioni chiare sui prossimi mesi e sta valutando di ridurre il numero di riunioni della Fed, oggi otto l\'anno. Risultato: le scommesse degli investitori si sono spaccate, e una parte del mercato ora prezza persino un possibile rialzo dei tassi a settembre (circa il 63% di probabilità) invece del taglio dato per scontato.', perche:'Meno riunioni e meno parole significano più incertezza su mutui e prestiti: quando la banca centrale parla poco, a pagare l\'ansia sono le famiglie e le imprese che non sanno cosa aspettarsi.', spunto:'Un mercato che dava i tagli per certi ora teme un rialzo: la verità è che nessuno sa cosa farà la Fed, e chi investe fingendo di saperlo si sta solo raccontando una favola.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Trading Economics', time:'10:15', title:'L\'oro resta aggrappato sopra i 4.000 dollari: la corsa al rifugio non si spegne', sintesi:'Il prezzo dell\'oro è risalito oltre i 4.050 dollari l\'oncia, recuperando le perdite dei giorni scorsi. A sostenerlo è la ripresa dei colloqui di pace tra Stati Uniti e Iran annunciata da Trump, che ha fatto crollare il petrolio e allentato la paura dell\'inflazione, alimentando la scommessa su tassi più bassi.', perche:'L\'oro alto è il termometro della paura: se resta vicino ai record anche mentre in Medio Oriente si tratta la pace, vuol dire che gli investitori non si fidano ancora della calma apparente.', spunto:'Il petrolio scende per la pace e l\'oro resta ai massimi per la paura: quando il rifugio non si svuota nemmeno con le buone notizie, è il mercato stesso a dirti che non crede al lieto fine.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'CNBC / Bloomberg', time:'12:20', title:'SpaceX oggi al primo bilancio da quotata: attese quasi 2 miliardi di perdite', sintesi:'A poche settimane dal debutto in Borsa, il più grande della storia con una valutazione vicina ai 1.750 miliardi di dollari, SpaceX pubblica oggi i suoi primi conti trimestrali. Gli analisti stimano una perdita netta di circa 1,9 miliardi e vogliono capire quanto incassa davvero Starlink e quanto verrà bruciato negli investimenti in intelligenza artificiale.', perche:'È il primo vero esame di trasparenza per l\'azienda di Elon Musk: dopo lo sbarco record in Borsa, i lanci spettacolari non bastano più, contano i numeri.', spunto:'Vale 1.750 miliardi ma potrebbe perderne quasi 2 in tre mesi: SpaceX si è sempre misurata in razzi lanciati, ma prima o poi il mercato la peserà in dollari bruciati.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'Reuters / Saxo', time:'12:45', title:'Tocca ad AMD: ricavi attesi in crescita del 46%, ma il metro resta Nvidia', sintesi:'AMD, tra i grandi produttori di chip, pubblica oggi i conti: gli analisti stimano ricavi per 11,2 miliardi di dollari, in crescita del 46% in un anno, e utili per azione a 1,67 dollari. Numeri forti, ma il mercato la giudica sempre nel confronto con la dominante Nvidia nella corsa ai chip per l\'intelligenza artificiale.', perche:'AMD è la principale sfidante nella gara dei chip per l\'AI: i suoi conti dicono se qualcuno può davvero insidiare il quasi-monopolio di Nvidia o se la partita è già decisa.', spunto:'AMD cresce del 46% e resta comunque l\'eterna seconda: nel mercato dell\'AI non basta correre forte, se davanti c\'è qualcuno che vale dieci volte di più e detta le regole.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Cointelegraph', time:'09:30', title:'Bitcoin regge i 64 mila dollari, ma un\'ondata di furti scuote i portafogli', sintesi:'Bitcoin è risalito verso i 64 mila dollari, riprendendosi dopo il calo di lunedì. Ma sotto la superficie cresce l\'allarme sicurezza: centinaia di bitcoin sono stati svuotati da alcuni portafogli Coldcard, e un servizio di scambio molto usato, Boltz, ha sospeso l\'attività dopo un attacco informatico aiutato dall\'intelligenza artificiale.', perche:'Per chi tiene risparmi in crypto è il rischio più concreto: il prezzo può anche reggere, ma se i tuoi soldi digitali vengono rubati non c\'è banca che te li restituisca.', spunto:'Bitcoin tiene il prezzo mentre i ladri usano l\'AI per svuotare i portafogli: nel mondo crypto la vera minaccia non è più l\'altalena delle quotazioni, è che la tecnologia che lo esalta è la stessa che lo saccheggia.', tags:['X','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
