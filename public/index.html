<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Mer 11 nov 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'Eurasia Business News (dati CNBC) / Rio Times', time:'06:00', title:'Il debito Usa tocca il 5%: Wall Street chiude in rosso e i mutui restano cari', sintesi:'Dopo l’inflazione di ottobre più alta del previsto (+0,4% in un mese), il rendimento dei titoli di Stato Usa a 10 anni ha superato per qualche momento il 5%. Martedì l’S&P 500 ha chiuso a 7.520 punti (-0,38%) e il Nasdaq a -0,74%; sulle piattaforme di scommesse (Polymarket) un rialzo dei tassi a dicembre vale ormai l’85,5%.', perche:'Quando lo Stato americano paga il 5% per farsi prestare soldi, mutui, prestiti e Borsa diventano più cari per tutti, anche in Europa.', spunto:'Con il debito Usa al 5% il denaro facile è finito: chi continua a comprare Borsa a debito sta giocando con la miccia accesa.', tags:['LinkedIn','Video']},
    {cat:'Azionario', rel:'Alta', source:'Fortune / Anthropic', time:'06:10', title:'Anthropic va in Borsa nel mezzo della tempesta: chiede fino a 1.400 miliardi', sintesi:'Anthropic, l’azienda che sviluppa l’intelligenza artificiale Claude, ha fissato il prezzo delle sue azioni tra 70 e 78 dollari: fino a 1.400 miliardi di valore e 64,4 miliardi raccolti. Lo sbarco al Nasdaq (sigla “ANT”) è atteso la prossima settimana, proprio mentre i titoli dell’IA perdono terreno.', perche:'È uno dei più grandi debutti in Borsa di sempre: dirà se i risparmiatori credono ancora nell’IA o se la festa è finita.', spunto:'Quotarsi mentre il Nasdaq sanguina è la prova della verità: se il mercato compra a questi prezzi la bolla IA non è scoppiata, se non compra lo scopriremo tutti insieme.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Kitco (via Eurasia Business News)', time:'06:20', title:'L’oro crolla del 2,6%: il bene rifugio perde la sfida contro i tassi', sintesi:'L’oro è sceso di circa il 2,6%, intorno a 4.030 dollari l’oncia, e l’argento del 3,5%. Il motivo: con i titoli di Stato Usa che rendono quasi il 5% e un dollaro più forte, tenere un metallo che non paga interessi conviene meno.', perche:'Chi ha comprato oro “per stare tranquillo” scopre che anche il rifugio può perdere parecchio in un giorno solo.', spunto:'L’oro non è una cassaforte, è una scommessa sui tassi: quando i tassi salgono, il tuo “porto sicuro” affonda come tutto il resto.', tags:['X','Threads']},
    {cat:'Geopolitica', rel:'Media', source:'Angel One / Bloomberg (via Rigzone)', time:'06:30', title:'Petrolio ai minimi da agosto: Trump frena sugli attacchi, ma l’Iran alza il prezzo della pace', sintesi:'Il Brent, riferimento mondiale del greggio, viaggia intorno a 92 dollari e il petrolio Usa a 86, vicini ai minimi da fine agosto e quasi il 20% sotto il picco di ottobre. Trump dice che nuovi attacchi all’Iran potrebbero non servire più, ma Teheran chiede la fine di sanzioni e blocco navale prima di trattare, e nello stretto di Hormuz le navi vengono ancora colpite.', perche:'Benzina e bollette dipendono da questa trattativa: una frase sbagliata e i prezzi ripartono in un attimo.', spunto:'Il mercato festeggia una pace che non esiste ancora: il petrolio scende sulle speranze, ma a Hormuz si spara ancora.', tags:['X','Video']},
    {cat:'Crypto', rel:'Media', source:'Coinpedia (dati CoinMarketCap e SoSoValue)', time:'06:40', title:'Bitcoin rialza la testa a 75.000 dollari, ma i grandi fondi continuano a scappare', sintesi:'Dopo cinque settimane di cali il bitcoin è risalito fino a 75.431 dollari, per poi tornare poco sotto 75.000. Intanto dai fondi ETF sul bitcoin (prodotti di Borsa che lo replicano) sono usciti 1,18 miliardi di dollari in tre settimane, e molti trader temono un rimbalzo di breve durata.', perche:'Se i grandi investitori vendono mentre il prezzo risale, chi compra adesso rischia di fare da paracadute agli altri.', spunto:'Un rimbalzo con i grandi fondi in fuga non è una ripresa: è l’uscita di sicurezza che qualcuno sta usando prima di te.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'Bloomberg / Reuters (via Investing.com)', time:'12:30', title:'La Fed mostra i denti: Waller apre a mezzo punto, Logan vuole almeno due rialzi', sintesi:'Dopo l’inflazione di ottobre sopra le attese, il governatore della Fed Christopher Waller ha detto che a dicembre (riunione dell’8-9) un aumento dei tassi è probabile e che va valutato anche mezzo punto, perché un quarto rischia di intaccare la credibilità della banca centrale. Lorie Logan (Fed di Dallas) chiede almeno altri due rialzi da un quarto di punto.', perche:'Più la Fed alza i tassi, più costano mutui, prestiti e debiti in tutto il mondo: il rincaro arriva anche nelle tasche europee.', spunto:'La Fed ammette di essere in ritardo sull’inflazione: ora rischia di correggere l’errore frenando troppo forte, e il conto lo pagherà l’economia reale.', tags:['LinkedIn','Video']},
    {cat:'Azionario', rel:'Alta', source:'City AM / TheStreet', time:'12:45', title:'CoreWeave vola del 14%: ricavi quasi triplicati, ma i debiti fanno paura', sintesi:'CoreWeave, che affitta potenza di calcolo per l’intelligenza artificiale, ha visto i ricavi del trimestre salire del 168% a 3,66 miliardi di dollari e ha alzato le stime 2026 a 13-13,3 miliardi. Il titolo sale di circa il 14% prima dell’apertura, dopo aver perso oltre il 40% in un mese, ma resta una perdita di 709 milioni e debiti per 35,6 miliardi.', perche:'Chi investe nell’IA tramite fondi è esposto a società come questa: crescono a razzo, ma vivono a debito.', spunto:'Triplicare i ricavi e perdere ancora 700 milioni non è un trionfo: è una scommessa a debito che regge solo finché i tassi lo permettono.', tags:['X','LinkedIn']},
    {cat:'Azionario', rel:'Media', source:'CNBC / City AM', time:'13:00', title:'Nvidia rimbalza del 5%, ma Morgan Stanley la toglie dai titoli preferiti', sintesi:'Dopo due sedute nere che hanno bruciato circa 430 miliardi di dollari di valore, Nvidia recupera intorno al 5%. L’azienda ha affidato allo studio legale Wachtell, Lipton una verifica indipendente sul caso che coinvolge il capo Jensen Huang, mentre Morgan Stanley l’ha tolta dalla lista dei titoli consigliati; i conti arrivano il 17 novembre.', perche:'Nvidia pesa in quasi ogni fondo e piano di accumulo: il suo umore oggi è l’umore dei tuoi risparmi.', spunto:'Un rimbalzo del 5% dopo aver perso 430 miliardi non è una ripresa: è il mercato che spera di non dover fare i conti con un caso ancora tutto da chiarire.', tags:['X','Video']},
    {cat:'Geopolitica', rel:'Media', source:'AFP / TheStreet', time:'11:15', title:'Petroliera in fiamme su una mina a Hormuz: il greggio rialza la testa', sintesi:'Secondo l’esercito iraniano, citato da AFP, una petroliera ha urtato una mina e ha preso fuoco nello stretto di Hormuz, il passaggio da cui transita una grossa fetta del petrolio mondiale. Il Brent risale dell’1,3% a 92,7 dollari e il petrolio Usa a 86,6, dopo i minimi da fine agosto toccati ieri.', perche:'Basta una nave in fiamme per ricordare che il prezzo della benzina si decide in pochi chilometri di mare.', spunto:'Ieri il mercato festeggiava la pace, oggi una mina gli ricorda che a Hormuz la guerra non è finita: scommettere sul petrolio a buon mercato è un azzardo.', tags:['X','Threads']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph / Saxo', time:'13:15', title:'Barclays e Citi comprano bitcoin proprio mentre il mercato scappa', sintesi:'A fine settembre Barclays aveva aumentato del 48% la sua quota nel fondo di BlackRock sul bitcoin (un prodotto di Borsa che ne segue il prezzo), arrivando a 187 milioni di dollari, e Citigroup è entrata nel fondo di Fidelity con 119 milioni. Oggi il bitcoin resta intorno a 73.700 dollari, vicino ai minimi da 11 settimane, con il quarto giorno di fila di uscite dai fondi.', perche:'Quando le grandi banche entrano mentre il prezzo scende, il bitcoin smette di essere un gioco per pochi e diventa un prodotto da sportello.', spunto:'Mentre i risparmiatori vendono per paura, le banche comprano in silenzio: nel bitcoin i soldi passano sempre da chi ha fretta a chi ha pazienza.', tags:['Threads','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
