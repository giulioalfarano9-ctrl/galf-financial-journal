<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Ven 4 set 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'CNBC / Bloomberg', time:'06:00', title:'Oggi l\'America conta i posti di lavoro e Wall Street resta immobile', sintesi:'I futures americani sono fermi in attesa del dato sull\'occupazione di agosto, in arrivo alle 14:30 italiane. L\'anticipazione delle aziende private parla di appena 38.000 assunzioni, contro le 47.000 attese e le 46.000 di luglio. Giovedì gli indici avevano chiuso in forte rialzo: Dow +1,18%, S&P 500 +1,06%, Nasdaq +1,4%.', perche:'Se il lavoro americano rallenta davvero, la Fed dovrà scegliere tra proteggere gli stipendi e frenare i prezzi: da quella scelta passa il costo dei mutui anche qui.', spunto:'Un mercato che sale dell\'1% e poi si blocca aspettando un solo numero non sta investendo: sta giocando a carte scoperte a metà.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Reuters / NPR', time:'06:20', title:'La Casa Bianca vuole i tassi giù, la Fed minaccia di alzarli', sintesi:'Il vicepresidente JD Vance ha chiesto pubblicamente alla Federal Reserve di tagliare i tassi per rendere le case più accessibili. Il presidente della Fed Kevin Warsh spinge nella direzione opposta: le condizioni finanziarie, ha detto, non sono abbastanza severe, con i prezzi ancora in crescita del 3,4% in un anno.', perche:'Quando governo e banca centrale tirano da parti opposte, l\'incertezza la pagano i risparmi di chi sta a guardare.', spunto:'L\'indipendenza di una banca centrale non si difende con i comunicati: se il potere politico detta i tassi in pubblico, quella parola è già solo arredamento.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Yahoo Finance / Bloomberg', time:'06:35', title:'Nvidia si compra Hugging Face: 13 miliardi per il cuore dell\'AI aperta', sintesi:'Nvidia ha annunciato l\'acquisto di Hugging Face per quasi 13 miliardi di dollari. È la piattaforma dove gli sviluppatori di tutto il mondo condividono gratuitamente i modelli di intelligenza artificiale. Il capo di Nvidia, Jensen Huang, ha spiegato che i modelli aperti contano moltissimo per l\'azienda.', perche:'Chi vende i chip adesso possiede anche la piazza in cui quel software viene distribuito: meno concorrenza, più potere in mano a una sola azienda.', spunto:'L\'intelligenza artificiale aperta è appena stata comprata da chi vende le macchine per farla girare: aperta a chi, esattamente?', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Trading Economics / Reuters', time:'07:00', title:'Il petrolio torna ai massimi di sei settimane e quasi nessuno lo guarda', sintesi:'Il Brent viaggia intorno ai 96 dollari al barile e il greggio americano ai 92, ai livelli più alti da sei settimane, spinti dal rischio che la guerra in Medio Oriente interrompa le forniture.', perche:'Il petrolio caro è il motivo principale per cui i prezzi non scendono: arriva nella bolletta e nel carrello molto prima che in qualsiasi statistica.', spunto:'Discutiamo di tassi di interesse mentre l\'inflazione che paghiamo la decide una petroliera nel Golfo: contro la geografia, la politica monetaria perde sempre.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'TechTimes', time:'07:25', title:'Vince chi vende le pale, non chi cerca l\'oro: i chip travolgono i giganti del web', sintesi:'Micron è salita del 220% e Marvell del 185%, mentre il paniere dei sette grandi nomi tecnologici americani guadagna appena il 4%. Nvidia ha chiuso il trimestre con 96,2 miliardi di dollari di ricavi, il record assoluto per un\'azienda di semiconduttori.', perche:'Chi ha comprato i soliti nomi famosi credendo di puntare sull\'intelligenza artificiale ha guadagnato quasi nulla, mentre i soldi veri finivano altrove.', spunto:'Nella corsa all\'oro digitale non stanno vincendo i cercatori ma chi vende le pale: comprare i big della tecnologia è ormai il modo più caro di arrivare tardi.', tags:['X','LinkedIn']},
    {cat:'Crypto', rel:'Media', source:'DailyCoin / Cointelegraph', time:'07:40', title:'Il bitcoin risale a 82 mila dollari e aspetta il verdetto americano', sintesi:'Il bitcoin è salito del 6,8% in ventiquattro ore fino a 82.200 dollari, massimo da maggio, dopo che le parole del governatore della Fed Christopher Waller hanno raffreddato le attese di un rialzo dei tassi. L\'intero mercato delle criptovalute è cresciuto del 3,7%, a 2.814 miliardi di dollari.', perche:'Il bitcoin ormai sale e scende come un qualsiasi titolo tecnologico: conta più la Fed di qualunque promessa di indipendenza.', spunto:'La moneta nata per liberarci dalle banche centrali guadagna il 7% perché un banchiere centrale ha cambiato tono: la rivoluzione ha un padrone, e si chiama Federal Reserve.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'24/7 Wall St. / Motley Fool', time:'08:15', title:'Broadcom cresce del 221% sull\'intelligenza artificiale e la Borsa la punisce lo stesso', sintesi:'Nel trimestre Broadcom ha incassato 29,6 miliardi di dollari, con i ricavi legati all\'intelligenza artificiale saliti del 221% a 16,7 miliardi, sopra i 15,9 attesi. Il titolo è comunque arrivato a perdere il 6%: per il trimestre in corso la società prevede 34,8 miliardi, poco sotto i 35,03 che il mercato aspettava.', perche:'Se una crescita del 221% non basta più a soddisfare nessuno, sul prezzo di questi titoli è già scontato un futuro perfetto che nessuno può garantire.', spunto:'Crescere del 221% e perdere il 6% in Borsa non è un paradosso: è la prova che sull\'intelligenza artificiale il mercato non compra più i risultati, compra le promesse.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNBC / Zacks', time:'09:10', title:'Il rialzo dei tassi americano non è più scontato: le scommesse crollano al 50%', sintesi:'Dopo le parole del governatore della Fed Christopher Waller, che vuole lasciare i tassi fermi a settembre salvo sorprese sull\'inflazione, le probabilità di un aumento sono scese al 50,5% dal 67% del giorno prima. Il rendimento del titolo di Stato americano a dieci anni è calato al 4,77% dal 4,818%.', perche:'Alle 14:30 arriva il dato sui posti di lavoro di agosto: da quel numero dipende se il denaro costerà di più, e i mutui non conoscono confini.', spunto:'Metà del mercato scommette sul rialzo e metà sul nulla di fatto: quando la banca centrale più potente del mondo è imprevedibile come un lancio di monetina, il problema non sono i dati, è chi li racconta.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Reuters / Trading Economics', time:'10:30', title:'Il petrolio del Medio Oriente sta facendo saltare i conti del debito europeo', sintesi:'La ripresa dei combattimenti in Medio Oriente ha spinto in alto il greggio e con esso l\'inflazione attesa. Il rendimento del titolo di Stato tedesco a trent\'anni è salito al massimo da quindici anni, quello francese al livello più alto dal 2008. L\'inflazione dell\'area euro ad agosto è al 3,3%, il massimo da tre anni.', perche:'Rendimenti più alti vogliono dire che gli Stati pagano di più per indebitarsi, e quei soldi escono dalla stessa cassa che paga sanità e scuola.', spunto:'Una guerra a cinquemila chilometri di distanza è appena diventata una voce di spesa nel bilancio tedesco: chi crede ancora che la geopolitica non tocchi il portafoglio non ha guardato i rendimenti a trent\'anni.', tags:['LinkedIn','Threads']},
    {cat:'Commodities', rel:'Media', source:'Trading Economics / FXStreet', time:'11:45', title:'Oro e petrolio salgono insieme: il mercato si sta comprando un\'assicurazione', sintesi:'L\'oro è tornato vicino ai 4.500 dollari l\'oncia dopo due sedute di rialzo, recuperando dai minimi delle ultime tre settimane grazie al dollaro e ai rendimenti in calo. Il Brent viaggia intorno ai 95 dollari al barile ed è avviato a chiudere la settimana con circa l\'8% di guadagno, per le tensioni sullo Stretto di Hormuz.', perche:'Oro e petrolio salgono insieme solo quando i mercati hanno paura di due cose alla volta: che i prezzi corrano e che qualcosa si rompa.', spunto:'Quando oro e petrolio corrono insieme il mercato non sta scommettendo sulla crescita: sta comprando un\'assicurazione contro il disastro, e la sta pagando carissima.', tags:['X','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Coinotag', time:'12:20', title:'I fondi sul bitcoin incassano 731 milioni in un giorno, l\'ethereum ne perde 48', sintesi:'Il 3 settembre i fondi americani che replicano il bitcoin hanno raccolto 730,8 milioni di dollari, il flusso giornaliero più alto dal 14 gennaio: 454 milioni sono finiti nel solo fondo di BlackRock. Nella stessa giornata i fondi sull\'ethereum hanno subito uscite per 48,2 milioni.', perche:'I soldi nuovi non si distribuiscono più su tutte le criptovalute: si concentrano su una sola, gestita in larga parte da un\'unica società.', spunto:'Il mondo nato per eliminare gli intermediari affida oggi i suoi soldi al più grande gestore di fondi del pianeta: chiamatela decentralizzazione, ma l\'indirizzo è uno solo.', tags:['X','LinkedIn']},
    {cat:'Crypto', rel:'Media', source:'Yahoo Finance / crypto.news', time:'13:10', title:'Le criptovalute americane si giocano tutto in un voto del 15 settembre', sintesi:'Il Senato americano vota il 15 settembre la procedura che apre il dibattito sul CLARITY Act, la legge che dovrebbe stabilire una volta per tutte chi controlla le criptovalute. Servono 60 voti su 100: i repubblicani ne hanno 53 e almeno tre sono contrari, quindi senza una decina di voti democratici la legge si ferma lì.', perche:'Se salta, gli Stati Uniti restano senza regole chiare sulle criptovalute almeno fino al 2029 e il settore continua a muoversi in una zona grigia.', spunto:'Un settore da migliaia di miliardi di dollari dipende oggi da dieci senatori indecisi: non è finanza del futuro, è una scommessa sul Congresso americano.', tags:['LinkedIn','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
