<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Lun 31 ago 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Geopolitica', rel:'Alta', source:'CNN / CNBC / Washington Post', time:'06:10', title:'Gli Stati Uniti bombardano l\'isola di Larak: l\'Iran stava per minare lo Stretto di Hormuz', sintesi:'Domenica le forze americane hanno distrutto due lanciarazzi iraniani sull\'isola di Larak, sorpresi mentre si preparavano a sparare mine navali dentro lo Stretto di Hormuz. È il primo attacco americano da oltre un mese. I Guardiani della rivoluzione hanno confermato i morti e promesso una risposta; il petrolio è salito subito del 2%.', perche:'Minare quel braccio di mare significa bloccare per anni la rotta da cui passava un quinto del petrolio mondiale, con effetti diretti su benzina e bollette.', spunto:'Non stiamo assistendo a una crisi che si raffredda ma a una che si incancrenisce: sei mesi dopo, l\'unica cosa che tiene aperto lo Stretto di Hormuz sono i missili americani, non la diplomazia.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNBC / CME FedWatch', time:'06:35', title:'Alzare i tassi non è più l\'ipotesi estrema: ora è quella favorita', sintesi:'Dopo il discorso di Warsh a Jackson Hole le scommesse su un aumento dei tassi il 16 settembre sono salite intorno al 56-58% sui futures, mentre la piattaforma Kalshi si ferma al 48%. L\'inflazione misurata dall\'indice preferito dalla Fed resta al 3,7%, e la componente di fondo al 3,3%: sessantacinque mesi consecutivi sopra l\'obiettivo del 2%.', perche:'Se la Fed alza davvero, salgono i costi dei prestiti in tutto il mondo, Italia compresa, e scende il valore di quasi ogni investimento.', spunto:'Cinque anni e mezzo di inflazione sopra l\'obiettivo e la banca centrale più potente del mondo deve ancora decidere se muoversi: a un certo punto smette di essere pazienza e diventa resa.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Alta', source:'Business Today / Reuters', time:'07:05', title:'Scoppia una guerra e l\'oro crolla: il bene rifugio smette di fare il rifugio', sintesi:'Nonostante i raid americani in Iran, l\'oro è sceso dello 0,91% a 4.488,60 dollari l\'oncia. I fondi quotati sull\'oro hanno perso fino al 3,59% e quelli sull\'argento fino al 4,06%. Il motivo è tutto nei tassi: con il petrolio in rialzo e i rendimenti in salita, tenere metallo che non paga interessi costa troppo.', perche:'Se anche il rifugio classico scende quando arrivano le bombe, chi cerca protezione non sa più dove metterla.', spunto:'Ci hanno venduto l\'oro per trent\'anni come l\'assicurazione contro le guerre: arriva la guerra e l\'oro scende. La verità è che oggi comanda un solo prezzo, quello dei tassi, e tutto il resto è racconto.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / crypto.news', time:'07:30', title:'Bitcoin scende a 77 mila dollari e i grandi fondi tirano il freno dopo nove giorni', sintesi:'La criptovaluta ha chiuso domenica a 77.668 dollari, in calo dello 0,74%, con Ethereum a 2.418 e Solana giù del 3,57%. Venerdì i fondi quotati americani hanno interrotto nove sedute consecutive di acquisti con 201,8 milioni di dollari usciti. Agosto resta comunque il mese migliore dell\'anno, sopra i 3 miliardi raccolti.', perche:'Bastano poche frasi di un banchiere centrale per invertire la direzione di miliardi: è il contrario di quello che una moneta indipendente dovrebbe fare.', spunto:'Bitcoin doveva essere l\'alternativa alle banche centrali e si muove ormai come il più docile dei titoli di Stato: l\'indipendenza dalla politica monetaria è durata finché nessuno la metteva alla prova.', tags:['X','LinkedIn']},
    {cat:'Azionario', rel:'Media', source:'CNBC / TheStreet', time:'07:50', title:'Wall Street apre la settimana in retromarcia, stretta fra la guerra e la Fed', sintesi:'I futures americani sono scivolati lunedì mattina: Dow giù di 64 punti (-0,12%) e S&P 500 in calo dello 0,1%, dopo la chiusura negativa di venerdì. Gli investitori si trovano davanti a due pressioni opposte nello stesso momento: il rincaro dell\'energia da una parte e la prospettiva di tassi più alti dall\'altra.', perche:'Sono le due forze che decidono quanto renderanno i risparmi di chi ha un fondo pensione o un piano di accumulo.', spunto:'Guerra che rincara l\'energia e banca centrale pronta a stringere: è la combinazione che negli anni Settanta ha bruciato un decennio di risparmi, e nessuno oggi la sta chiamando col suo nome.', tags:['LinkedIn','Threads']},
    {cat:'Macro', rel:'Media', source:'Eurostat / CaixaBank Research', time:'08:15', title:'Domani il dato che dirà se anche l\'Europa deve tornare ad alzare i tassi', sintesi:'Martedì 1° settembre Eurostat pubblica la stima dell\'inflazione dell\'area euro di agosto. A luglio era al 2,9%, spinta dall\'energia salita del 10,3% in un anno. I membri della Bce entrano ora nel periodo di silenzio prima della riunione del 10 settembre.', perche:'Da quel numero dipende se in autunno le rate dei mutui a tasso variabile in Italia ricominceranno a salire.', spunto:'L\'inflazione europea non è tornata per colpa degli stipendi né dei consumi: è tornata perché l\'energia costa il 10% in più, e l\'energia costa di più per scelte politiche che nessuno vuole rivendicare.', tags:['LinkedIn','Threads']}
  ],
  afternoon: [
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg / IRGC', time:'09:20', title:'Iran e Oman si spartiscono lo Stretto di Hormuz e iniziano a far pagare il pedaggio', sintesi:'I Guardiani della rivoluzione iraniani hanno annunciato un accordo con l\'Oman per dividersi le acque dello Stretto di Hormuz e gli incassi dei pedaggi sulle navi che lo attraversano. Le rotte sono già tracciate: chi entra nel Golfo passerà interamente in acque iraniane, chi esce attraverserà anche quelle omanite. Lo stretto però resta chiuso finché Washington non accetta le condizioni di Teheran.', perche:'Prima della guerra da lì passava un quinto del petrolio e del gas del mondo: se torna a scorrere, scorrerà a pagamento, e quel pagamento finisce nel prezzo di tutto.', spunto:'Non stanno riaprendo una rotta commerciale, stanno costruendo un casello: l\'Occidente ha lasciato che un quinto della sua energia diventasse un pedaggio riscosso da chi gli ha dichiarato guerra economica.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Liz Ann Sonders (Charles Schwab)', time:'10:15', title:'Due sole aziende di chip valgono un terzo della crescita di tutta Wall Street', sintesi:'La capo strategist di Charles Schwab, Liz Ann Sonders, avverte che due soli titoli di semiconduttori pesano per quasi un terzo della crescita degli utili attesa nel 2026 per l\'intero indice S&P 500. Il rialzo si sta allargando a più settori, dice, ma gli utili no: restano concentrati dove erano.', perche:'Se hai un fondo che "replica il mercato americano", stai già scommettendo molto più di quanto credi su due aziende sole.', spunto:'Chiamare diversificato un indice in cui due società fanno un terzo della crescita è la truffa semantica più diffusa della finanza: comprare tutto oggi significa comprare due nomi.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNBC / CME FedWatch', time:'11:05', title:'Il decennale americano vola al 4,73% e il rialzo dei tassi diventa lo scenario più probabile', sintesi:'Dopo le parole di Warsh il rendimento del Treasury a dieci anni è salito al 4,73% e quello a due anni ha guadagnato oltre sei centesimi arrivando al 4,30%. Le scommesse su un aumento dei tassi il 16 settembre sono passate dal 35,4% al 57,5%: per la prima volta il rialzo è l\'ipotesi favorita, non più quella remota.', perche:'Quel numero decide il costo dei mutui americani e il prezzo del debito in tutto il mondo, Italia compresa.', spunto:'I mercati hanno passato un anno a scommettere sui tagli e ora scoprono di aver sbagliato direzione: chi ha comprato obbligazioni aspettando i tassi giù sta pagando il conto di una previsione presa per certezza.', tags:['LinkedIn','Threads']},
    {cat:'Commodities', rel:'Media', source:'Trading Economics / Reuters', time:'12:10', title:'L\'oro tocca 4.631 dollari mentre il petrolio perde il 5% in una settimana', sintesi:'L\'oro ha chiuso a 4.631,5 dollari l\'oncia, a un passo dal record, mentre il Brent è arretrato verso gli 88 dollari con un calo settimanale superiore al 5%. Gli operatori hanno smesso di leggere l\'Iran come un rischio per le forniture e hanno iniziato a trattarlo come una questione di sanzioni: le esportazioni dal Golfo sono risalite a 15-16 milioni di barili al giorno.', perche:'Il pieno costa meno perché il petrolio torna a circolare, ma l\'oro ai massimi dice che nessuno si fida di quanto durerà.', spunto:'Petrolio giù e oro su nella stessa settimana: il mercato ha smesso di temere la guerra e ha iniziato a temere la pace armata, che dura di più e costa di più.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Cointelegraph', time:'12:55', title:'Bitcoin scende a 77.678 dollari e i fondi interrompono nove giorni di acquisti', sintesi:'La criptovaluta ha perso il 3,3% dalla chiusura di giovedì a 80.275 dollari, scivolando a 77.678. I fondi quotati americani hanno spezzato una serie di nove sedute consecutive di raccolta con 202 milioni di dollari usciti in un giorno solo. Agosto resta comunque il mese migliore dell\'anno, con 3,3 miliardi entrati.', perche:'Bastano poche frasi di un banchiere centrale per cancellare in una notte tre giorni di guadagni: chiamarla riserva di valore è generoso.', spunto:'Bitcoin doveva essere l\'assicurazione contro le banche centrali e crolla ogni volta che una banca centrale apre bocca: l\'unica cosa da cui protegge davvero è dal restare calmi.', tags:['X','Threads']},
    {cat:'Macro', rel:'Media', source:'Mohamed El-Erian (Allianz)', time:'13:35', title:'El-Erian applaude Warsh e indica il punto che nessuno ha notato: l\'intelligenza artificiale come nuovo fattore di produzione', sintesi:'Il consigliere economico di Allianz ha definito il discorso di Warsh chiaro e potente, all\'altezza di attese altissime. Ma il passaggio che lo ha colpito di più non riguarda i tassi: è l\'idea del presidente della Fed che l\'intelligenza artificiale vada trattata come un fattore di produzione nuovo, alla pari di lavoro e capitale.', perche:'Se una banca centrale mette le macchine accanto alle persone nel calcolo di quanto vale il lavoro, cambia il modo in cui verranno decisi salari e prezzi.', spunto:'Il passaggio più importante di Jackson Hole non erano i tassi: era la Fed che ammette in pubblico che l\'intelligenza artificiale conta quanto il lavoro umano nel far girare l\'economia.', tags:['LinkedIn','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
