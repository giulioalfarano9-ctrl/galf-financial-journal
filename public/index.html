<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Gio 26 nov 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'Reuters Business', time:'06:00', title:'Oggi il giorno della verità: la Fed è pronta ad alzare i tassi', sintesi:'Le scommesse sui mercati danno al 97% un rialzo dei tassi Usa il 9 dicembre e al 66% un altro a gennaio. Oggi alle 14:30 italiane arriva il PCE, l’indice dei prezzi che la Fed guarda di più (atteso +0,3% in un mese), insieme alla stima del Pil (attesa +3,5%).', perche:'Se i prezzi sorprendono al rialzo, mutui e prestiti diventano più cari per tutti, anche in Europa.', spunto:'Chi aspettava tassi più bassi si è sbagliato di grosso: il denaro facile è finito e nessuno ha il coraggio di dirlo ad alta voce.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Reuters / Yahoo Finance', time:'22:15', title:'Wall Street si spacca: il Dow sfonda quota 50.000, i chip crollano', sintesi:'Martedì il Dow Jones, l’indice delle grandi aziende tradizionali, ha chiuso a 50.019 punti (+0,85%), mentre il Nasdaq dei titoli tech ha perso l’1,48% e l’indice dei chip il 7,9%. Nvidia ha ceduto il 5,9% dopo il +31,5% di lunedì; Analog Devices -17%, HPE -16%.', perche:'I soldi stanno scappando dall’intelligenza artificiale verso aziende “noiose” che fanno utili veri: è un cambio d’umore che tocca anche i fondi pensione.', spunto:'Il record del Dow non è una festa: è la fuga dall’AI travestita da ottimismo.', tags:['X','Video']},
    {cat:'Macro', rel:'Media', source:'Reuters Business', time:'05:00', title:'Non solo l’America: il mondo intero torna ad alzare i tassi', sintesi:'In Giappone i prezzi dei servizi sono saliti del 4,2% in un anno, il massimo da 36 anni; in Australia l’inflazione di ottobre è uscita più alta del previsto e la banca centrale ha già alzato i tassi cinque volte quest’anno. Anche dalla Bce arrivano segnali di un rialzo a dicembre.', perche:'Quando tutte le banche centrali stringono insieme, nessun Paese può contare sui soldi a basso costo per crescere.', spunto:'L’inflazione non è stata sconfitta, è solo andata in vacanza: e adesso è tornata ovunque.', tags:['LinkedIn','Threads']},
    {cat:'Commodities', rel:'Media', source:'Mitrade / Yahoo Finance', time:'07:00', title:'Oro e argento in picchiata: il bene rifugio non ripara più', sintesi:'Martedì l’oro ha perso il 2,25% scendendo a circa 3.550 dollari l’oncia, sotto la soglia psicologica dei 3.600, lontanissimo dal picco vicino ai 5.600. L’argento ha fatto peggio: -5,2% a 40,8 dollari, minimo da 14 mesi, e la società di ricerca BCA ha chiuso la sua scommessa sull’oro tenuta dal 2022.', perche:'Con tassi in salita, tenere oro che non paga interessi costa sempre di più: chi lo usa come salvadanaio lo sta vedendo sgonfiarsi.', spunto:'L’oro “sicuro” ha perso più di un terzo dal massimo: la sicurezza in finanza è sempre a tempo determinato.', tags:['Threads','Video']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph / Bitcoin Magazine', time:'06:00', title:'Bitcoin inchiodato a 60.000 dollari: novembre da record per le fughe', sintesi:'Il bitcoin è intorno a 59.500 dollari, dopo aver toccato sabato 55.100, il minimo da due anni. A novembre dai fondi Usa sul bitcoin (gli ETF) sono usciti 4,71 miliardi di dollari, un record, e la società di analisi 42 Macro ha dichiarato di aver ridotto l’esposizione.', perche:'Se anche i professionisti alleggeriscono, chi è entrato tardi rischia di restare l’ultimo a tenere il cerino in mano.', spunto:'Il bitcoin doveva essere l’antidoto alle banche centrali: oggi crolla proprio perché le banche centrali alzano i tassi.', tags:['X','Video']},
    {cat:'Geopolitica', rel:'Media', source:'ABC News / Mitrade (attacco non confermato)', time:'07:00', title:'Il petrolio rialza la testa: torna la paura su Hormuz', sintesi:'Il Brent è risalito del 2,1% a circa 91 dollari al barile e il petrolio americano (WTI) del 2,2% a quasi 82, dopo giorni di ribassi ai minimi da fine agosto. Alcune fonti parlano di un attacco a una petroliera nello Stretto di Hormuz, ma la notizia non è confermata da fonti ufficiali.', perche:'Basta una voce dal Golfo per far salire benzina e bollette: il prezzo del petrolio oggi lo decide la paura, non la domanda.', spunto:'Il mercato del petrolio ha la memoria di un pesce rosso: dimentica la guerra finché non brucia un’altra petroliera.', tags:['LinkedIn','X']},
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'Reuters Business / dati ufficiali Usa', time:'14:30', title:'I prezzi Usa corrono ancora: inflazione al top da due anni, la Fed ha la strada spianata', sintesi:'L’inflazione “di fondo” che la Fed guarda di più (PCE core, senza cibo ed energia) è salita al 3,3% annuo a ottobre, sopra il 3,2% atteso e al massimo da novembre 2023. Il Pil del terzo trimestre è stato rivisto al +4,3%, contro il 3,5% previsto, e le nuove richieste di sussidi di disoccupazione sono scese a 189.000.', perche:'Economia che corre e prezzi che salgono sono il mix perfetto per un rialzo dei tassi a dicembre: mutui e prestiti più cari, anche da noi.', spunto:'L’America va troppo bene per il bene dei nostri portafogli: ogni buona notizia sull’economia è una cattiva notizia sui tassi.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'AP / Bloomberg Markets', time:'08:00', title:'Le Borse asiatiche rialzano la testa dopo il giorno della paura', sintesi:'Dopo il -6,2% di ieri, la Borsa di Seul recupera l’1,2%, Tokyo sale dell’1,3% e Taiwan del 2,6%; SoftBank vola del 9% e SK Hynix del 3,7%. Ieri a Wall Street il Nasdaq era arrivato a perdere il 4,6% in giornata, per poi chiudere solo a -0,6%.', perche:'Il rimbalzo dice che i grandi investitori comprano ancora ogni calo dei titoli AI, ma oscillazioni così violente sono il segnale di un mercato nervoso.', spunto:'Perdere il 4% e recuperarlo in poche ore non è forza: è un mercato che ha perso la bussola e la chiama fiducia.', tags:['X','Video']},
    {cat:'Geopolitica', rel:'Media', source:'AP / KuCoin News (versione iraniana, non verificata in modo indipendente)', time:'09:00', title:'Hormuz brucia ancora: mine contro petroliere, il Brent resta sopra 90 dollari', sintesi:'Secondo l’Iran, due petroliere e una nave che trasporta gas liquefatto hanno urtato delle mine nello Stretto di Hormuz e hanno preso fuoco; i ribelli Houthi rivendicano attacchi a raffinerie saudite. Il Brent sale dello 0,5% a 91,11 dollari al barile: prima della guerra, a febbraio, era a 72.', perche:'Da Hormuz passa una fetta enorme del petrolio mondiale: ogni nave colpita pesa sul prezzo del pieno e delle bollette.', spunto:'Il petrolio a 91 dollari non è un incidente: è il prezzo fisso di una guerra che il mercato finge di non vedere.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Bloomberg / KuCoin News', time:'10:00', title:'Bitcoin torna sopra 60.000 dollari, ma i grandi fondi continuano a scappare', sintesi:'Il bitcoin risale intorno a 60.500 dollari dopo essere sceso fino a circa 57.500, ma a novembre ha perso oltre il 20%. Dai fondi Usa sul bitcoin (ETF) sono usciti quasi 4,94 miliardi di dollari nel mese, record dal loro lancio, e l’indice dell’umore degli investitori crypto è a 11 su 100, “paura estrema”.', perche:'Un rimbalzo in un giorno di Borse chiuse, con pochi scambi, dice poco: finché i grandi capitali escono, la tendenza resta al ribasso.', spunto:'Un rimbalzo del bitcoin a Borse chiuse è come un applauso in una sala vuota: fa rumore, ma non conta.', tags:['X','Threads']},
    {cat:'Azionario', rel:'Media', source:'SemiAnalysis via KuCoin News (non confermato)', time:'11:00', title:'Crollano gli affitti dei chip Nvidia: l’AI comincia a costare meno', sintesi:'Secondo il centro studi SemiAnalysis, SpaceX ha tagliato del 20-35% il prezzo di affitto di alcuni gruppi di chip Nvidia Blackwell, e Anthropic non avrebbe rinnovato una parte dei contratti di noleggio di chip H200. Le informazioni non sono confermate dalle aziende.', perche:'Se affittare potenza di calcolo costa meno, vuol dire che c’è più offerta che domanda: un campanello d’allarme per chi ha investito miliardi nei data center.', spunto:'Quando i prezzi d’affitto dei chip crollano, la corsa all’oro dell’AI ha già trovato il suo primo eccesso di miniere.', tags:['LinkedIn','Video']},
    {cat:'Commodities', rel:'Media', source:'NordFX / KuCoin News', time:'09:30', title:'L’oro scivola sotto 3.500 dollari: il rifugio continua a perdere pezzi', sintesi:'L’oro è sceso per un momento sotto i 3.500 dollari l’oncia e viaggia intorno a 3.564 (-0,7%), mentre l’argento è sceso brevemente sotto i 40 dollari.', perche:'Con tassi in salita e dollaro forte, chi ha comprato oro per sentirsi al sicuro sta pagando il conto.', spunto:'L’oro protegge dal caos, non dai tassi alti: chi l’ha dimenticato oggi lo sta imparando sulla propria pelle.', tags:['Threads','Video']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
