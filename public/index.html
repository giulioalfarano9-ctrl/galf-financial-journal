<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Ven 2 ott 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'TheStreet', time:'22:00', title:'Il costo del denaro vola ai massimi dal 2002: tremano mutui e Borsa', sintesi:'Il rendimento dei titoli di Stato USA a 10 anni, cioè quanto lo Stato paga per prendere in prestito, è salito al 5,33%: il livello più alto da aprile 2002. Quello a 30 anni arriva al 5,67%. Wall Street regge, ma le piccole aziende perdono lo 0,39%.', perche:'Quando lo Stato paga di più, mutui, prestiti e rate delle aziende costano di più: è una tassa invisibile su tutti.', spunto:'Il mercato azionario fa finta di niente, ma il costo del denaro più alto in 24 anni non resta senza conseguenze: prima o poi qualcuno paga il conto.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'FXStreet', time:'10:00', title:'La Fed alza i tassi o no? Le scommesse crollano dal 71% al 37%', sintesi:'Dopo un dato sull’inflazione più morbido del previsto, la probabilità di un nuovo rialzo dei tassi a ottobre è scesa dal 70,9% di lunedì al 37,1%. Ma il presidente della Fed di Minneapolis Kashkari avverte: l’inflazione, intorno al 3%, resta troppo alta da oltre cinque anni.', perche:'Se i tassi salgono ancora, il tuo mutuo variabile e i prestiti costano di più; se si fermano, respiri.', spunto:'Cinque anni sopra l’obiettivo e il mercato già scommette sulla pausa: la Fed rischia di cantare vittoria troppo presto.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Alta', source:'TheStreet', time:'22:15', title:'Accenture esplode del 21%: l’AI manda in fumo chi dubitava', sintesi:'Accenture ha chiuso in rialzo del 21,41% dopo conti migliori del previsto e previsioni forti per il 2027. Nello stesso giorno Micron è scesa nonostante vendite quasi quadruplicate in un anno: segno che le aspettative sull’intelligenza artificiale sono già altissime.', perche:'Il mercato premia chi guadagna con l’AI e punisce anche chi la delude di poco: non c’è spazio per errori.', spunto:'Quando vendite quadruplicate non bastano a far salire un titolo, non siamo davanti a un’azienda in difficoltà: siamo davanti a una bolla di aspettative.', tags:['X','Video']},
    {cat:'Commodities', rel:'Media', source:'TheStreet', time:'19:00', title:'Petrolio sopra 100 dollari: la tensione in Medio Oriente non molla', sintesi:'Il Brent, il petrolio di riferimento in Europa, sale del 2,61% a 100,60 dollari al barile; il WTI americano del 2,06% a 92,28. Spingono le tensioni in Medio Oriente e la sospensione delle esportazioni di prodotti raffinati da parte della Cina.', perche:'Se il petrolio resta sopra 100 dollari, benzina, trasporti e spesa al supermercato non possono scendere.', spunto:'Si parla di calo dell’inflazione, ma con il petrolio a 100 dollari è una promessa che si regge sulla fortuna, non sui numeri.', tags:['X','Threads']},
    {cat:'Crypto', rel:'Media', source:'Rio Times / FXStreet', time:'09:30', title:'Bitcoin si ferma sotto 85.000: i grandi investitori iniziano a vendere', sintesi:'Bitcoin è a circa 84.850 dollari e per la seconda volta in settimana non riesce a chiudere sopra quota 85.000. I fondi ETF su Bitcoin hanno perso 148,69 milioni di dollari mercoledì, interrompendo nove giorni di acquisti. Con i rendimenti dei titoli di Stato al 5% e oltre, tenere Bitcoin conviene meno.', perche:'Se i titoli di Stato pagano il 5% senza rischi, chi investe in crypto deve chiedersi perché prendersi la volatilità.', spunto:'Con lo Stato che paga il 5%, Bitcoin non è più l’alternativa: è il rischio che nessuno è obbligato a correre.', tags:['X','Video']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'Investing.com / ING', time:'09:00', title:'Oggi i posti di lavoro: se reggono, la Fed ti stringe il mutuo', sintesi:'Alle 14:30 italiane escono i dati USA sul lavoro di settembre: gli economisti attendono 89.000 nuovi posti contro i 162.000 del mese prima, con disoccupazione al 4,1%. Secondo ING il mercato dà ormai più del 50% di probabilità a un nuovo rialzo dei tassi a ottobre.', perche:'Se il lavoro tiene, la Fed ha la scusa per tenere i tassi alti: mutui e prestiti costano di più ancora a lungo.', spunto:'Strano mondo: per chi ha un mutuo, una buona notizia sul lavoro è una cattiva notizia per il portafoglio.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Investing.com', time:'09:30', title:'Gli USA schierano tre portaerei attorno all’Iran: trattativa o prova di forza?', sintesi:'Washington sta allargando lo schieramento militare attorno all’Iran, con tre portaerei e due gruppi anfibi. Secondo indiscrezioni una superpetroliera sarebbe stata colpita nello Stretto di Hormuz (da verificare). Il petrolio intanto scende: Brent a 101,20 dollari (-1,1%), WTI a 91,25.', perche:'Da quello stretto passa una grossa fetta del petrolio mondiale: un incidente basta per far salire benzina e bollette.', spunto:'Il petrolio cala mentre le navi da guerra aumentano: i mercati stanno scommettendo che nessuno vuole davvero la guerra. È una scommessa pericolosa.', tags:['X','LinkedIn']},
    {cat:'Commodities', rel:'Media', source:'TheStreet', time:'22:00', title:'L’oro sfonda i 4.200 dollari mentre tutti corrono ai titoli di Stato', sintesi:'L’oro vola a 4.212 dollari l’oncia (+0,6%) e l’argento a 61,55 (+1,6%), proprio mentre i titoli di Stato USA a 10 anni pagano il 5,33%, il massimo dal 2002. L’oro di solito soffre quando i rendimenti salgono, ma oggi non succede.', perche:'Se l’oro sale anche con i tassi alti, vuol dire che molti non si fidano più della sola promessa di essere pagati dagli Stati.', spunto:'Quando oro e titoli di Stato salgono insieme, il mercato sta dicendo una cosa sola: la paura è più forte del calcolo.', tags:['X','Threads']},
    {cat:'Azionario', rel:'Media', source:'TheStreet', time:'22:15', title:'Synopsys vola del 12%: basta un accordo con OpenAI per far impazzire la Borsa', sintesi:'Il titolo Synopsys, azienda di software per progettare chip, ha chiuso in rialzo del 12,29% dopo un accordo da 1 miliardo di dollari con Amazon Web Services e una partnership con OpenAI.', perche:'In Borsa oggi basta citare l’intelligenza artificiale per guadagnare miliardi in un giorno: chi compra tardi rischia di pagare il conto.', spunto:'Un titolo che guadagna il 12% per un annuncio non è un investimento: è una corsa al biglietto prima che finisca la musica.', tags:['X','Video']},
    {cat:'Crypto', rel:'Media', source:'UseTheBitcoin', time:'08:00', title:'Bitcoin: 3 miliardi di acquisti in nove giorni, ma il prezzo non si muove', sintesi:'I fondi ETF su Bitcoin negli USA hanno raccolto circa 3,1 miliardi di dollari in nove sedute, ma il prezzo resta a circa 83.500, vicino al sostegno degli 83.000. Secondo gli analisti, a frenarlo sono i rendimenti dei titoli di Stato al massimo da oltre vent’anni.', perche:'Se entrano miliardi e il prezzo non sale, qualcuno sta vendendo altrettanto: e di solito sono quelli che sanno prima.', spunto:'Quando miliardi di acquisti non spostano il prezzo, non è fiducia: è qualcuno che sta scaricando il suo Bitcoin sui nuovi arrivati.', tags:['X','Threads']},
    {cat:'Macro', rel:'Media', source:'TheStreet', time:'22:00', title:'Il 65% degli americani incolpa Trump per il caro vita', sintesi:'Un sondaggio citato da TheStreet rileva che il 65% degli americani attribuisce le politiche di Trump ai prezzi troppo alti. Intanto l’inflazione PCE, la misura preferita dalla Fed, è al 3,0% annuo, sotto il 3,3% atteso.', perche:'Quando il caro vita diventa un tema politico, le scelte su dazi e tasse possono cambiare in fretta, e con loro i mercati.', spunto:'L’inflazione scende sulla carta, ma gli elettori guardano lo scontrino: e a Washington, alla fine, conta lo scontrino.', tags:['LinkedIn','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
