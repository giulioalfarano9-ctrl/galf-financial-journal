<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Mar 28 lug 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'Reuters / CME FedWatch', time:'05:40', title:'La Fed decide oggi: nessuno parla più di tagli, si teme il rialzo', sintesi:'Oggi e domani la banca centrale americana si riunisce con i tassi fermi al 3,50-3,75% da quattro incontri. I mercati danno circa il 65% di probabilità al nulla di fatto, ma quasi un terzo scommette ormai su un aumento, spinto dal petrolio più caro e da toni più duri della Fed. Per settembre l\'ipotesi di rialzo è già salita all\'82%.', perche:'Se la Fed alza invece di tagliare, mutui, prestiti e rate delle carte restano cari più a lungo: chi aspettava un po\' di respiro dovrà attendere ancora.', spunto:'Sei mesi fa tutti sognavano i tagli, oggi si trema per un rialzo: sui mercati l\'ottimismo arriva sempre in anticipo e lo si paga in ritardo.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Fortune / CNBC', time:'05:15', title:'La grande tech porta i conti dell\'AI e il mercato non applaude più', sintesi:'Da domani sfilano gli utili dei giganti: Microsoft e Meta mercoledì, Apple e Amazon giovedì. Ma il clima è cambiato: Microsoft perde il 18% da inizio anno e Meta quasi il 10%, e gli investitori non vogliono più promesse sull\'intelligenza artificiale, vogliono sapere quando quella spesa enorme diventerà profitto vero.', perche:'Chi ha fondi pensione o risparmi legati alla Borsa americana sta per scoprire se la scommessa sull\'AI regge o comincia a scricchiolare.', spunto:'Per due anni bastava dire "AI" per far salire il titolo: ora il mercato è in rivolta e chiede il conto, e non tutti sapranno pagarlo.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Media', source:'CNBC / CNN', time:'05:20', title:'Trump apre all\'Iran, la guerra dello Stretto si ferma (per ora)', sintesi:'Gli Stati Uniti hanno sospeso i nuovi attacchi su richiesta di Teheran, e Trump parla di "buoni colloqui" mentre l\'Iran discute con Arabia Saudita e Oman la libera navigazione nello Stretto di Hormuz. Ma il ministero degli Esteri iraniano nega che ci siano trattative in corso: la tregua resta fragile.', perche:'Da quello stretto passa gran parte del petrolio mondiale: ogni parola di pace o di guerra finisce dritta nel prezzo che paghiamo alla pompa.', spunto:'Una parte parla di pace, l\'altra la smentisce lo stesso giorno: quando la tregua dipende da chi la racconta, il petrolio a buon mercato può durare un\'ora.', tags:['X','LinkedIn']},
    {cat:'Commodities', rel:'Media', source:'Bloomberg / Trading Economics', time:'05:25', title:'Il petrolio cede per il terzo giorno: la paura sconta la pace', sintesi:'Il Brent è sceso verso gli 86 dollari al barile, terza seduta di fila in calo, sull\'ipotesi che i colloqui tra Stati Uniti e Iran riaprano i flussi dal Golfo. Resta però ben più caro di un mese fa, quando valeva il 17% in meno: il mercato spera nella calma ma non ci crede fino in fondo.', perche:'Un petrolio che scende raffredda benzina, bollette e inflazione: è forse la notizia migliore della settimana per il portafoglio delle famiglie.', spunto:'Il petrolio crolla su una tregua ancora tutta da firmare: il mercato compra la pace prima che esista, e se salta il prezzo torna su in un attimo.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinMarketCap News / crypto.news', time:'05:00', title:'Bitcoin scivola sotto i 64 mila in attesa della Fed', sintesi:'Bitcoin è sceso a circa 63.200 dollari, in calo del 2,8% in un giorno, con l\'intero mercato crypto giù dell\'1,6% a 2.260 miliardi. Anche Ethereum arretra del 3,5% verso i 1.870 dollari. Gli investitori vendono e aspettano di capire cosa farà la banca centrale americana.', perche:'Chi tiene crypto scopre di nuovo che davanti alle decisioni della Fed anche il "denaro del futuro" trema come tutti gli altri.', spunto:'Il Bitcoin doveva essere l\'oro digitale immune dalle banche centrali: basta una riunione della Fed per farlo scendere insieme al resto.', tags:['X','Threads']},
    {cat:'Macro', rel:'Media', source:'Mohamed El-Erian (Allianz)', time:'05:10', title:'El-Erian: «Il peggio dell\'inflazione è alle spalle, la Fed stia ferma»', sintesi:'Mohamed El-Erian, consigliere capo di Allianz, invita la Fed alla prudenza: il dato di giugno più morbido del previsto (prezzi al +3,5% l\'anno, +2,6% al netto di cibo ed energia) dovrebbe raffreddare chi spinge per alzare i tassi. Per lui il grosso dell\'inflazione è ormai passato e conviene aspettare, non stringere.', perche:'Se ha ragione lui i tassi non salgono e prima o poi mutui e prestiti costeranno meno: è la voce di chi invita a non farsi prendere dal panico.', spunto:'El-Erian dice di aspettare, il petrolio dice di correre: la Fed deve scegliere tra un dato che rassicura e una guerra che può riaccendere i prezzi domani.', tags:['LinkedIn','X']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'Reuters / Bloomberg Markets', time:'13:20', title:'Intel fa il pieno con l\'AI, ma la Borsa la bastona lo stesso', sintesi:'Intel ha chiuso il trimestre migliore da oltre quindici anni: ricavi a 16,1 miliardi di dollari, +25%, con l\'intelligenza artificiale che ormai vale circa il 70% del giro d\'affari. Ma il titolo resta ferito, con un luglio pesante: per crescere l\'azienda alzerà la spesa oltre i 20 miliardi, e gli investitori temono che il conto sia troppo salato.', perche:'Chi ha in portafoglio i grandi nomi della tecnologia scopre che oggi non basta più fare utili record: il mercato vuole sapere quanto costa produrli.', spunto:'Intel cresce come non le capitava da quindici anni e viene comunque punita in Borsa: il mercato non compra più i risultati, compra la paura del prossimo conto da pagare.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Mohamed El-Erian (Allianz)', time:'12:50', title:'El-Erian: «I tassi salgono, e non è colpa della Fed»', sintesi:'Mohamed El-Erian, consigliere capo di Allianz, avverte: i tassi a lungo termine stanno salendo per due motivi, il petrolio più caro delle ultime settimane e la valanga di nuovo debito che i governi si preparano a emettere. Il rendimento del titolo di Stato americano a dieci anni ha toccato i massimi da inizio 2025 prima di rientrare oggi verso il 4,6%.', perche:'Quando lo Stato paga di più per farsi prestare denaro, alla fine costano di più anche i mutui e i prestiti di tutti noi: è la stessa corda che tira il portafoglio delle famiglie.', spunto:'Non è la Fed a decidere davvero quanto ci costa il denaro: sono il petrolio e la montagna di debito pubblico, e nessuno dei due sta ascoltando i nostri mutui.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Media', source:'Bloomberg / The Information (non confermato)', time:'11:30', title:'La Cina si costruisce da sola le macchine per i chip, ASML crolla', sintesi:'Secondo un\'indiscrezione riportata dalla stampa, la Cina avrebbe iniziato a fabbricare in casa le macchine più sofisticate per produrre i microchip, quelle finora dominate dall\'olandese ASML. La notizia, non confermata dalle aziende, ha fatto crollare il titolo ASML dell\'8,4% in una sola seduta, trascinando giù tutta la tecnologia europea.', perche:'Se Pechino impara a costruire da sola gli strumenti che le venivano negati, l\'arma delle sanzioni tecnologiche dell\'Occidente perde il filo: e dentro ogni telefono e ogni auto ci sono quei chip.', spunto:'L\'Occidente ha vietato alla Cina le macchine per i chip credendo di fermarla: le ha solo insegnato a farsele in casa, ed è un boomerang che ci tornerà dritto in faccia.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph / CoinMarketCap News', time:'12:10', title:'Ethereum corre il doppio di Bitcoin: cambia il re delle crypto', sintesi:'Oggi a spingere è soprattutto Ethereum, la seconda criptovaluta al mondo: +4,4% in un giorno, verso i 1.960 dollari, il doppio del rialzo di Bitcoin (+1,3%, sopra i 65 mila). L\'intero mercato crypto torna a valere circa 2,3 mila miliardi di dollari.', perche:'Chi tiene un po\' di crypto scopre che non salgono tutte insieme: scegliere la moneta giusta pesa quanto scegliere il momento giusto.', spunto:'Quando l\'allievo Ethereum corre il doppio del maestro Bitcoin, il mercato ci dice che la festa delle crypto non ha più un solo re al comando.', tags:['X','Threads']},
    {cat:'Azionario', rel:'Media', source:'Reuters Business', time:'11:50', title:'Vodafone vola grazie al Kenya: il futuro delle telecom è in Africa', sintesi:'Vodafone è balzata del 4,9% a Londra dopo aver alzato le stime per l\'anno, merito dell\'acquisto del controllo di Safaricom, il colosso della telefonia mobile del Kenya. Una scommessa sull\'Africa che paga, proprio mentre in Europa il settore delle telecomunicazioni arranca.', perche:'Mentre in Europa le compagnie telefoniche faticano a crescere, chi punta sui mercati africani in piena espansione trova ancora spazio: e spesso quei mercati sono il futuro.', spunto:'Vodafone cresce non in Europa ma in Kenya: il nostro continente è ormai saturo, e i soldi veri si fanno dove il telefono è ancora una conquista.', tags:['LinkedIn','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
