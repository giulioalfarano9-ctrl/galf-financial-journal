<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Mer 2 set 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'CNBC / CME FedWatch', time:'06:05', title:'La Fed non taglierà più: adesso il mercato scommette che alzi', sintesi:'A due settimane dalla riunione del 16 settembre, i mercati danno circa il 66-68% di probabilità a un rialzo dei tassi di un quarto di punto, contro il 40% di sette giorni fa. Il rendimento del titolo di Stato americano a dieci anni è salito al 4,79%, massimo da gennaio 2025, dopo che il presidente della Fed Kevin Warsh a Jackson Hole ha detto che sull\'inflazione «c\'è ancora lavoro da fare».', perche:'Un rialzo americano alza il costo del denaro ovunque: mutui, prestiti e rate diventano più cari anche in Europa.', spunto:'Per un anno intero il mercato si è fatto promettere tagli dei tassi che non sono mai arrivati: ora scopre che l\'unica direzione rimasta è quella opposta, e nessuno vuole ammettere di averci creduto.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'CNBC / Barron\'s', time:'06:40', title:'Wall Street apre settembre col rosso e i chip pagano il conto più caro', sintesi:'Nel primo giorno di settembre il Dow Jones ha perso 363 punti (-0,7%), l\'S&P 500 lo 0,7% e il Nasdaq l\'1,3%. Il colpo più duro sui produttori di chip: Intel -3% a 86,68 dollari, Amd -2% a 460,52, Nvidia -2% a 217,18, con l\'indice di settore Soxx giù del 2%.', perche:'Chi ha un fondo sull\'indice americano è esposto soprattutto a queste società: quando i tassi salgono, sono le prime a essere svendute.', spunto:'Non è arrivata una cattiva notizia sui chip: è solo salito il costo del denaro, e mezza Wall Street è crollata lo stesso. Vuol dire che quei prezzi non stavano in piedi da soli.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Al Jazeera / S&P Global', time:'07:10', title:'Hormuz resta chiuso e il petrolio si accomoda sopra i 90 dollari', sintesi:'Il Brent viaggia intorno ai 90 dollari al barile, circa il 24% in più rispetto a prima della guerra tra Stati Uniti-Israele e Iran iniziata a fine febbraio. I negoziati per riaprire lo Stretto di Hormuz sono in stallo dopo nuovi attacchi al naviglio, e l\'agenzia americana per l\'energia non vede la produzione mediorientale tornare ai livelli precedenti prima del 2027.', perche:'Da quel braccio di mare passa un quarto del petrolio via mare: ogni settimana di blocco arriva alla pompa e in bolletta.', spunto:'Ci hanno raccontato per trent\'anni la sicurezza energetica: basta un braccio di mare largo cinquanta chilometri per rimettere il conto dell\'Europa nelle mani di chi spara alle navi.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Trading Economics / CBS News', time:'07:35', title:'L\'oro scivola in mercato orso: il rifugio ha smesso di proteggere', sintesi:'Il metallo è sceso a 4.358 dollari l\'oncia (-1,9% in una seduta), oltre il 20% sotto il massimo di 5.602 toccato a gennaio: tecnicamente un mercato orso. A schiacciarlo sono i rendimenti dei titoli di Stato ai massimi da gennaio 2025: se le obbligazioni pagano di più, tenere un metallo che non paga nulla conviene meno.', perche:'Chi ha comprato oro per proteggersi dall\'inflazione sta perdendo proprio mentre l\'inflazione risale.', spunto:'L\'oro doveva essere l\'assicurazione contro il caos: c\'è una guerra, l\'inflazione risale, e perde il 20%. Forse non era un\'assicurazione, era solo una moda ben raccontata.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Yahoo Finance / Cointelegraph', time:'08:05', title:'Bitcoin sotto i 78 mila: i fondi comprano, i tassi vendono', sintesi:'Il bitcoin è sceso sotto i 78.000 dollari il 1° settembre, dopo aver aperto a 78.559. Eppure ad agosto i fondi quotati americani hanno raccolto 3,03 miliardi di dollari, il mese migliore da ottobre 2025, dimezzando le uscite dell\'anno a 2,26 miliardi.', perche:'Con i tassi in salita, un investimento che non paga interessi vale meno: vale per l\'oro e vale anche per le criptovalute.', spunto:'Doveva essere l\'oro digitale, indipendente dalle banche centrali: oggi basta una frase del presidente della Fed per farlo scendere. L\'indipendenza era una promessa di marketing.', tags:['X','LinkedIn']},
    {cat:'Azionario', rel:'Media', source:'Charles Schwab (Liz Ann Sonders)', time:'08:30', title:'Sonders: il vero movimento del mercato non è salire, è cambiare cavallo', sintesi:'Liz Ann Sonders, capo strategist di Charles Schwab, sostiene che oggi la rotazione tra settori è diventata essa stessa la scommessa dominante del mercato, più della corsa dell\'indice. Con i rendimenti obbligazionari ai massimi da inizio 2025, i soldi si spostano di continuo da un settore all\'altro invece di seguire un\'unica direzione.', perche:'Chi guarda solo l\'indice non vede la partita vera: sotto la superficie il denaro sta cambiando padrone in fretta.', spunto:'Un mercato dove l\'unica strategia che funziona è cambiare idea ogni due settimane non è un mercato che investe: è un mercato che scappa.', tags:['LinkedIn','Threads']}
  ],
  afternoon: [
    {cat:'Geopolitica', rel:'Alta', source:'Reuters / Al Jazeera', time:'13:10', title:'Gli Stati Uniti colpiscono l\'Iran, il petrolio corre verso i 95 dollari', sintesi:'Dopo l\'attacco a due petroliere cariche di greggio saudita, l\'esercito americano ha lanciato nuovi raid su obiettivi iraniani attorno allo Stretto di Hormuz. Il Brent è salito di circa il 5%, sfiorando i 95 dollari al barile, il livello più alto da fine luglio. Trump minaccia una risposta molto più dura in caso di ritorsione, Teheran promette una reazione «molte volte maggiore».', perche:'Il prezzo del pieno e della bolletta ormai dipende da quanto dura questo scambio di colpi, non da quanto consumiamo noi.', spunto:'Non paghiamo la benzina cara per colpa dell\'inflazione: la paghiamo cara perché due eserciti hanno trasformato il Golfo Persico in un campo di tiro, e in Europa nessun governo ha un piano che non sia sperare.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Yahoo Finance / The Information', time:'09:30', title:'La Cina si costruisce i chip da sola e l\'Asia crolla in una seduta', sintesi:'Il listino coreano Kospi ha perso oltre il 10% e il Nikkei giapponese circa il 4%, travolti dalle vendite sui produttori di chip. A innescarle il debutto in Borsa del produttore cinese di memorie Cxmt e la notizia che un\'azienda di Stato cinese ha iniziato a produrre in serie i macchinari per fabbricare microchip, finora un monopolio occidentale.', perche:'Se la Cina smette di comprare chip fuori casa, si spegne il motore che ha spinto le Borse mondiali negli ultimi tre anni.', spunto:'Per anni ci hanno spiegato che negare la tecnologia alla Cina l\'avrebbe rallentata: le abbiamo solo dato il motivo per costruirsela in casa, e adesso la conta dei danni la facciamo noi.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Barchart / Reuters', time:'10:20', title:'Washington ordina a Tokyo di svegliarsi: lo yen è fermo a 160', sintesi:'Il segretario al Tesoro americano Scott Bessent ha chiesto pubblicamente al governatore della Banca del Giappone Kazuo Ueda passi «decisi» contro la debolezza dello yen, inchiodato intorno a 160 per dollaro. Il mercato ora dà quasi per scontato un rialzo dei tassi giapponesi entro il mese.', perche:'Il denaro quasi gratis del Giappone ha finanziato per anni mezzo mercato mondiale: se Tokyo alza, quella benzina finisce.', spunto:'Quando il Tesoro americano deve dire in pubblico a una banca centrale straniera cosa fare, dell\'indipendenza delle banche centrali resta soltanto il galateo.', tags:['LinkedIn','Threads']},
    {cat:'Commodities', rel:'Media', source:'Agenzia americana per l\'energia (EIA)', time:'11:40', title:'Da Hormuz passa un quinto del petrolio di prima: il dato che nessuno cita', sintesi:'Nel secondo trimestre 2026 dallo Stretto di Hormuz sono transitati in media 4,9 milioni di barili al giorno, contro i 21,6 milioni dell\'ultimo trimestre 2025, prima della guerra. Un crollo di oltre il 75% che il mercato ha assorbito senza panico grazie alle scorte accumulate e alle rotte alternative.', perche:'Le scorte però si consumano: finché reggono i prezzi salgono piano, il giorno che finiscono salgono tutti insieme.', spunto:'Il mercato si è convinto di aver superato la crisi energetica solo perché non è ancora esplosa: sta vivendo di riserve, e le riserve non si rigenerano da sole.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph / CoinMarketCap', time:'12:15', title:'Un miliardo e mezzo nei fondi bitcoin in sette giorni: entra Wall Street, non la gente', sintesi:'I fondi quotati americani sul bitcoin hanno raccolto circa 1,6 miliardi di dollari nell\'ultima settimana, con oltre 600 milioni in un solo giorno: il periodo migliore del 2026. La società Strive è diventata la quinta azienda quotata al mondo per bitcoin in cassaforte, con 23.156 monete. Il prezzo resta intorno ai 78.600 dollari.', perche:'Il bitcoin non è più il rifugio dei ribelli: è un prodotto finanziario venduto dalle stesse banche da cui doveva liberarci.', spunto:'Il bitcoin è nato per togliere potere a Wall Street e finirà dentro un fondo pensione: la rivoluzione è stata comprata, e chi l\'ha venduta ci ha pure fatto il prezzo.', tags:['X','LinkedIn']},
    {cat:'Macro', rel:'Media', source:'Reuters', time:'11:05', title:'Anche la Bce alza la voce: «Potrebbero servire altri rialzi»', sintesi:'Due membri del consiglio della Bce, l\'irlandese Gabriel Makhlouf e il lettone Martins Kazaks, hanno avvertito che per riportare i prezzi sotto controllo potrebbero servire nuovi aumenti dei tassi. L\'euro si è rafforzato sulle loro parole, mentre il dollaro guadagna lo 0,3%.', perche:'Tradotto: chi ha un mutuo a tasso variabile rischia un\'altra rata più alta prima di fine anno.', spunto:'La Bce alzerebbe i tassi per un\'inflazione che nasce da una guerra nel Golfo: l\'unico effetto certo è punire chi paga un mutuo, cioè l\'unico che in questa storia non ha colpe.', tags:['LinkedIn','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
