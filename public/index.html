<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Lun 2 nov 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'Investing.com', time:'05:30', title:'Ottobre capovolge Wall Street: la tecnologia crolla, i titoli noiosi vincono', sintesi:'Il Nasdaq ha perso oltre il 5% in ottobre, mentre il Dow è salito dell’1,7%: i soldi scappano dai giganti dell’intelligenza artificiale verso i settori più prudenti. Stasera Apple e Palantir presentano i conti, domani tocca ad AMD.', perche:'Se il mercato smette di credere alle promesse dell’IA, pagano i fondi e le pensioni che ne sono pieni, cioè anche i tuoi risparmi.', spunto:'Per due anni ci hanno venduto l’IA come la nuova rivoluzione: ora il mercato presenta il conto e chiede utili veri, non slogan.', tags:['LinkedIn','Video']},
    {cat:'Geopolitica', rel:'Alta', source:'Reuters/Ipsos (via Investing.com)', time:'05:45', title:'Martedì si vota e Trump parte da un record negativo: 31% di approvazione', sintesi:'Domani le elezioni di metà mandato decidono se i Democratici conquistano il Congresso. Il sondaggio Reuters/Ipsos dà Trump al minimo storico del 31%. Una svolta a Washington potrebbe portare più controlli su IA, grandi aziende tecnologiche e crypto.', perche:'Chi controlla il Congresso decide tasse, spesa pubblica e regole sui settori in cui investi: il voto di domani sposta i mercati più di una riunione della Fed.', spunto:'I mercati dicono di odiare l’incertezza, ma martedì si giocano qualcosa che nessun bilancio può prezzare: chi scrive le regole.', tags:['X','Threads']},
    {cat:'Macro', rel:'Alta', source:'Shattered.io / Wall St Week Ahead', time:'06:00', title:'Venerdì il verdetto sul lavoro: la Fed è in trappola tra occupazione che frena e tassi che non scendono', sintesi:'Venerdì escono i dati sul lavoro di ottobre: si attendono appena 55-60 mila nuovi posti, dopo i 29 mila di settembre. Secondo Shattered.io la Fed ha tenuto i tassi fermi con due voti contrari, entrambi a favore di un rialzo; il titolo di Stato Usa a 10 anni resta vicino al 4,9%.', perche:'Con i tassi alti e il lavoro che rallenta, mutui e prestiti restano cari proprio mentre gli stipendi smettono di correre.', spunto:'La Fed predica prudenza, ma ogni mese di tassi alti lo paga chi ha un mutuo, non chi ha un portafoglio di azioni.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CryptoTicker / CoinCentral', time:'06:15', title:'Bitcoin a -38% dal record: nessuno vuole più pagare per scommettere al rialzo', sintesi:'Bitcoin vale circa 78.500 dollari, il 38% in meno del massimo di 126.080 dell’ottobre 2025. I fondi americani legati al bitcoin hanno perso 643 milioni in un giorno e l’indice della paura segna 37 su 100. Il livello da non rompere è 76.500-77.000.', perche:'Dopo il furto da 6,3 miliardi a Binance, anche chi credeva nel bitcoin come bene rifugio sta chiedendosi se sia solo un titolo tecnologico più rischioso.', spunto:'Il bitcoin doveva proteggerti dal sistema: invece cade insieme al Nasdaq. Oro digitale, ma solo quando il mercato sale.', tags:['X','Video']},
    {cat:'Commodities', rel:'Media', source:'Investing.com', time:'06:00', title:'Petrolio in calo ma a 110 dollari: la guerra costa ancora cara', sintesi:'Il Brent (il prezzo di riferimento del greggio) oscilla intorno ai 110 dollari dopo i picchi vicini ai 118 di venerdì, con gli attacchi alle petroliere nello Stretto di Hormuz. L’oro è sotto i 4.000 dollari, a circa 3.900 l’oncia.', perche:'Un barile così caro finisce nelle bollette e al distributore, e frena la discesa dei prezzi che la banca centrale sta aspettando.', spunto:'Se bastano due parole di Trump per far muovere il petrolio del 3%, il prezzo del tuo pieno è deciso in una conferenza stampa, non dal mercato.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Crypto', rel:'Alta', source:'Reuters', time:'11:30', title:'Binance ricompra i token rubati e riapre i prelievi: la FBI accusa la Corea del Nord', sintesi:'Binance ha riaperto i prelievi di bitcoin ed ether dopo un furto da 6,3 miliardi di dollari in token, avvenuto in circa 20 minuti. Dice di aver ricomprato il 95% con fondi propri. La FBI indica come autori gli hacker nordcoreani; Trump, però, non è ancora certo di questa pista.', perche:'Se la più grande piattaforma crypto si fa svuotare le casse in 20 minuti, i tuoi soldi lì dentro sono davvero al sicuro?', spunto:'Non è la tua chiave, non sono i tuoi soldi: finché ti fidi di una piattaforma, la sicurezza è solo una promessa.', tags:['X','Threads']},
    {cat:'Azionario', rel:'Alta', source:'AP / Tactical Allocation Desk', time:'13:00', title:'Intel affonda del 29% e ottobre diventa il mese nero del Nasdaq', sintesi:'Venerdì Intel ha perso quasi il 29%, il peggior giorno dal 1974, dopo previsioni di profitto sotto le attese. Il Nasdaq ha chiuso ottobre in calo del 5,3%, il peggior mese da oltre un anno, con la tecnologia a circa -7,5%.', perche:'Se i giganti dell’IA tremano, tremano anche i fondi e i piani pensione che ne sono pieni, probabilmente anche i tuoi.', spunto:'Si spende senza freni per l’IA: quando i profitti non arrivano, il conto lo pagano i piccoli risparmiatori.', tags:['LinkedIn','Video']},
    {cat:'Macro', rel:'Alta', source:'Yahoo Finance / CME FedWatch', time:'10:00', title:'La Fed non taglia e due membri chiedono di alzare i tassi: dicembre fa paura', sintesi:'La Fed ha lasciato i tassi al 3,75-4% con un voto 10 a 2: i due contrari volevano un rialzo. Il rendimento dei titoli di Stato Usa a 10 anni ha superato il 5%. I mercati danno circa 4 probabilità su 5 a un rialzo il 9 dicembre.', perche:'Tassi più alti vuol dire mutui, prestiti e rate più care, mentre i rendimenti sicuri tolgono spazio alle azioni.', spunto:'Ci hanno venduto la fine dei rialzi: oggi la Fed litiga solo su quanto stringere.', tags:['LinkedIn','Threads']},
    {cat:'Commodities', rel:'Media', source:'Supermacro Briefing / Coin Edition', time:'12:00', title:'Petrolio a 115 dollari: il Golfo pompa di nuovo, ma il prezzo sale lo stesso', sintesi:'Il Brent (il prezzo di riferimento del petrolio) è salito di circa il 20% da inizio settembre, attorno a 115 dollari. Le esportazioni del Golfo sono tornate sopra i 17 milioni di barili al giorno, ma restano 4 milioni sotto il 2025. Oggi riunione dell’Opec+, che dovrebbe lasciare invariata la produzione.', perche:'Il petrolio caro gonfia benzina, bollette e prezzi nei negozi, e spinge la Fed ad alzare i tassi.', spunto:'Il petrolio è tornato a fluire, ma i prezzi no: la crisi ormai è un business per qualcuno.', tags:['X','Video']},
    {cat:'Geopolitica', rel:'Media', source:'Coin Edition (calendario eventi)', time:'12:30', title:'Settimana della verità: elezioni Usa, banche centrali e il dato sul lavoro', sintesi:'Martedì 3 si vota alle elezioni di metà mandato negli Usa e la banca centrale australiana potrebbe alzare i tassi. Giovedì la Banca d’Inghilterra è attesa al primo rialzo in oltre tre anni. Venerdì 6 arrivano i dati Usa sul lavoro, con circa 65.000 nuovi posti attesi.', perche:'Politica, tassi e lavoro in cinque giorni: bastano due sorprese per spostare i prezzi dei tuoi investimenti.', spunto:'I mercati dicono di essere razionali, ma una settimana così li trasforma in scommettitori.', tags:['LinkedIn','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
