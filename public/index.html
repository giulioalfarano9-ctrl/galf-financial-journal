<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Lun 9 nov 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'Yahoo Finance', time:'06:00', title:'Wall Street prova a rialzarsi, ma i titoli tech costano meno dell’S&P per la prima volta dal 2017', sintesi:'Venerdì il Nasdaq-100 ha chiuso a +1,35% e i chip a +4,2%, ma la settimana resta negativa dopo il crollo di giovedì; stamattina i future sono in lieve rialzo. La paura (indice VIX) è ancora a 24. I big tecnologici ora costano meno del resto del mercato: un fatto che non si vedeva da otto anni.', perche:'I tuoi fondi sono pieni di questi titoli: se i giganti dell’IA sono “in saldo”, o è un’occasione o è un campanello d’allarme.', spunto:'Quando i campioni della tecnologia costano meno della media, o il mercato ha esagerato o sa qualcosa che noi non vogliamo ammettere.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Yahoo Finance / CME FedWatch', time:'06:10', title:'La Fed pensa ad alzare i tassi: il tuo mutuo torna a fare paura', sintesi:'Dopo i dati sul lavoro di ottobre, i mercati scommettono su un rialzo dei tassi a dicembre: la probabilità è salita dal 66% al 77% in pochi giorni. Il rendimento dei titoli di Stato Usa a 10 anni è al 4,85%. Oggi arrivano le attese di inflazione dei consumatori, ferme al 3,9% a settembre.', perche:'Tassi più alti vogliono dire rate più care su mutui e prestiti, proprio mentre la Borsa è già nervosa.', spunto:'Alzare i tassi con le Borse in affanno è come frenare in curva: la Fed rischia di sbandare, e a pagare sarà chi ha un mutuo.', tags:['LinkedIn','Threads']},
    {cat:'Geopolitica', rel:'Alta', source:'Mitrade (dati di mercato)', time:'06:20', title:'Il petrolio crolla del 16% in una settimana: la pace con l’Iran vale 20 dollari al barile', sintesi:'Il Brent, prezzo di riferimento del greggio, è sceso del 16,4% a 98,3 dollari: il calo settimanale più forte dal 2020. Il motivo principale sono i progressi nei colloqui tra Usa e Iran, che hanno cancellato circa 20 dollari di “premio paura”. La domanda Usa cresce appena dello 0,2%.', perche:'Meno petrolio caro significa benzina e bollette più leggere, ma solo se la tregua regge.', spunto:'Il petrolio ci ha appena detto quanto vale la paura della guerra: venti dollari a barile, e li paghiamo sempre noi.', tags:['X','Video']},
    {cat:'Crypto', rel:'Alta', source:'The Sunday Guardian (dati di mercato)', time:'06:30', title:'Bitcoin respinto a 81.000 dollari: ora si difende a 74.000', sintesi:'Il bitcoin ha toccato 80.935 dollari, poi è tornato a circa 74.200 (-4,9% in una settimana). Pesano i fondi quotati in uscita, i ritardi della legge Usa sulle crypto dopo il voto e la notizia, riportata da alcune fonti, del blocco americano alla piattaforma MEXC: non confermata in modo indipendente. Sotto 73.700 gli analisti temono un trend ribassista.', perche:'Se i grandi investitori scappano alla prima paura, il bitcoin non è il rifugio che ti hanno raccontato.', spunto:'Chiamarlo “oro digitale” è comodo finché sale: al primo scossone il bitcoin si comporta da azione tecnologica.', tags:['X','Threads']},
    {cat:'Commodities', rel:'Media', source:'Mitrade (dati di mercato)', time:'06:40', title:'L’oro vola a 4.100 dollari anche se la Fed minaccia di alzare i tassi', sintesi:'L’oro è salito del 4,5% in una settimana a circa 4.075-4.100 dollari, mentre l’argento ha guadagnato il 5,5% a 51,8. Nello stesso periodo il rame è calato del 3,7%. Di solito tassi più alti frenano l’oro: stavolta le banche centrali, che ne hanno comprato 321 tonnellate nel trimestre, lo sostengono.', perche:'Quando il rame scende e l’oro sale, il mercato ti sta dicendo che teme più la fragilità che la crescita.', spunto:'Se l’oro sale mentre i tassi si alzano, vuol dire che i grandi non si fidano più nemmeno delle banche centrali.', tags:['LinkedIn','Video']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'Yahoo Finance (Morning Brief)', time:'13:20', title:'Dopo il voto Usa i giganti del web salgono, i chip pagano il conto', sintesi:'Dalle elezioni Google, Microsoft e Amazon sono in rialzo, mentre sono i produttori di chip a subire le vendite: giovedì il Nasdaq ha perso il 5,5% in un giorno. Per l’analista Nicholas Colas (DataTrek) è un movimento legato all’IA, non il segnale di una recessione.', perche:'Se pensi di essere “diversificato” perché hai molti titoli tech, scopri ora che dentro lo stesso settore c’è chi vince e chi perde.', spunto:'Non è crollata la tecnologia: è crollata l’illusione che tutta la tecnologia viaggi insieme.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNBC (via TipRanks) / NordFX', time:'13:30', title:'La Cina ha l’inflazione dei produttori più alta da oltre quattro anni, ma i consumatori non spendono', sintesi:'In ottobre i prezzi alla produzione cinesi sono saliti del 5,7% sull’anno, più delle attese (5,3%). I prezzi al consumo invece solo dello 0,7%, sotto le previsioni. Le fabbriche pagano di più, ma i cittadini non comprano.', perche:'Se le fabbriche cinesi scaricano i costi sui prezzi, prima o poi li ritrovi anche negli scaffali europei.', spunto:'Quando le fabbriche pagano di più e i clienti non spendono, qualcuno deve perderci: di solito sono i margini, poi i posti di lavoro.', tags:['LinkedIn','Threads']},
    {cat:'Macro', rel:'Alta', source:'NordFX (dati di mercato)', time:'13:40', title:'Troppi posti di lavoro: la buona notizia che spaventa la Borsa', sintesi:'In ottobre gli Usa hanno creato 165mila posti contro i circa 60mila attesi, e la disoccupazione è scesa al 4,1%. Il mercato dà ora circa il 78% di probabilità a un rialzo dei tassi a dicembre. Domani i prezzi al consumo diranno se la Fed dovrà davvero stringere.', perche:'Un’economia forte oggi può voler dire rate del mutuo più care domani.', spunto:'Siamo al paradosso: più gente lavora, più Wall Street trema. Il mercato tifa per l’economia debole.', tags:['X','Threads']},
    {cat:'Commodities', rel:'Media', source:'Yahoo Finance / NordFX', time:'13:50', title:'Petrolio sotto 90 dollari, ma una scintilla a Hormuz può rovinare tutto', sintesi:'Il petrolio Usa (WTI) è a circa 90 dollari e il future di dicembre è sceso di oltre il 3% a 88: nella settimana il Brent aveva perso oltre il 13% grazie ai colloqui Usa-Iran. Gli analisti avvertono che nuovi attacchi alle navi nello stretto di Hormuz, da dove passa una grossa fetta del greggio mondiale, farebbero risalire i prezzi.', perche:'Il prezzo della benzina dipende da uno stretto braccio di mare e dalla pazienza di due governi.', spunto:'Il petrolio scende sulle parole, non sui fatti: basta un solo attacco a una nave per cancellare tutta la “pace”.', tags:['X','Video']},
    {cat:'Crypto', rel:'Media', source:'NordFX (dati di mercato)', time:'14:00', title:'Ether crolla del 5% in un giorno: i “fratelli minori” del bitcoin cadono più forte', sintesi:'Oggi l’ether perde circa il 5% a 2.120 dollari, mentre il bitcoin cede meno del 2% restando intorno a 74.400. In una fase di paura, chi aveva scommesso sulle monete alternative perde più di chi ha il bitcoin.', perche:'Se compri crypto “più rischiose” per guadagnare di più, nei momenti brutti perdi di più.', spunto:'Nelle crisi le crypto non sono tutte uguali: il bitcoin cade, le altre precipitano.', tags:['X','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
