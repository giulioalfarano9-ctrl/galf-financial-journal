<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Mar 4 ago 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'Bloomberg / Mohamed El-Erian (Allianz)', time:'05:45', title:'Nvidia vale 5.000 miliardi: nessuno era mai salito così, e ora la paura è la caduta', sintesi:'Nvidia è diventata la prima azienda al mondo a superare i 5.000 miliardi di dollari di valore in Borsa, trascinata dalla corsa all\'intelligenza artificiale: nell\'ultimo trimestre ha incassato 47 miliardi di ricavi e 26 di utili. Ma dopo mesi di rialzi gli esperti frenano: l\'economista Mohamed El-Erian parla di «bolla razionale», mentre Liz Ann Sonders di Charles Schwab avverte che le attese sono state gonfiate troppo.', perche:'Il valore di Nvidia ormai muove l\'intero mercato: se il titolo simbolo dell\'AI inciampa, a tremare sono anche i fondi pensione e i risparmi di chi non ha mai comprato un\'azione tech.', spunto:'Una sola azienda vale 5.000 miliardi sulla promessa dell\'AI: quando un intero mercato poggia su un nome solo, non è forza, è il punto più fragile.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'Bloomberg / CNBC', time:'05:30', title:'Wall Street tocca i record, ma l\'Asia frena: tornano i dubbi sull\'AI', sintesi:'Lunedì Wall Street ha chiuso ai massimi di sempre: il Dow Jones a 53.178 punti (+1,3%), lo S&P 500 a 7.600 (+1,5%) e il Nasdaq in rialzo del 2,1%. Ma l\'Asia non ha seguito: la Borsa di Seul ha perso fino all\'1,9%, trascinata giù dai produttori di chip Samsung e SK Hynix, mentre riaffiorano i dubbi sulla corsa all\'intelligenza artificiale.', perche:'Quando New York vola e l\'Asia arretra sullo stesso tema, vuol dire che il mercato è meno sicuro di quanto sembri: chi ha soldi investiti nel tech dovrebbe farci caso.', spunto:'Wall Street festeggia i record mentre l\'Asia vende i chip: la stessa AI che a New York è un sogno, a Seul comincia già a fare paura.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Reuters / Bloomberg', time:'05:20', title:'Il mercato scommette sui tagli: lavoro debole e prezzi in calo aprono la porta alla Fed', sintesi:'Gli investitori tornano a puntare forte su un taglio dei tassi da parte della banca centrale americana già a settembre. A convincerli sono i segnali di un mercato del lavoro che rallenta e di un\'inflazione, cioè l\'aumento dei prezzi, che si sta raffreddando: due condizioni che darebbero alla Fed lo spazio per abbassare il costo del denaro.', perche:'Tassi più bassi significano mutui, prestiti e rate meno cari: è la notizia che milioni di famiglie e imprese aspettano da mesi.', spunto:'Il mercato dà i tagli per scontati, ma la Fed li ha già promessi troppe volte senza mantenerli: chi festeggia oggi rischia di scoprire domani che l\'attesa non è finita.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Forbes', time:'05:10', title:'Il petrolio crolla quasi del 6%, l\'oro resta aggrappato ai massimi', sintesi:'Il greggio Brent è sceso di circa il 6% in un giorno, fino a poco meno di 83 dollari al barile, con la paura di uno scontro in Medio Oriente che si allenta. L\'oro invece resta vicino ai suoi record, sopra i 4.000 dollari l\'oncia, sostenuto dalla scommessa che la banca centrale americana taglierà ancora i tassi.', perche:'Un petrolio più basso arriva dritto alla pompa e in bolletta, mentre l\'oro alto dice che molti cercano ancora un riparo: due segnali opposti sullo stesso mercato.', spunto:'Il petrolio scende per la tregua e l\'oro sale per la paura dei tassi: il mercato festeggia e si copre nello stesso momento, segno che nessuno crede davvero al ritorno del sereno.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph / CoinDesk', time:'05:00', title:'Bitcoin tiene i 64 mila dollari mentre il mondo trema', sintesi:'Bitcoin resta solido intorno ai 63-64 mila dollari, dopo aver guadagnato oltre il 7% a luglio, nonostante le tensioni geopolitiche e i mercati nervosi. In direzione opposta pesa la vendita di 1.638 bitcoin da parte della società Strategy, uno dei più grandi detentori al mondo, che di solito compra e non vende.', perche:'Per chi ha risparmi in crypto è una prova di maturità: la moneta digitale regge gli scossoni invece di crollare, ma i grandi possono cambiare rotta da un giorno all\'altro.', spunto:'Bitcoin resta in piedi mentre tutto trema, ma se persino chi lo accumulava comincia a vendere, la vera domanda è per quanto ancora terrà.', tags:['X','Threads']},
    {cat:'Geopolitica', rel:'Media', source:'Reuters / Bloomberg', time:'04:55', title:'Trump ferma le bombe sull\'Iran: si tratta per riaprire lo Stretto di Hormuz', sintesi:'Nel fine settimana il presidente americano Trump ha annullato l\'attacco all\'Iran, dicendo che i colloqui stanno facendo progressi verso un accordo che riaprirebbe lo Stretto di Hormuz, il passaggio marittimo da cui transita gran parte del petrolio mondiale. La tensione resta, ma per ora prevale la via diplomatica.', perche:'Quello Stretto è il rubinetto del petrolio del pianeta: se resta aperto, benzina e bollette respirano; se si chiude, i prezzi schizzano per tutti.', spunto:'La pace o la guerra in Medio Oriente si gioca su un tratto di mare largo pochi chilometri: da lì passa il pieno che facciamo ogni settimana, anche se non ce ne accorgiamo.', tags:['LinkedIn','X']}
  ],
  afternoon: [
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg / CNBC', time:'13:30', title:'Trump ferma l\'attacco all\'Iran: i mercati esplodono di sollievo', sintesi:'Colpo di scena nel fine settimana: il presidente Trump ha annullato il raid previsto contro l\'Iran e annunciato la ripresa dei colloqui di pace. La reazione è stata immediata: i future di Wall Street sono saliti (S&P 500 attorno a +0,6%) e il petrolio è crollato di oltre il 5%, sgonfiando in poche ore la tensione costruita nelle ultime settimane.', perche:'In pochi giorni si passa dalle bombe alla trattativa: per famiglie e imprese vuol dire meno paura di benzina e bollette alle stelle, ma anche la conferma che oggi i mercati vivono appesi a un singolo annuncio.', spunto:'Bastano poche parole di un presidente per bruciare in un\'ora la paura costruita in un mese: chi investe inseguendo i titoli di guerra non fa finanza, scommette sui capricci della politica.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Reuters / TipRanks', time:'12:00', title:'Palantir stasera alla prova del fuoco: le opzioni scommettono su un balzo del 12%', sintesi:'Dopo la chiusura di oggi Palantir, simbolo dell\'azionario legato all\'intelligenza artificiale, pubblica i conti. Gli analisti attendono ricavi per circa 1,8 miliardi di dollari, in crescita dell\'81% in un anno, e l\'azienda ha già battuto le attese per otto trimestri di fila. Ma il titolo viaggia il 40% sotto i massimi e le opzioni prezzano uno scossone del 12%, in un senso o nell\'altro.', perche:'È il termometro di quanto gli investitori credano ancora alla corsa dell\'AI: un conto sopra le attese può riaccenderne l\'entusiasmo, uno sotto può gelare l\'intero settore.', spunto:'Otto trimestri battuti di fila e il titolo è comunque il 40% sotto i massimi: quando nemmeno i conti record bastano, vuol dire che il mercato non paga più i risultati, ma solo le aspettative gonfiate.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Reuters / FXLeaders', time:'11:15', title:'Il petrolio crolla del 6%: da arma di guerra a ostaggio dell\'OPEC', sintesi:'In un solo giorno il greggio ha perso oltre il 6%: il Brent, riferimento europeo, è sceso verso gli 83 dollari e il WTI americano sotto gli 80, dopo settimane sopra quota 92. A farlo cadere due colpi insieme: la distensione con l\'Iran e la decisione dell\'OPEC+ di aumentare la produzione di 188 mila barili al giorno da settembre, chiudendo i tagli degli ultimi anni.', perche:'Un petrolio più basso significa benzina e bollette meno care e un po\' di respiro contro l\'inflazione: la stessa guerra che spingeva i prezzi su, ora che si placa li fa scendere altrettanto in fretta.', spunto:'Il greggio è passato da 92 a 80 dollari in pochi giorni senza che cambiasse nulla di reale nei consumi: la prova che il prezzo dell\'energia lo decidono la politica e i produttori, non chi fa il pieno.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Media', source:'CNBC / Bloomberg', time:'10:30', title:'Venerdì il dato sul lavoro: l\'America teme un\'economia che frena', sintesi:'Tutta la settimana ruota attorno al rapporto sull\'occupazione di venerdì. A giugno l\'economia americana aveva creato appena 57 mila posti, molto meno del previsto, e per luglio gli analisti ne stimano circa 87 mila. Un numero debole confermerebbe che il mercato del lavoro si sta raffreddando, proprio mentre la Fed tiene i tassi alti per domare l\'inflazione.', perche:'Meno assunzioni significano stipendi più fermi e famiglie più prudenti nello spendere: è il segnale che dice se l\'economia sta solo rallentando o comincia a incepparsi.', spunto:'La Fed tiene i tassi alti contro l\'inflazione mentre il lavoro rallenta: se venerdì i numeri deludono, la banca centrale finisce stretta tra due fuochi, e a pagare il conto sarà chi un lavoro lo cerca.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph / BeInCrypto', time:'09:45', title:'Bitcoin e «l\'agosto maledetto»: quattro anni di cali, ma le balene comprano', sintesi:'Bitcoin entra in agosto intorno ai 64 mila dollari, ancora fiacco dopo un primo semestre difficile. Il mese fa paura: negli ultimi quattro anni ad agosto la moneta digitale ha perso in media il 10%. Eppure i grandi investitori, le cosiddette «balene», stanno accumulando, scommettendo che stavolta la maledizione stagionale si spezzi.', perche:'Per chi ha risparmi in crypto è il classico bivio: la storia invita alla prudenza, i grandi player comprano. Due segnali opposti nello stesso momento.', spunto:'Quando i piccoli guardano il calendario e i grandi comprano lo stesso, la vera domanda non è se agosto sarà nero, ma chi resterà col cerino in mano quando la scommessa finirà.', tags:['X','Threads']},
    {cat:'Azionario', rel:'Media', source:'CNBC', time:'12:40', title:'SpaceX alla prova dei conti: martedì il primo bilancio da società quotata', sintesi:'A sette settimane dallo sbarco in Borsa, SpaceX pubblica martedì il suo primo bilancio trimestrale da azienda quotata. L\'esordio è stato turbolento, con il titolo in balìa delle oscillazioni. Ora gli investitori vogliono numeri veri dietro il mito di Elon Musk: quanto incassano davvero razzi e satelliti Starlink.', perche:'È il primo test di trasparenza per una delle aziende più chiacchierate al mondo: per la prima volta chiunque potrà giudicare i conti, non solo i lanci spettacolari.', spunto:'Finora SpaceX si è misurata in razzi lanciati; da martedì la misureranno in dollari incassati. E davanti ai bilanci il mercato è molto meno indulgente del pubblico dei lanci.', tags:['LinkedIn','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
