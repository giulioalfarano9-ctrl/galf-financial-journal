<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Lun 7 set 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'CNBC / Bloomberg', time:'06:00', title:'Il lavoro americano corre e la Fed prepara la stretta', sintesi:'Ad agosto gli Stati Uniti hanno creato 162.000 posti di lavoro contro i 53.000 attesi dagli economisti. Il dato ha rilanciato le scommesse su un aumento dei tassi già alla riunione di settembre, dopo che il presidente della Fed Kevin Warsh ha avvertito che l\'inflazione resta troppo alta: a luglio i prezzi correvano al 3,7%, ben sopra l\'obiettivo del 2%.', perche:'Se il denaro torna a costare di più negli Stati Uniti, la stretta arriva anche qui: mutui, prestiti e rendimenti si muovono a rimorchio di Washington.', spunto:'Ci hanno insegnato che più occupati significa più benessere: oggi significa solo che qualcuno ti alzerà la rata del mutuo per punirti di stare troppo bene.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Al Jazeera / Reuters', time:'06:20', title:'Hormuz è ancora chiuso, e nessuno chiama più questa una crisi', sintesi:'Lo Stretto di Hormuz resta di fatto sbarrato al traffico commerciale: il 30 agosto lo hanno attraversato 6 navi contro le circa 85 di una giornata normale. Le esportazioni di greggio dal Golfo sono crollate del 47% rispetto a prima della guerra, da 17 a circa 9 milioni di barili al giorno, e assicurare una petroliera oggi costa 40 volte più di un anno fa.', perche:'Metà del petrolio che non passa da lì è petrolio che tutti gli altri devono comprare altrove, più caro, e la differenza finisce nella tua bolletta.', spunto:'Un blocco navale che dura da sei mesi non è più un\'emergenza: è il nuovo prezzo dell\'energia, e abbiamo smesso di protestare solo perché ci siamo abituati.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Alta', source:'Markets.com / Trading Economics', time:'06:40', title:'Il petrolio vola a 91 dollari, l\'oro arretra sotto 4.400', sintesi:'Il greggio viaggia intorno ai 91 dollari al barile, in rialzo di circa il 9% in una settimana per gli attacchi in Medio Oriente e l\'incertezza su Hormuz; l\'OPEC+ ha scelto di non toccare la produzione per ottobre. L\'oro invece scende verso i 4.395 dollari l\'oncia: le attese di tassi più alti lo rendono meno appetibile.', perche:'Petrolio su e oro giù insieme vuol dire una cosa sola: il mercato teme il carovita, non il crollo.', spunto:'L\'oro scende mentre il mondo brucia: il metallo che doveva proteggerci dalle catastrofi ha smesso di funzionare proprio quando servirebbe.', tags:['X','Threads']},
    {cat:'Azionario', rel:'Media', source:'Yahoo Finance / Reuters', time:'07:00', title:'Nvidia si compra Hugging Face per 13 miliardi e chiude il cerchio', sintesi:'Nvidia ha annunciato l\'acquisto di Hugging Face, la piattaforma dove sviluppatori di tutto il mondo condividono modelli di intelligenza artificiale, per circa 13 miliardi di dollari: è la seconda operazione più grande della sua storia e dovrebbe chiudersi nel 2027. Il titolo ha guadagnato l\'1%. Oggi Wall Street resta chiusa per la festa del lavoro.', perche:'Chi produce i chip dell\'intelligenza artificiale ora controlla anche il luogo dove quei modelli vengono costruiti e distribuiti.', spunto:'Non è un\'acquisizione, è un pedaggio: Nvidia vendeva già le strade dell\'intelligenza artificiale, adesso possiede pure il casello.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'BeInCrypto / Cointelegraph', time:'07:20', title:'Il bitcoin resta incollato agli 80 mila e i soldi continuano ad arrivare', sintesi:'Il bitcoin oscilla poco sotto gli 80.000 dollari, in calo di quasi l\'1%, ma i fondi quotati hanno incassato circa 175 milioni di dollari in un giorno, terza seduta positiva di fila. L\'indice che misura l\'umore del mercato resta in zona «avidità» a 74. Il mercato prevede al 77% il superamento degli 85.000 dollari entro il 2 ottobre (previsione di mercato, non confermata).', perche:'Anche con la Fed pronta a stringere, sulle criptovalute continuano ad arrivare soldi: il denaro non ha più paura.', spunto:'Comprare bitcoin mentre la banca centrale minaccia di alzare i tassi non è coraggio: è la prova che il mercato non crede a una parola di quelle minacce.', tags:['X','LinkedIn']},
    {cat:'Macro', rel:'Media', source:'Morningstar / CNBC', time:'07:35', title:'Warsh minaccia la stretta ma ammette di non avere i voti', sintesi:'Il presidente della Fed Kevin Warsh ha detto chiaramente che a settembre «non ci sarà un consenso» per alzare i tassi, pur ripetendo che l\'inflazione è troppo alta. Gli analisti si dividono: molti spostano il possibile rialzo a ottobre o dicembre, mentre i mercati danno alla mossa di settembre poco più del 50%.', perche:'Quando la banca centrale minaccia senza colpire, i prezzi continuano a salire e l\'attesa costa a tutti.', spunto:'Una banca centrale che annuncia una stretta che non ha i voti per fare non sta guidando l\'economia: sta bluffando, e i prezzi al supermercato se ne accorgono prima di noi.', tags:['LinkedIn','Threads']}
  ],
  afternoon: [
    {cat:'Geopolitica', rel:'Alta', source:'Reuters / CNBC', time:'08:50', title:'Gli Stati Uniti affondano tre petroliere iraniane, il greggio riparte', sintesi:'Nel fine settimana le forze americane hanno colpito tre petroliere iraniane, una davanti all\'isola di Kharg, il principale porto petrolifero di Teheran, dopo che navi da guerra statunitensi erano state prese di mira con missili. L\'Iran ha risposto dichiarando una nuova zona vietata fuori dallo Stretto di Hormuz. Il Brent sale dell\'1,3% a 97,57 dollari al barile.', perche:'Quando si spara sulle navi che trasportano il petrolio, il rincaro non resta in Medio Oriente: arriva al distributore sotto casa in poche settimane.', spunto:'Colpire le petroliere per far tornare la calma è come spegnere un incendio con la benzina: il conto di questa strategia lo paghiamo noi, un pieno alla volta.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Alta', source:'Insurance Journal / The National', time:'10:15', title:'Assicurare una petroliera costa fino a 10 milioni, e a garantire è lo Stato americano', sintesi:'Portare una nave attraverso Hormuz oggi costa in assicurazione tra il 3% e il 10% del valore dello scafo, contro lo 0,25% di prima della guerra: per una petroliera da 100 milioni si passa da 250 mila a 10 milioni di dollari. Per tenere aperta la rotta, Washington ha portato a 40 miliardi le garanzie pubbliche di riassicurazione, con dentro anche AIG e Berkshire Hathaway.', perche:'Il rischio di guerra non lo pagano più le compagnie private: lo ha preso in carico il contribuente americano, e finisce comunque nel prezzo di ciò che compriamo.', spunto:'Quaranta miliardi di soldi pubblici per assicurare navi private in una guerra decisa dai governi: i profitti restano agli armatori, le perdite le abbiamo già nazionalizzate.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNBC / Kalshi', time:'11:20', title:'Il mercato scommette che la Fed alzi i tassi il 16 settembre', sintesi:'I contratti sui tassi danno ormai circa il 57% di probabilità a un aumento di un quarto di punto alla riunione del 16 settembre: a inizio anno gli economisti si aspettavano tagli. A ribaltare tutto sono stati il discorso duro di Kevin Warsh a Jackson Hole e il petrolio sopra i 90 dollari. Il titolo di Stato americano a dieci anni rende il 4,80%, massimo da fine 2023.', perche:'Un rialzo dei tassi in America significa mutui, prestiti e debito pubblico più cari ovunque, Italia compresa.', spunto:'Alzare i tassi per fermare un\'inflazione causata da una guerra sul petrolio è come mettere il condizionatore contro un incendio: costa a tutti e non spegne niente.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'AP / TradingKey', time:'12:05', title:'Tokyo sfonda quota 66 mila, Seul sfiora i 7 mila: è la corsa alle memorie', sintesi:'Il Nikkei giapponese ha chiuso a 66.399 punti (+2,1%), il Kospi coreano è salito del 4,6% a 6.995. A trainare sono i produttori di memorie per l\'intelligenza artificiale: SK Hynix +8,1%, Kioxia +7,9%, SoftBank +6,8%, Samsung +5,7%. Le Borse europee, nella stessa mattinata, sono rimaste in leggero calo.', perche:'La parte più redditizia dell\'intelligenza artificiale non è il software americano ma un chip fabbricato tra Seul e Tokyo, e in quella corsa l\'Europa non è nemmeno iscritta.', spunto:'Mentre l\'Europa discute di regole per l\'intelligenza artificiale, Corea e Giappone si stanno prendendo i soldi: chiamiamola pure prudenza, ma somiglia molto a una resa.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinMarketCap / Cointelegraph', time:'12:50', title:'Il bitcoin non si scompone: guerra sul petrolio, prezzo fermo a 80 mila', sintesi:'Con le petroliere sotto attacco e il greggio a 97 dollari, il bitcoin resta a 79.794 dollari, appena lo 0,2% in meno in ventiquattro ore. L\'intero mercato delle criptovalute vale 2,77 trilioni di dollari, in calo dello 0,3%, e l\'indice che misura l\'umore degli investitori segna 71, cioè «avidità».', perche:'La moneta nata per proteggere dai disastri non si muove quando il disastro arriva davvero: è diventata un\'attività come le altre.', spunto:'Ci hanno venduto il bitcoin come rifugio dalle crisi: alla prima guerra vera sul petrolio non si muove di un centimetro, e nessuno spiega più a cosa serva.', tags:['X','LinkedIn']},
    {cat:'Geopolitica', rel:'Media', source:'Bloomberg', time:'13:30', title:'Washington gela chi spera in un accordo con l\'Iran', sintesi:'Il segretario all\'Energia americano Chris Wright ha detto domenica che un\'intesa sul nucleare iraniano difficilmente arriverà a breve. È la doccia fredda per chi contava su una tregua capace di riportare il petrolio ai prezzi di prima: il Brent è salito del 7,8% nell\'ultima settimana, il greggio americano di quasi il 10%.', perche:'Senza trattativa non c\'è ritorno ai prezzi di prima: il caro energia smette di essere un\'emergenza e diventa la normalità.', spunto:'Nessuno sta più negoziando la pace, si sta solo negoziando chi paga la guerra: e a giudicare dalle bollette, la risposta l\'abbiamo già ricevuta.', tags:['LinkedIn','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
