<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Gio 30 lug 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'CNBC / Bloomberg', time:'05:45', title:'La Fed tiene i tassi ma si spacca: tre voti chiedevano il rialzo', sintesi:'La banca centrale americana ha lasciato i tassi fermi al 3,50-3,75%, ma con una spaccatura rara: tre presidenti regionali hanno votato contro, chiedendo un aumento perché l\'inflazione resta troppo alta da anni. Il nuovo presidente Kevin Warsh ha liquidato lo scontro così: «Volevo una bella lite in famiglia e l\'ho avuta». Le Borse hanno chiuso in rosso, con il Dow giù di oltre 840 punti.', perche:'Una Fed divisa è una Fed imprevedibile: nessuno sa più se il prossimo passo sarà un taglio o un rialzo, e questa incertezza pesa su mutui, prestiti e Borsa.', spunto:'Quando dentro la Fed si litiga sul rialzo mentre fuori tutti sognano i tagli, il messaggio è uno solo: l\'inflazione non è affatto sconfitta.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'Bloomberg / CNBC', time:'05:20', title:'Microsoft vola, Meta crolla del 10%: l\'AI premia solo chi la fa rendere', sintesi:'Notte di conti opposti. Microsoft ha battuto le attese con ricavi a 90 miliardi e la sua nuvola Azure cresciuta del 43%, e in Borsa è salita del 2%. Meta invece ha deluso: utili sotto le stime, profitti in calo del 14% e spese schizzate a 42 miliardi, e il titolo è crollato di circa il 10% dopo la chiusura. Zuckerberg promette comunque di spendere fino a 145 miliardi sull\'AI.', perche:'Il mercato non punisce più la spesa sull\'AI in sé: punisce chi spende tanto senza mostrare ancora il guadagno. La differenza tra le due aziende lo dice chiaro.', spunto:'Stessa parola magica, "AI", due destini opposti: Microsoft incassa, Meta brucia cassa. La sbornia tecnologica sta finendo e ora conta solo chi fa utili.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'Investing.com / FX Leaders', time:'05:15', title:'Stasera Apple e Amazon: l\'ultimo esame della grande tech', sintesi:'Dopo la chiusura di oggi tocca ad Apple e Amazon. Da Apple ci si attendono utili per 1,89 dollari ad azione e ricavi a 109 miliardi; da Amazon l\'attenzione è tutta sulla nuvola AWS e sui profitti del commercio online. Due colossi che da soli valgono migliaia di miliardi e possono muovere l\'intera Borsa.', perche:'Chi ha risparmi legati agli indici americani ha buona parte del proprio denaro in queste due aziende: i loro conti di stasera pesano sul portafoglio di milioni di persone.', spunto:'Dopo il ko di Meta il mercato arriva ai conti di Apple e Amazon col fiato sospeso: basta una delusione e la festa dei giganti diventa resa dei conti.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Forbes / Trading Economics', time:'05:25', title:'Il petrolio rimbalza del 6% in un giorno: torna la paura inflazione', sintesi:'Dopo giorni di cali il greggio è tornato a correre: oltre il 6% in una sola seduta, fino a circa 84 dollari al barile, e nell\'ultimo mese è salito di più del 20%. La tregua nel Golfo convince poco: gli operatori tornano a scommettere su forniture a rischio.', perche:'Un petrolio che rincara si scarica su benzina e bollette e rialimenta l\'inflazione: proprio la ragione per cui una parte della Fed vuole alzare i tassi.', spunto:'Il petrolio rimbalza del 6% e smaschera la finta calma: finché l\'energia resta cara, chi dice che l\'inflazione è sconfitta racconta solo metà della storia.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / CoinMarketCap News', time:'05:00', title:'Bitcoin resta a 64 mila: dalla Fed divisa nessuna direzione', sintesi:'Bitcoin galleggia intorno ai 64 mila dollari, quasi immobile dopo la decisione della Fed. La banca centrale spaccata non ha dato un segnale chiaro, e senza una direzione netta sui tassi anche le monete digitali restano ferme, in attesa del prossimo appuntamento di settembre.', perche:'Chi tiene crypto sperava in un mercato che va per conto suo: e invece resta appeso, come le azioni, a ogni parola della banca centrale americana.', spunto:'Il Bitcoin doveva essere l\'alternativa alle banche centrali: e invece se ne sta immobile ad aspettare la Fed, esattamente come qualsiasi titolo di Wall Street.', tags:['X','Threads']},
    {cat:'Commodities', rel:'Media', source:'CNBC / Trading Economics', time:'05:10', title:'L\'oro resta aggrappato ai record: la paura non se ne va', sintesi:'Nonostante il petrolio in rialzo e una Fed che non taglia, l\'oro tiene: viaggia intorno ai 4.080 dollari l\'oncia, poco sotto i massimi storici. Gli investitori continuano a comprarlo come rifugio, segno che la fiducia nel resto dei mercati resta fragile.', perche:'Quando i grandi capitali restano aggrappati all\'oro anche con i tassi alti, stanno dicendo che temono qualcosa: è un allarme che riguarda tutti, non solo chi ha lingotti.', spunto:'L\'oro vicino ai record mentre le Borse tremano e la Fed litiga: il denaro più prudente non crede alla ripresa, si sta solo mettendo al riparo.', tags:['LinkedIn','Threads']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'Reuters / CNBC', time:'13:30', title:'Crollano i chip della memoria: l\'intelligenza artificiale comincia a far paura sul serio', sintesi:'A Seul è stata la seduta peggiore da anni: SK Hynix ha perso circa il 15%, Samsung il 13% e l\'indice coreano Kospi è affondato dell\'11%. Il contagio è arrivato in America, con Micron giù del 5% e AMD e Intel oltre il 3%. Cresce il sospetto che i miliardi spesi nell\'intelligenza artificiale non renderanno quanto promesso.', perche:'Quei chip finiscono nei server che fanno funzionare l\'AI di tutti: se chi li produce crolla, è il primo segnale che la grande scommessa tecnologica potrebbe non ripagare i risparmi legati alla Borsa.', spunto:'Per due anni bastava la parola "intelligenza artificiale" per far volare i titoli: oggi le fabbriche di chip crollano del 15% in un giorno, e il mercato inizia a chiedere dov\'è finito il profitto.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Media', source:'Liz Ann Sonders (Charles Schwab)', time:'12:40', title:'Sonders: «Non è la bolla del 2000, ma se l\'AI delude sarà un terremoto»', sintesi:'Liz Ann Sonders, capo strategist di Charles Schwab, mette in guardia: l\'entusiasmo per l\'AI e gli accordi incrociati tra i grandi gruppi tecnologici le ricordano la bolla di internet di 25 anni fa. La differenza, dice, è che oggi i protagonisti sono colossi con conti solidi, non piccole aziende in perdita. Ma il vero rischio è aver alzato troppo le aspettative.', perche:'Se le società dell\'AI non manterranno le promesse gonfiate, la delusione può travolgere non solo la Borsa ma anche l\'economia reale, e con essa il lavoro e i risparmi di tutti.', spunto:'Il pericolo dell\'intelligenza artificiale non è che sia una truffa come nel 2000: è che sia vera ma promessa troppo in grande, e le attese gonfiate si pagano sempre.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Trading Economics', time:'11:15', title:'L\'oro sfiora i record: la paura si rifugia nel metallo prima della Fed', sintesi:'Mentre le Borse tremano, l\'oro sale verso i 4.100 dollari l\'oncia, a un passo dai massimi storici. Gli investitori cercano un porto sicuro alla vigilia della decisione della banca centrale americana, e questo nonostante il calo del petrolio abbia raffreddato i timori sull\'inflazione. Il metallo giallo vale oggi molto più di un anno fa.', perche:'Quando i grandi capitali corrono verso l\'oro, stanno dicendo che si fidano poco di tutto il resto: è un termometro della paura che riguarda anche chi non ha un solo lingotto.', spunto:'L\'oro vola verso i record proprio mentre i tecnologici crollano: il denaro intelligente non compra il futuro dell\'AI, compra la protezione contro di esso.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph / CoinMarketCap News', time:'12:20', title:'Grayscale scommette su Worldcoin, ma la legge sulle crypto si impantana', sintesi:'Il gigante Grayscale ha chiesto il permesso di lanciare il primo fondo quotato sulla criptovaluta Worldcoin (WLD), che è subito salita dell\'8%. Ma sul fronte delle regole è stallo: la legge americana che dovrebbe dare certezze al settore, il CLARITY Act, si è arenata in Senato per lo scontro sugli affari crypto legati a Trump.', perche:'Chi investe in monete digitali resta senza regole chiare: senza una legge, ogni progetto vive di annunci e speculazione, e il rischio ricade sul piccolo risparmiatore.', spunto:'Wall Street corre a inventare nuovi fondi crypto mentre il Congresso non riesce a scrivere due regole: il settore vuole i soldi degli ETF ma non le responsabilità delle leggi.', tags:['X','Threads']},
    {cat:'Geopolitica', rel:'Media', source:'Bloomberg / Fortune', time:'10:50', title:'Il petrolio crolla del 7%: la pace con l\'Iran riapre i rubinetti del Golfo', sintesi:'Il greggio è precipitato di circa il 7% in una sola giornata, con il Brent sotto i 90 dollari, dopo la ripresa dei colloqui tra Stati Uniti e Iran e il ritorno delle esportazioni dall\'oleodotto CPC. La tregua nel Golfo, ancora fragile, sta riportando sul mercato il petrolio che la guerra aveva tenuto bloccato.', perche:'Un petrolio più economico significa benzina e bollette più leggere e meno inflazione: è forse la migliore notizia della giornata per il portafoglio delle famiglie.', spunto:'Bastano due giorni di colloqui per far crollare il petrolio del 7%: la prova che a muovere davvero il prezzo dell\'energia non è il mercato, ma la politica.', tags:['LinkedIn','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
