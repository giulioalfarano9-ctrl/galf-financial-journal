<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Ven 6 nov 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'Reuters', time:'05:30', title:'Wall Street in ginocchio: il Nasdaq brucia 2.500 miliardi in una sola seduta', sintesi:'Giovedì il Nasdaq ha perso il 5,5%, il peggior crollo da aprile 2025; l’S&P 500 è sceso del 4,4% e il Dow del 3,4%. Nvidia ha lasciato sul terreno oltre il 9% e AMD il 17%. Reuters lega la caduta alla vittoria dei Democratici alle elezioni di metà mandato e ai dubbi sui miliardi spesi in intelligenza artificiale.', perche:'I tuoi fondi e il tuo piano pensione sono pieni di questi titoli: quando i giganti tecnologici tremano, tremi anche tu.', spunto:'Il mercato non ha paura della politica: ha scoperto che l’IA costa miliardi e ancora non rende abbastanza.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'ATFX Capital (dati CME FedWatch)', time:'05:45', title:'Borse a picco e la Fed pensa ad alzare i tassi: il paradosso di dicembre', sintesi:'Le scommesse su un nuovo rialzo dei tassi a dicembre sono attorno al 66% (secondo Reuters oltre l’80%: le fonti non concordano). Oggi escono i dati sul lavoro Usa di ottobre: attesi 65 mila nuovi posti contro i 29 mila di settembre, disoccupazione al 4,2%.', perche:'Se i tassi salgono, mutui e prestiti costano di più proprio mentre la Borsa perde colpi.', spunto:'La Fed rischia di curare l’inflazione ammazzando la crescita: a pagare il conto sarà chi ha un mutuo.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Alta', source:'Cointelegraph', time:'05:15', title:'Il bitcoin butta via la festa elettorale: da 80.000 a meno di 76.000 dollari in un giorno', sintesi:'Mercoledì il bitcoin aveva superato gli 80.000 dollari dopo il voto Usa, poi è crollato trascinato dalle Borse. I fondi quotati sul bitcoin (ETF) hanno perso 430 milioni giovedì; il più grande, IBIT di BlackRock, è alla quinta seduta di uscite, oltre un miliardo dal 30 ottobre.', perche:'Se i grandi investitori scappano alla prima paura, il bitcoin non è il rifugio che ti hanno raccontato.', spunto:'Chiamarlo “oro digitale” è comodo finché sale: al primo crollo in Borsa il bitcoin si comporta da azione tecnologica.', tags:['X','Threads']},
    {cat:'Geopolitica', rel:'Alta', source:'Eurasia Group (via ATFX Capital)', time:'05:00', title:'Petrolio sull’ottovolante: dopo il -8% di mercoledì il Brent rimbalza e la guerra con l’Iran non è finita', sintesi:'Il Brent, il prezzo di riferimento del greggio, risale del 4,7% a circa 99 dollari dopo il tonfo di mercoledì. Per Eurasia Group le probabilità di nuovi attacchi americani sull’Iran sono del 60%, e in quel caso il prezzo potrebbe volare a 110-125 dollari. È una stima di analisti, non un fatto.', perche:'Benzina, bollette e prezzi al supermercato seguono il petrolio: una nuova escalation si sente subito sulle tue spese.', spunto:'Il petrolio non guarda alle urne: guarda ai missili, e la tregua dopo il voto è tutta da dimostrare.', tags:['X','Video']},
    {cat:'Commodities', rel:'Media', source:'ATFX Capital', time:'06:00', title:'L’oro resiste al disastro: 4.088 dollari e miglior settimana da agosto', sintesi:'Mentre le azioni crollavano, l’oro ha guadagnato lo 0,57% a 4.088 dollari l’oncia e punta alla migliore settimana da agosto. Il dollaro è fermo e i rendimenti dei titoli di Stato Usa a 10 anni scendono verso il 4,83%: segno che i soldi cercano sicurezza.', perche:'Quando le Borse vanno nel panico, chi ha un po’ di oro in portafoglio dorme più tranquillo.', spunto:'Il giorno in cui l’intelligenza artificiale delude, il metallo più antico del mondo vince: la storia si ripete sempre.', tags:['LinkedIn','Video']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'Bloomberg', time:'13:30', title:'I chip crollano del 7% in un giorno: il Nasdaq ha il peggior venerdì da giugno', sintesi:'Venerdì il Nasdaq 100 ha perso il 3,5% e l’indice dei semiconduttori (i chip che fanno funzionare l’IA) il 7,2%. Alphabet e Amazon hanno deluso: spendono miliardi in IA mentre i loro affari di sempre rallentano. Oggi i futures rimbalzano, ma stasera Apple e Palantir presentano i conti.', perche:'Fondi e piani pensione sono pieni di questi titoli: se i colossi inciampano, il tuo risparmio inciampa con loro.', spunto:'Il mercato ha scommesso tutto sull’IA senza chiedere dove sono i profitti: il conto di questa festa non lo pagano le Big Tech.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Alta', source:'Saxo Bank / Bloomberg', time:'13:00', title:'L’oro cade al minimo da oltre un anno: ottobre brucia il 6,8%', sintesi:'Venerdì l’oro ha chiuso al livello più basso in più di un anno e ottobre si è chiuso a -6,8%. Oggi rimbalza di circa l’1%, intorno a 3.900 dollari l’oncia. L’argento sale del 2,3%, a 50 dollari.', perche:'L’oro è il rifugio per eccellenza: se perde quota proprio mentre le Borse tremano, nessun posto sembra davvero sicuro.', spunto:'Ci hanno insegnato che l’oro protegge nelle crisi: ottobre dimostra che nessun rifugio è garantito.', tags:['X','Threads']},
    {cat:'Macro', rel:'Alta', source:'Bloomberg', time:'12:30', title:'La Gran Bretagna paga il 5,3% per farsi prestare soldi, la Germania il 3,3%', sintesi:'Il titolo di Stato britannico a 10 anni rende il 5,28%, quello tedesco il 3,32%, quello americano il 4,92%. Più alto è il rendimento, più lo Stato paga per indebitarsi. Londra ha quasi due punti di svantaggio su Berlino.', perche:'Se lo Stato paga di più per i suoi debiti, a lungo andare lo pagano i cittadini con tasse più alte o servizi ridotti.', spunto:'Il debito britannico è un campanello d’allarme: i mercati non fanno sconti a chi spende più di quel che può.', tags:['LinkedIn','Threads']},
    {cat:'Geopolitica', rel:'Media', source:'AP / Saxo Bank', time:'13:15', title:'Trump promette: niente raid sull’Iran fino al voto. E dopo?', sintesi:'Trump ha assicurato che non ci saranno nuovi attacchi prima delle elezioni di domani, ma non esclude azioni militari dopo. Qatar e Iran trattano da tre giorni per fermare la guerra. Goldman Sachs vede il Brent a 105 dollari a dicembre, contro i 109 di oggi.', perche:'Dalla pace o dalla guerra dipende il prezzo di benzina e bollette nei prossimi mesi.', spunto:'Una tregua che finisce con le urne non è pace: è una pausa elettorale, e i mercati lo sanno.', tags:['X','Video']},
    {cat:'Crypto', rel:'Media', source:'Bloomberg / Saxo Bank', time:'13:45', title:'Bitcoin risale a 78.000 dollari, ma i fondi in bitcoin scappano', sintesi:'Il bitcoin guadagna per il terzo giorno di fila, a circa 78.000 dollari, dopo il crollo seguito all’attacco hacker a Binance. Ma i fondi quotati sul bitcoin (gli ETF) hanno perso 643 milioni in un giorno, il peggior dato da giugno. Coinbase ha perso l’11% venerdì.', perche:'Il prezzo sale, ma i grandi investitori escono: un rimbalzo senza di loro è fragile.', spunto:'Un rialzo senza compratori seri non è una ripresa: è solo una pausa prima del prossimo scossone.', tags:['LinkedIn','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
