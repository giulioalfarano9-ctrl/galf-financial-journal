<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Ven 31 lug 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'Bloomberg / CNBC', time:'05:40', title:'Wall Street rimbalza e Microsoft fa la storia: +450 miliardi in un giorno', sintesi:'Dopo il tonfo di mercoledì, ieri le grandi aziende tecnologiche americane sono tornate a correre: l\'indice Nasdaq dei tecnologici ha guadagnato il 3,4%, l\'S&P 500 l\'1,7%. A trainare è stata Microsoft, volata del 16% e capace di aggiungere circa 450 miliardi di dollari di valore in una sola seduta: mai nessun titolo aveva guadagnato così tanto in un giorno.', perche:'Milioni di pensioni e fondi sono legati a questi colossi: quando salgono così il risparmio di chi investe respira, ma un mercato che oscilla del 3% in un giorno resta un mercato nervoso.', spunto:'Un giorno il mercato seppellisce l\'intelligenza artificiale, il giorno dopo la incorona con 450 miliardi: chi vende certezze sull\'AI sta vendendo fumo, in un senso o nell\'altro.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Reuters / CNBC', time:'05:30', title:'La Fed non taglia e ora il mercato scommette sul contrario: tassi su', sintesi:'La banca centrale americana ha tenuto i tassi fermi al 3,50-3,75% per la quinta volta di fila, ma con una spaccatura netta: tre membri hanno votato per alzarli subito, perché i prezzi corrono da oltre cinque anni sopra l\'obiettivo. Ora gli investitori si aspettano uno o due rialzi entro fine anno, non i tagli sognati.', perche:'Se il costo del denaro sale invece di scendere, mutui e prestiti diventano più cari: chi aspettava rate più leggere rischia di dover attendere ancora a lungo.', spunto:'Per mesi ci hanno raccontato l\'anno dei tagli: adesso dentro la Fed c\'è chi chiede rialzi. L\'inflazione non è battuta, e fingere il contrario costa caro al risparmiatore.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg / Trading Economics', time:'05:25', title:'Nuovi raid Usa sull\'Iran, il petrolio sfonda i 92 dollari', sintesi:'Gli Stati Uniti hanno lanciato una nuova ondata di attacchi aerei contro l\'Iran, dopo i colpi alle proprie forze in Medio Oriente. Il petrolio Brent, il riferimento europeo, è salito oltre i 92 dollari al barile e in un mese è cresciuto di quasi il 26%. Lo scontro ora si allarga al Mar Rosso, dove i ribelli yemeniti minacciano di bloccare l\'Arabia Saudita.', perche:'Ogni rincaro del greggio arriva dritto su benzina e bollette e rialimenta l\'inflazione proprio mentre la Fed cerca di spegnerla: la guerra lontana la paghiamo al distributore.', spunto:'Finché a decidere il prezzo dell\'energia sono i missili e non il mercato, ogni piano contro l\'inflazione è ostaggio della prossima notte di bombe nel Golfo.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'Reuters / CNBC', time:'05:15', title:'Amazon sfonda i 200 miliardi in un trimestre: la nube vola del 37%', sintesi:'Amazon ha incassato in tre mesi oltre 200 miliardi di dollari, un record mai visto prima, battendo le attese. Il motore è AWS, la sua divisione di servizi via internet per le aziende, cresciuta del 37%, il ritmo più veloce in quattro anni e mezzo. Ma la spesa per costruire l\'intelligenza artificiale è salita a 169 miliardi, il 64% in più in un anno.', perche:'Il colosso dimostra che i miliardi buttati nell\'AI cominciano davvero a rendere: una prova concreta, non una promessa, per chi ha risparmi legati alla Borsa americana.', spunto:'Microsoft e Amazon danno la risposta che il mercato voleva: l\'AI può ripagare, ma solo per chi ha già clienti e conti solidi. Per tutti gli altri resta una scommessa al buio.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Trading Economics', time:'05:05', title:'L\'oro resta aggrappato ai 4.100 dollari: la paura non molla', sintesi:'Nonostante i tassi alti, che di solito lo frenano, l\'oro tiene: viaggia intorno ai 4.100 dollari l\'oncia, vicino ai massimi storici, ed è salito di oltre il 25% da inizio 2025. A spingerlo è anche il dollaro debole, dopo che si sospetta un intervento del Giappone per sostenere lo yen.', perche:'Quando il denaro più prudente resta sull\'oro anche con i tassi alti, sta dicendo che ha paura: un allarme che riguarda tutti, non solo chi possiede lingotti.', spunto:'L\'oro vicino ai record mentre tutto oscilla: il capitale più prudente non scommette sulla ripresa, si sta solo mettendo al riparo.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinMarketCap News / Cointelegraph', time:'05:00', title:'Bitcoin risale a 65 mila dopo la Fed, ma resta appeso alle sue mosse', sintesi:'Bitcoin è tornato sopra i 65 mila dollari, in rialzo di circa il 2% dopo la decisione della banca centrale americana di non toccare i tassi. Le monete digitali hanno reagito bene allo stop, ma restano deboli e senza una direzione propria, appese a ogni prossima parola della Fed.', perche:'Chi tiene crypto sperava in un bene che va per conto suo: e invece resta legato, come le azioni, alle decisioni della banca centrale che diceva di voler superare.', spunto:'Il Bitcoin doveva essere l\'alternativa alle banche centrali: e invece festeggia o trema a ogni riunione della Fed, esattamente come un titolo qualsiasi di Wall Street.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'Reuters / Axios', time:'13:20', title:'Microsoft sfonda il muro: la sua nube da 100 miliardi zittisce i dubbi sull\'AI', sintesi:'Microsoft ha chiuso il trimestre con un profitto record di 35,8 miliardi di dollari e ricavi per 90 miliardi, oltre le attese. Il cuore della corsa è Azure, la sua divisione di servizi via internet per le aziende, cresciuta del 43% e ormai capace di incassare più di 100 miliardi l\'anno. Il titolo è balzato di circa il 9%.', perche:'Dopo giorni di paura sull\'AI, il colosso mostra che quei miliardi spesi stanno davvero producendo guadagni: una boccata d\'ossigeno per chiunque abbia fondi o pensione legati alla Borsa americana.', spunto:'Microsoft dà la risposta che il mercato cercava: l\'intelligenza artificiale può ripagare, ma solo per chi ha già i clienti e i conti per sostenerla. Per tutti gli altri resta una scommessa.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNBC / Bloomberg', time:'11:30', title:'Il mercato sfida la Fed: ora scommette apertamente su un rialzo dei tassi', sintesi:'Dopo lo stop ai tassi deciso ieri con un voto spaccato (9 contro 3), gli investitori hanno smesso di aspettare i tagli: adesso puntano su un aumento entro fine anno. Il nuovo presidente Kevin Warsh giura che la Fed «non esiterà» a fermare l\'inflazione, ma il mercato dei titoli di Stato non gli crede e spinge i rendimenti a lungo termine ai massimi dal 2007.', perche:'Se il costo del denaro sale invece di scendere, mutui, prestiti e rate diventano più cari per mesi: la promessa di un anno di tagli si sta rovesciando sotto gli occhi di chi deve pagare.', spunto:'Per la prima volta da anni il mercato scommette contro la banca centrale e prevede un rialzo: quando gli investitori smettono di credere alla Fed, il problema non è più solo l\'inflazione, è la fiducia.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'Euronews / TipRanks', time:'13:10', title:'Meta punita in Borsa: spende come Microsoft, ma i conti dicono il contrario', sintesi:'Stessa giornata, verdetto opposto. Meta ha visto il titolo perdere circa il 9% dopo conti deludenti: utile in calo del 14% e, soprattutto, l\'annuncio che nel 2026 investirà fino a 130-145 miliardi di dollari, ancora di più del previsto. I ricavi crescono (+28%), ma i costi dell\'AI stanno divorando i margini.', perche:'Quando un colosso spende cifre enormi senza mostrare ancora i frutti, il mercato lo castiga: è la prova che oggi non basta più promettere AI, bisogna dimostrare che rende.', spunto:'Microsoft e Meta spendono entrambe miliardi nell\'AI, ma una viene premiata e l\'altra punita: il mercato non paga più la spesa, paga solo chi la trasforma in profitti veri.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg / Fortune', time:'12:15', title:'Nuovi raid Usa sull\'Iran: il petrolio vola oltre i 92 dollari', sintesi:'La crisi nel Golfo si aggrava: gli Stati Uniti hanno lanciato una nuova ondata di raid aerei contro l\'Iran, in risposta agli attacchi alle proprie forze in Medio Oriente. Il Brent, il petrolio di riferimento europeo, è salito oltre i 92 dollari al barile, più di 3 dollari in un solo giorno e circa 19 in più rispetto a un anno fa. Cresce il timore per i rifornimenti mondiali.', perche:'Ogni rincaro del greggio finisce dritto su benzina e bollette e rialimenta l\'inflazione proprio mentre la Fed la vuole spegnere: la guerra lontana arriva al distributore sotto casa.', spunto:'Finché a decidere il prezzo dell\'energia sono i raid e non il mercato, ogni piano contro l\'inflazione è alla mercé della prossima notte di bombe nel Golfo.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'The Block / Cryptonews', time:'10:40', title:'Le crypto entrano in banca: le stablecoin regolate riscrivono le regole del gioco', sintesi:'Con la nuova legge americana sulle stablecoin (le monete digitali agganciate al dollaro), banche e istituzioni possono ora emetterle e custodirle sotto regole chiare. Il denaro sta ruotando verso Ethereum, visto come il "binario" su cui questi dollari digitali viaggeranno, e i suoi fondi ETF hanno raccolto quest\'anno quasi 10 miliardi. Il Bitcoin resta intorno ai 64 mila dollari.', perche:'Le monete digitali stanno smettendo di essere il Far West e diventano un pezzo del sistema bancario: cambia il modo in cui, tra pochi anni, faremo pagamenti e risparmio.', spunto:'La crypto nata per fare a meno delle banche finisce regolata, custodita e benedetta proprio dalle banche: la rivoluzione non è stata vinta, è stata assorbita.', tags:['X','Threads']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Trading Economics', time:'11:50', title:'Oro e petrolio salgono insieme: torna lo spettro della stagflazione', sintesi:'L\'oro è risalito verso i 4.100 dollari l\'oncia, recuperando dal minimo di metà luglio, mentre nello stesso momento il petrolio schizza sopra i 92 dollari. Prezzi dell\'energia in aumento e corsa al bene rifugio sono due facce della stessa paura: un\'economia che rallenta con l\'inflazione che non scende.', perche:'Quando salgono insieme il costo dell\'energia e il metallo della paura, il rischio ha un nome antico e temuto, la stagflazione: prezzi su e crescita giù, lo scenario peggiore per stipendi e risparmi.', spunto:'Oro e petrolio che corrono nello stesso giorno non sono due notizie separate: sono il mercato che scommette sulla stagflazione, l\'incubo che la Fed non sa come combattere.', tags:['LinkedIn','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
