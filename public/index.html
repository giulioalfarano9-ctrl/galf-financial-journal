<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Mar 13 ott 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Geopolitica', rel:'Alta', source:'Fortune / Yahoo Finance', time:'06:45', title:'Petrolio a 108 dollari: in un anno costa il 70% in più', sintesi:'Il Brent, il riferimento mondiale del greggio, vale 108 dollari al barile contro i 63 di un anno fa. Nel weekend i ribelli Houthi hanno colpito l’aeroporto di Riyadh (almeno 12 morti, secondo le prime ricostruzioni) e due petroliere sono state attaccate, una a Hormuz. La guerra con l’Iran dura dal 28 febbraio.', perche:'Il petrolio finisce nel pieno di benzina, trasporti e spesa: lo paghi anche se non guidi.', spunto:'Otto mesi di guerra e petrolio +70%: chiamarlo ancora "shock passeggero" è una bugia comoda.', tags:['X','Video']},
    {cat:'Macro', rel:'Alta', source:'Schwab', time:'09:15', title:'Mercoledì l’inflazione: i mercati la aspettano al varco', sintesi:'I prezzi di settembre escono domani: gli analisti si aspettano +0,6% in un mese, un ritmo altissimo. I titoli di Stato USA a 10 anni rendono il 5,24% e la Fed ha appena alzato i tassi per la prima volta in tre anni.', perche:'Questi tassi decidono quanto pagherai mutuo e prestiti nei prossimi mesi.', spunto:'Se l’inflazione sorprende ancora, la Fed non può più fingere: o frena i prezzi o salva la Borsa, non entrambi.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'TheStreet / Schwab', time:'07:00', title:'Utili a +30% per la Borsa, ma le banche crescono del 3%', sintesi:'Ieri il Dow ha chiuso a 51.850 (+0,38%), mentre S&P 500 e Nasdaq sono scesi, con la tecnologia a -1,25%. Oggi tocca a JPMorgan, Goldman Sachs, Citi e Wells Fargo: gli utili delle banche sono attesi a +3%, contro il +29,6% dell’indice S&P 500.', perche:'Le banche misurano la salute vera dell’economia: se frenano, prestiti e mutui ne risentono.', spunto:'Una Borsa che vola mentre le banche arrancano: o sbagliano le banche o sbaglia il mercato.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Yahoo Finance', time:'07:40', title:'Bitcoin a 83.000 dollari: un quarto in meno rispetto a un anno fa', sintesi:'Bitcoin vale circa 83.000 dollari, -24,5% in un anno e lontano dal record di 126.198 dollari di ottobre 2025. Ether (la seconda crypto) è a 2.534 dollari, -32%. Con i titoli di Stato USA oltre il 5%, rendere di più senza rischio toglie fascino alle crypto.', perche:'Se lo Stato ti paga il 5% senza rischi, chi ti spinge a rischiare il 24% di perdita?', spunto:'Bitcoin voleva essere la fuga dal sistema: oggi dipende dal prezzo del debito di Stato.', tags:['X','Video']},
    {cat:'Commodities', rel:'Media', source:'Yahoo Finance', time:'08:30', title:'L’oro non vola nemmeno con la guerra: il rifugio è stanco', sintesi:'L’oro vale circa 4.200 dollari l’oncia, il 3,2% in meno di un mese fa, nonostante il Brent sopra 105 dollari e la tensione in Medio Oriente. Pesano i rendimenti alti: chi tiene oro non incassa interessi.', perche:'Se nemmeno la guerra spinge l’oro, vuol dire che il mercato teme più i tassi che le bombe.', spunto:'Il bene rifugio per eccellenza non rifugia più nessuno: con i tassi al 5%, l’oro è un lusso.', tags:['X','Threads']},
    {cat:'Macro', rel:'Media', source:'Schwab (dati Bank of America / EPFR)', time:'09:15', title:'166 miliardi nei conti sicuri: la settimana più "paurosa" dal 2020', sintesi:'Nella settimana al 7 ottobre i fondi monetari, il parcheggio più prudente dei risparmi, hanno raccolto 166,4 miliardi di dollari: il massimo da aprile 2020. Le azioni ne hanno incassati solo 12,4.', perche:'Quando il denaro si nasconde, gli investitori ti stanno dicendo cosa pensano davvero del futuro.', spunto:'La Borsa sorride, ma i soldi veri scappano in cassa: guarda cosa fanno, non cosa dicono.', tags:['LinkedIn','Threads']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'Reuters / U.S. News / InvestingLive', time:'14:00', title:'La Fed alza i tassi, ma i dati dicono "frena": stasera il verbale svela chi litiga', sintesi:'A settembre la banca centrale americana ha alzato i tassi dello 0,25% e ha promesso un altro rialzo nel 2026. Poi sono usciti dati più deboli su lavoro e inflazione: ora i mercati danno meno di una probabilità su quattro a un nuovo rialzo a ottobre. Alle 20:00 italiane escono i verbali della riunione.', perche:'Se la Fed stringe mentre l’economia rallenta, mutui e prestiti restano cari proprio quando servirebbe respiro.', spunto:'La Fed guida guardando lo specchietto retrovisore: ha promesso un rialzo prima di vedere che l’economia già frenava.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'TheStreet / Schwab', time:'13:30', title:'Lo Stato americano paga il 5,3% per farsi prestare soldi, e i compratori si stancano', sintesi:'Il rendimento dei titoli di Stato USA a 10 anni è al 5,31%, quello a 30 anni al 5,68%. Martedì l’asta da 58 miliardi di titoli a 3 anni arrivava dopo un risultato deludente il mese scorso: gli stranieri comprano sempre meno debito americano.', perche:'Quel tasso è il metro di mutui e prestiti: se lo Stato paga di più, tutti gli altri pagano di più.', spunto:'Il debito americano sta diventando il prodotto che nessuno vuole a prezzo pieno, e il conto arriva a famiglie e imprese.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Alta', source:'TheStreet / Schwab', time:'13:00', title:'Record a Wall Street, ma i debiti delle aziende iniziano a scricchiolare', sintesi:'S&P 500 e Nasdaq hanno chiuso martedì a nuovi massimi, ora i future (contratti sull’andamento atteso) sono in calo. Intanto i "credit spread", cioè il premio extra che le aziende pagano per indebitarsi, erano saliti per otto giorni di fila fino a giovedì scorso. Gli utili del terzo trimestre dovrebbero crescere di circa il 30%.', perche:'Se chi presta soldi alle aziende chiede di più, il segnale è che i professionisti non sono tranquilli quanto la Borsa.', spunto:'Quando la Borsa festeggia e chi presta i soldi alza il prezzo, qualcuno dei due si sbaglia.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'The Crypto Times', time:'12:30', title:'Bitcoin a 84.000 dollari: 547 milioni di scommesse al rialzo spazzate via', sintesi:'Bitcoin scende a circa 84.164 dollari e non riesce a superare quota 87.000, il tetto di ogni rialzo da fine settembre. In 24 ore sono stati liquidati 547 milioni di dollari di posizioni, l’88% di chi scommetteva sul rialzo. Il 5 ottobre gli ETF su Bitcoin hanno perso 89,9 milioni.', perche:'Chi ha comprato a debito è stato costretto a vendere: così un piccolo calo diventa una caduta.', spunto:'Bitcoin non cade per cattive notizie: cade perché troppi hanno scommesso con soldi che non avevano.', tags:['X','Video']},
    {cat:'Geopolitica', rel:'Media', source:'TheStreet', time:'12:00', title:'Brent a 102 dollari: gli Houthi colpiscono la sicurezza saudita, e la benzina lo sa', sintesi:'Il petrolio Brent sale dell’1,4% a circa 102 dollari al barile, il Texas (WTI) dello 0,8% a 90,12. Spingono gli attacchi dei ribelli Houthi agli aeroporti sauditi, le tensioni tra Stati Uniti e Iran e un uragano in formazione nel Golfo del Messico.', perche:'Il prezzo del petrolio finisce nel carrello della spesa e nella bolletta, senza che tu debba fare nulla.', spunto:'Con il petrolio a 100 dollari non c’è più una crisi da risolvere: c’è un conto da pagare, ogni mese.', tags:['X','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
