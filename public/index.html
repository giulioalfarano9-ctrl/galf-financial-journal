<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Ven 7 ago 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg / Reuters', time:'05:55', title:'Salta l\'ottimismo su Hormuz: il petrolio risale del 5% e le Borse si fermano', sintesi:'Le tensioni in Medio Oriente sono tornate a salire e l\'accordo per riaprire lo Stretto di Hormuz resta senza conferme: il Brent è schizzato a 83,34 dollari al barile, quasi il 5% in una sola seduta. Azioni e obbligazioni sono scese insieme, con il timore che l\'energia più cara costringa la banca centrale americana ad alzare i tassi.', perche:'Il conto del petrolio arriva sempre due volte: prima alla pompa, poi sulla rata del mutuo.', spunto:'Il mercato ha festeggiato per due giorni un accordo che nessuno ha mai firmato: sono bastate ventiquattro ore di silenzio per riportare il petrolio a 83 dollari.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNBC / Bureau of Labor Statistics', time:'05:45', title:'Oggi i dati sul lavoro americano: attesi 83mila posti, e nessuno si fida del numero', sintesi:'Gli economisti si aspettano circa 83.000 nuovi posti di lavoro a luglio, con la disoccupazione ferma al 4,2%. A giugno ne erano arrivati appena 57.000, la metà delle previsioni, e nella prima metà del 2026 la media è scesa a 92.000 al mese.', perche:'Se anche oggi il numero delude, il lavoro americano non sta rallentando: si sta spegnendo lentamente.', spunto:'Novantaduemila posti al mese non sono un\'economia che cresce, sono un\'economia che tira avanti: e tra poche ore qualcuno la chiamerà ancora solidità.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Trading Economics / Federal Reserve', time:'05:35', title:'Il trentennale americano sfonda il 5,25%: nessuno crede più ai tassi fermi', sintesi:'Il rendimento del titolo di Stato americano a trent\'anni è salito al 5,25%, mentre quello a due anni resta al 4,26%. A fine luglio la banca centrale ha lasciato il costo del denaro fermo tra il 3,50% e il 3,75%, ma tre membri hanno votato per alzarlo subito.', perche:'Quel 5,25% è il prezzo vero del denaro a lungo termine, e da lì passano i mutui a tasso fisso di chi compra casa adesso.', spunto:'La banca centrale dice che i tassi così vanno bene, chi presta i soldi risponde chiedendo il 5,25%: quando i due numeri litigano, ha quasi sempre ragione il secondo.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'TheStreet / Qz', time:'05:25', title:'SanDisk quasi triplica i ricavi e il mercato la punisce lo stesso', sintesi:'SanDisk ha chiuso l\'anno con 20,25 miliardi di dollari di ricavi, +175%, trainata dalla domanda dei centri dati per l\'intelligenza artificiale. Ma le previsioni sul trimestre in corso, tra 10,3 e 10,8 miliardi contro gli 11,16 attesi, hanno fatto crollare il titolo. L\'S&P 500 ha perso lo 0,3% a 7.704,57, seconda seduta in rosso.', perche:'Quando conti da record non bastano più, vuol dire che il prezzo delle azioni dava già per scontato un futuro perfetto.', spunto:'Ricavi quasi triplicati e titolo giù: sull\'intelligenza artificiale il mercato non premia più chi cresce, punisce chi cresce meno del previsto.', tags:['LinkedIn','Threads']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Bloomberg', time:'05:15', title:'L\'oro torna sui massimi da giugno mentre l\'OPEC apre i rubinetti', sintesi:'L\'oro è salito di circa l\'1% a 4.285 dollari l\'oncia, il livello più alto dal 18 giugno, spinto dalla paura per il Medio Oriente. Nello stesso momento l\'OPEC+ ha deciso di aumentare la produzione di 188.000 barili al giorno da settembre.', perche:'Chi compra oro non scommette sulla crescita: scommette che qualcosa vada storto, ed è la scommessa che sta pagando di più da un anno.', spunto:'Più petrolio in arrivo e oro sui massimi nello stesso giorno: a parole il mercato dice che la crisi finisce, con i soldi si prepara al contrario.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Fortune / Bitcoin.com News', time:'05:05', title:'Bitcoin resta a 64.800 grazie ai grandi fondi, ma sotto crolla tutto il resto', sintesi:'Bitcoin ha sfiorato i 65.000 dollari, sostenuto da 211 milioni entrati in un solo giorno nei fondi quotati americani, oltre 170 dal solo BlackRock. Ma la finanza senza banche è arretrata del 38,7%, le monete agganciate al dollaro hanno perso il 5% e dai fondi su Ethereum sono usciti 12,3 milioni.', perche:'Il prezzo che vedi in vetrina lo tengono su le grandi istituzioni, mentre il mondo cripto che doveva farne a meno si sta svuotando.', spunto:'Bitcoin regge solo perché lo comprano i giganti di Wall Street: la rivoluzione contro le banche oggi sopravvive grazie alle banche.', tags:['X','Threads']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'Challenger, Gray & Christmas / Reuters', time:'13:30', title:'Licenziamenti ai minimi da due anni, ma a tagliare è sempre l\'intelligenza artificiale', sintesi:'A luglio le aziende americane hanno annunciato 33.429 tagli di posti di lavoro, il numero più basso degli ultimi due anni: il 27% in meno rispetto a giugno e il 46% in meno rispetto a un anno fa. Il primo motivo dichiarato resta però l\'intelligenza artificiale, con 10.970 posti eliminati: quinto mese consecutivo in testa alla classifica.', perche:'I licenziamenti di massa si stanno fermando, ma quelli che restano colpiscono sempre le stesse scrivanie: quelle che una macchina può occupare.', spunto:'Meno licenziamenti non vuol dire più sicurezza: vuol dire che il taglio è diventato chirurgico e sceglie chi sostituire, e a scegliere ormai è un software.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Trading Economics / Bloomberg', time:'12:40', title:'Il titolo americano a trent\'anni tocca il 5,20%: chi presta i soldi non si fida più', sintesi:'Il rendimento del titolo di Stato americano a trent\'anni è salito al 5,20% e quello a dieci anni resta al 4,63%, nonostante il petrolio in forte calo. Da quando a fine luglio la banca centrale ha lasciato i tassi fermi senza chiarire le proprie intenzioni, chi presta denaro a lungo termine pretende di più.', perche:'I mutui a tasso fisso seguono quei rendimenti: se il trentennale sale, sale anche la rata di chi compra casa oggi.', spunto:'La banca centrale può tenere fermi i tassi quanto vuole, ma il prezzo del denaro a lungo termine lo decide chi i soldi li presta davvero: e sta chiedendo il 5,20%.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Alta', source:'Fortune / Trading Economics', time:'13:10', title:'L\'oro corre a 4.278 dollari mentre il petrolio crolla: qualcuno non compra la pace', sintesi:'L\'oro è salito a 4.278 dollari l\'oncia, +0,72% in giornata, +4,2% in un mese e +26% in un anno, proprio mentre il greggio perde l\'11% in tre sedute sull\'attesa riapertura dello Stretto di Hormuz. JP Morgan si spinge a vedere il metallo a 6.300 dollari entro fine anno.', perche:'Quando il petrolio scende per ottimismo e l\'oro sale per paura, uno dei due mercati si sta sbagliando di grosso.', spunto:'Le Borse festeggiano un accordo di pace e nello stesso momento comprano oro come se dovesse saltare tutto: i soldi dicono una cosa, i titoli dei giornali ne dicono un\'altra.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'CNBC / Bloomberg', time:'11:30', title:'Amazon tocca i 3.000 miliardi e Bezos vende: il record è durato un giorno', sintesi:'Lunedì Amazon ha superato per la prima volta i 3.000 miliardi di dollari di valore, chiudendo a 284,02 dollari con un rialzo del 4,58%. Lo stesso giorno Jeff Bezos ha depositato l\'intenzione di vendere 15 milioni di azioni, circa 4 miliardi di dollari. Il titolo ha perso oltre il 2% il giorno dopo e il record è già svanito.', perche:'Il piano di vendita era programmato dal novembre scorso, ma ai risparmiatori arriva un messaggio diverso: il fondatore incassa esattamente sul massimo.', spunto:'Quattro miliardi venduti nel giorno del record: si può chiamarlo piano automatico quanto si vuole, il mercato ha letto solo che il fondatore esce mentre tutti gli altri entrano.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'CNBC / Eli Lilly', time:'10:20', title:'Eli Lilly alza le stime con i farmaci per dimagrire, ma l\'utile delude', sintesi:'Eli Lilly ha chiuso il trimestre con ricavi sopra le attese, spinti dai farmaci dimagranti Zepbound e Mounjaro, e ha alzato le previsioni per l\'anno a 85-87 miliardi di dollari di ricavi. L\'utile per azione si è però fermato a 8,38 dollari contro gli 8,84 attesi, il 5,2% in meno.', perche:'È l\'azienda che ha trasformato il peso corporeo in una voce di bilancio: il suo trimestre racconta quanto vale, in dollari, la fretta del mondo di dimagrire.', spunto:'Vende più del previsto e guadagna meno del previsto: perfino il farmaco più desiderato del pianeta sta scoprendo quanto costa produrlo per tutti.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'TRM Labs / Cointelegraph', time:'09:50', title:'Un errore del 2021 svuota i portafogli: rubati 116 milioni di dollari in bitcoin', sintesi:'Un difetto nel programma dei portafogli fisici Coldcard, presente dal marzo 2021, ha reso indovinabili le chiavi segrete di migliaia di utenti. Dal 30 luglio i ladri hanno prelevato circa 1.816 bitcoin, quasi 116 milioni di dollari, da oltre 5.200 conti: nella prima ondata 1.196 portafogli svuotati in quarantuno minuti. La correzione è uscita, ma non ripara le chiavi già create.', perche:'Chi teneva i bitcoin fuori dalle banche per non fidarsi di nessuno ha scoperto di essersi fidato di una riga di codice scritta cinque anni fa.', spunto:'Migliaia di persone hanno creduto per cinque anni di custodire da sole i propri soldi: è bastato un errore di programmazione per farli sparire in quarantuno minuti.', tags:['X','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
