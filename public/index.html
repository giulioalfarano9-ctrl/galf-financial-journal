<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Dom 9 ago 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'Reuters / Yahoo Finance', time:'22:00', title:'Musk sceglie Nvidia per SpaceX e il titolo firma la settimana migliore dell\'anno', sintesi:'Nvidia ha chiuso la settimana con un rialzo superiore al 10%, il maggiore guadagno di valore in Borsa da oltre un anno, dopo che Elon Musk ha detto che sarà il fornitore "esclusivo" per l\'intelligenza artificiale di SpaceX. L\'indice dei produttori di chip di Filadelfia ha guadagnato oltre l\'8% in cinque sedute.', perche:'Una frase di un imprenditore ha spostato più valore di quanto facciano interi bilanci trimestrali.', spunto:'Un annuncio di Musk vale il 10% di Nvidia: questo non è un mercato che valuta le aziende, è un mercato che valuta le dichiarazioni.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'FINRA / Charles Schwab (Liz Ann Sonders)', time:'18:00', title:'Gli americani comprano azioni a debito come mai prima: 1.530 miliardi in prestito', sintesi:'I soldi presi in prestito dagli investitori americani per comprare azioni hanno toccato il record di 1.530 miliardi di dollari, +51,5% in un anno, mentre la liquidità nei conti è scesa sotto zero di 991 miliardi. Liz Ann Sonders di Schwab avverte che questa leva alza i rischi nel tempo.', perche:'Comprare a debito moltiplica i guadagni finché sale, e moltiplica i disastri il giorno in cui scende.', spunto:'Picchi di debito come questo si sono visti nel 2000, nel 2007 e nel 2021: tre volte su tre non era l\'inizio della festa, era la fine.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'Yahoo Finance / stime di settore', time:'15:20', title:'886 miliardi in un anno: i giganti del cloud stanno costruendo l\'AI a qualunque costo', sintesi:'Le stime di settore indicano oltre 886 miliardi di dollari di investimenti nel 2026 da parte dei nove maggiori fornitori di servizi cloud, con le consegne di server per l\'intelligenza artificiale attese in crescita di quasi il 31%.', perche:'Quei miliardi non sono ricerca: sono capannoni, schede e corrente elettrica che qualcuno dovrà ripagare con ricavi veri.', spunto:'Spendere 886 miliardi prima di sapere chi pagherà il conto non è visione: è la stessa scommessa con cui finì l\'era delle dot-com.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Media', source:'BCE — Bollettino economico n. 5/2026', time:'11:00', title:'L\'Europa tiene il denaro caro mentre l\'America perde posti di lavoro', sintesi:'Nel bollettino pubblicato il 6 agosto la Banca centrale europea conferma i tassi fermi dopo il rialzo di 0,25 punti di giugno: l\'inflazione è scesa al 2,8% dal 3,2%, ma l\'energia corre ancora all\'8,5% per effetto del conflitto in Medio Oriente.', perche:'Le due sponde dell\'Atlantico stanno andando in direzioni opposte, e chi ha un mutuo in euro se ne accorgerà per primo.', spunto:'Francoforte combatte il caro-energia rendendo più caro anche il denaro: è come curare la febbre spegnendo il termometro.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph', time:'16:40', title:'Un giudice americano congela il bottino nordcoreano: 1,5 miliardi rubati a Bybit', sintesi:'Un tribunale federale statunitense ha concesso all\'exchange Bybit un provvedimento d\'urgenza che blocca i fondi collegati al gruppo di hacker nordcoreano Lazarus, responsabile del furto da 1,5 miliardi di dollari in valute digitali subito nel febbraio 2025.', perche:'La cripto nasce sull\'idea che nessuno possa bloccarti i soldi: qui un giudice lo ha fatto, e stavolta stava dalla parte giusta.', spunto:'Sono serviti un anno e mezzo e un tribunale americano per recuperare quello che una blockchain "immutabile" ha regalato alla Corea del Nord in pochi minuti.', tags:['X','Threads']},
    {cat:'Commodities', rel:'Media', source:'Fortune / Reuters', time:'11:15', title:'L\'oro vale 909 dollari in più di un anno fa: il record che nessuno festeggia', sintesi:'Il 7 agosto l\'oro quotava 4.305 dollari l\'oncia, 909 dollari in più rispetto a dodici mesi prima: quasi il 27% in un anno, con il metallo di nuovo a ridosso dei massimi storici dopo il dato debole sull\'occupazione americana.', perche:'L\'oro non produce nulla e non paga interessi: se sale così, è perché la gente si fida sempre meno di tutto il resto.', spunto:'Il 27% in un anno guadagnato da un metallo che non rende niente è il giudizio più duro mai scritto sul valore delle monete che usiamo ogni giorno.', tags:['LinkedIn','Threads']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'Bloomberg / CNBC', time:'09:15', title:'easyJet passa ai fondi: Apollo se la prende per 5,7 miliardi di sterline', sintesi:'Apollo ha chiuso l\'accordo per comprare easyJet a 7,15 sterline per azione, circa 5,7 miliardi di sterline (7,7 miliardi di dollari), l\'81% in più rispetto al prezzo di fine maggio. Il rivale Castlelake si è ritirato dalla gara. La famiglia del fondatore Stelios Haji-Ioannou e altri soci resteranno dentro con una quota tra il 45,1% e il 49,9%.', perche:'Una delle compagnie che ha reso il volo economico in Europa finisce nelle mani di chi compra aziende per rivenderle a un prezzo più alto.', spunto:'Un fondo paga l\'81% in più del prezzo di Borsa per una compagnia low cost: o la Borsa la valutava male, o i biglietti a poco prezzo dureranno meno di quanto crediamo.', tags:['LinkedIn','Threads']},
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg / Al Jazeera', time:'08:40', title:'Hormuz, l\'Iran detta le condizioni: navi americane e israeliane fuori, e il petrolio risale', sintesi:'La bozza di intesa tra Iran e Oman, ora all\'esame del parlamento iraniano, vieterebbe il passaggio alle navi americane e israeliane e imporrebbe multe pari al 20% del valore del carico a chi viola le regole. Lo Stretto riaprirebbe del tutto solo dopo la fine del blocco navale americano. Dopo le esplosioni segnalate vicino all\'isola di Qeshm, il Brent è tornato sopra gli 83 dollari.', perche:'Da quel braccio di mare passa una fetta enorme del petrolio mondiale: le condizioni scritte lì finiscono nel prezzo della benzina qui.', spunto:'Non è una riapertura, è un pedaggio: l\'Iran sta trasformando una via di mare in un casello dove decide lui chi passa e quanto paga.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Bloomberg / Bureau of Labor Statistics', time:'13:45', title:'Tra poco i dati sul lavoro americano, e le attese sono già state tagliate', sintesi:'Il numero di posti di lavoro creati a luglio negli Stati Uniti arriva alle 14:30 italiane: gli economisti interpellati da Bloomberg si aspettano 80.000 assunzioni, meno delle 83.000 stimate pochi giorni fa, con la disoccupazione ferma al 4,2%. A fine luglio la banca centrale ha lasciato il costo del denaro tra il 3,50% e il 3,75%, con tre membri su dodici che volevano alzarlo subito.', perche:'Se le assunzioni deludono ancora, la banca centrale dovrà scegliere tra difendere il lavoro e difendere il potere d\'acquisto.', spunto:'Abbassare le attese il giorno prima è il trucco più vecchio del mercato: così anche un dato mediocre potrà essere raccontato come una bella sorpresa.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'Under Armour / StockTitan', time:'12:30', title:'Under Armour vende meno e guadagna di più: il merito è dei rimborsi sui dazi', sintesi:'Nel trimestre chiuso a giugno i ricavi sono scesi del 3% a 1,10 miliardi di dollari, con il Nord America giù del 9%. Il margine è però salito di 5,9 punti al 54,1%, soprattutto grazie ai rimborsi dei dazi pagati l\'anno scorso. L\'utile per azione si è fermato a zero e per l\'anno l\'azienda prevede ora un calo dei ricavi vicino al 5%.', perche:'I conti tornano solo grazie a soldi restituiti dallo Stato: sul prodotto, l\'azienda continua a perdere clienti.', spunto:'Guadagnare di più vendendo di meno grazie a un rimborso non è un rilancio, è una pausa: finiti i rimborsi restano solo i clienti che se ne vanno.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Reuters / FXLeaders', time:'11:40', title:'L\'oro chiude la settimana migliore da gennaio mentre tutti guardano altrove', sintesi:'L\'oro viaggia intorno ai 4.254 dollari l\'oncia e si avvia a chiudere la settimana con un guadagno vicino al 5%, il migliore da gennaio. I contratti a termine salgono di quasi il 2% in giornata, sopra i 4.380 dollari.', perche:'Ogni volta che l\'oro corre così, qualcuno con molti soldi sta comprando un\'assicurazione contro tutto il resto.', spunto:'Le Borse restano vicine ai massimi e l\'oro fa la settimana migliore dell\'anno: sono due racconti opposti dello stesso momento, e uno dei due è falso.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Cointelegraph', time:'10:30', title:'Tether sbarca in Arabia Saudita e mette i palazzi dentro la blockchain', sintesi:'Tether, la società della moneta digitale agganciata al dollaro, porta in Arabia Saudita la sua piattaforma Hadron insieme a First Data e alla fintech BKN301: l\'obiettivo è trasformare grandi immobili in quote digitali che si comprano e si vendono come azioni. Dopo il mattone toccherà a energia e infrastrutture.', perche:'È il tentativo di rendere vendibile in un istante ciò che per natura non lo è: un palazzo, diviso in pezzi digitali.', spunto:'Spezzettare un palazzo in token non lo rende più solido: rende solo più rapida la fuga il giorno in cui tutti decidono di vendere.', tags:['X','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
