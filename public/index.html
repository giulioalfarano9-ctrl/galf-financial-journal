<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Sab 25 lug 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Azionario', rel:'Alta', source:'Bloomberg Markets', time:'06:00', title:'La grande tech brucia 800 miliardi in un giorno: l\'AI non basta più', sintesi:'I sette giganti della tecnologia (i cosiddetti "Magnifici 7") hanno perso quasi 800 miliardi di dollari in una sola seduta, il crollo peggiore da aprile 2025. A far scattare le vendite Alphabet e Tesla: hanno alzato la spesa per l\'intelligenza artificiale (Alphabet fino a 205 miliardi quest\'anno) ma stanno bruciando cassa e non dicono quando arriveranno i profitti.', perche:'Chi ha risparmi o fondi pensione legati alla Borsa americana ha appena visto quanto pesa una scommessa sull\'AI di cui il mercato ha smesso di fidarsi.', spunto:'Spendono centinaia di miliardi in AI senza sapere quando renderanno: il mercato ha smesso di applaudire e ha iniziato a chiedere il conto.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Reuters / CME FedWatch', time:'05:40', title:'La Fed decide mercoledì e per la prima volta si teme un rialzo', sintesi:'Mercoledì la Banca centrale americana annuncia i tassi e, per la prima volta in mesi, si parla di aumento anziché di taglio. Il governatore Waller ha spostato l\'attenzione dall\'occupazione all\'inflazione, rivista al 3,6% per il 2026, e i mercati danno ormai un 25% di probabilità a un rialzo. La maggioranza scommette comunque sul nulla di fatto.', perche:'Se la Fed alza invece di tagliare, mutui e prestiti restano cari più a lungo: chi aspettava un po\' di sollievo dovrà pazientare.', spunto:'Sei mesi fa tutti sognavano i tagli, ora si trema per un rialzo: la Borsa festeggia sempre troppo presto e paga sempre in ritardo.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Reuters Business', time:'05:15', title:'Petrolio sotto 100 dollari, ma il Golfo resta una polveriera', sintesi:'Il Brent è sceso sotto i 100 dollari, verso quota 88, dopo settimane di corsa. La tensione però resta altissima: gli Houthi hanno colpito due petroliere saudite e gli Stati Uniti hanno bombardato l\'Iran per la dodicesima notte di fila. Ogni tregua sul prezzo può saltare nel giro di poche ore.', perche:'Finché il Golfo brucia, benzina e bollette restano ostaggio di una guerra che decidono altri al posto nostro.', spunto:'Il petrolio scende di prezzo ma non di rischio: basta un missile nel Golfo per rimandarci tutti col fiato sospeso alla pompa.', tags:['X','LinkedIn']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Fortune', time:'05:00', title:'Bitcoin regge a 65.000 mentre Wall Street affonda', sintesi:'Mentre la tech americana bruciava 800 miliardi, Bitcoin ha tenuto vicino ai 65.000 dollari, in calo di meno dell\'1% e in rialzo del 3% sulla settimana. Per alcuni è la prova di un possibile sganciamento dalle Borse, anche se l\'indice di paura degli investitori è sceso a 28, in piena zona di cautela.', perche:'Chi ha comprato crypto per diversificare osserva un piccolo test: per una volta non è scesa insieme a tutto il resto.', spunto:'Bitcoin tiene mentre la tech affonda: forse smette di essere l\'ombra di Wall Street, ma una rondine non fa primavera.', tags:['X','Threads']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Trading Economics', time:'05:25', title:'Guerra aperta e l\'oro non sale: sopra 4.050 ma senza scatto', sintesi:'Nonostante le bombe nel Golfo, l\'oro resta fermo sopra i 4.050 dollari l\'oncia, senza il balzo che ci si aspetterebbe in piena guerra. Il motivo è la Fed: se i tassi restano alti, tenere un metallo che non paga interessi conviene meno. E il ritiro del petrolio sotto 100 ha calmato i timori sull\'inflazione.', perche:'Chi compra oro convinto che sia sempre il rifugio perfetto scopre che oggi sul mercato comanda il rendimento, non la paura.', spunto:'Nemmeno le bombe muovono l\'oro: quando il bene rifugio resta fermo in piena guerra, vuol dire che comandano i tassi, non la paura.', tags:['LinkedIn','Threads']},
    {cat:'Macro', rel:'Media', source:'CNBC / Allianz (El-Erian)', time:'04:50', title:'El-Erian sfida i falchi: «Il peggio dell\'inflazione è alle spalle»', sintesi:'Mohamed El-Erian, consigliere capo di Allianz, va controcorrente: sostiene che il peggio dell\'inflazione è passato e che la Fed non dovrebbe stringere ancora. Ma lancia due allarmi: la corsa agli investimenti nell\'AI rischia di rivelarsi eccessiva entro tre o quattro anni, e senza rendimenti più alti sui titoli di Stato quella corsa non si finanzia.', perche:'Se ha ragione sull\'inflazione, chi teme mutui più cari può respirare; ma il suo allarme sull\'AI riguarda ogni portafoglio.', spunto:'Tutti guardano l\'inflazione di ieri, El-Erian indica la bolla di domani: l\'AI costa già troppo e il conto arriverà quando meno ce lo aspettiamo.', tags:['LinkedIn','X']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'Bloomberg Markets', time:'13:15', title:'Panico sui chip della memoria: SanDisk crolla dell\'11% in un giorno', sintesi:'Seduta da incubo per i produttori di chip di memoria: SanDisk ha perso l\'11%, Seagate il 7%, Micron il 4%. Gli investitori temono che Samsung e SK Hynix stiano fabbricando troppa memoria, facendone crollare i prezzi, proprio mentre cresce il sospetto che la corsa alla spesa per l\'intelligenza artificiale abbia toccato il picco e stia per rallentare.', perche:'Chi ha fondi tecnologici in portafoglio scopre che i titoli-simbolo dell\'AI possono bruciare un decimo del valore in poche ore, senza preavviso.', spunto:'I chip erano l\'oro della corsa all\'AI: ora che tutti scavano nello stesso punto il prezzo crolla, e restano solo le pale in mano agli ultimi arrivati.', tags:['X','LinkedIn']},
    {cat:'Macro', rel:'Alta', source:'Charles Schwab (Liz Ann Sonders)', time:'12:20', title:'Sonders avverte: «Metà della crescita degli utili viene da pochissimi titoli»', sintesi:'Liz Ann Sonders, capo strategist di Charles Schwab, lancia l\'allarme concentrazione: la tecnologia pesa per il 31% dell\'indice azionario mondiale ma dovrebbe produrre il 55% di tutta la crescita degli utili del 2026, quasi interamente da una manciata di aziende. E avverte che è finita l\'era della calma: davanti c\'è un periodo di inflazione ballerina e shock a ripetizione.', perche:'Se pochi titoli reggono da soli il mercato mondiale, basta che inciampino perché a pagare sia anche chi non li ha mai comprati.', spunto:'Un indice mondiale appeso a cinque aziende non è un mercato diversificato: è una scommessa travestita da prudenza.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Reuters Business', time:'11:50', title:'Houthi colpiscono due petroliere saudite, USA all\'attacco dell\'Iran per la dodicesima notte', sintesi:'La guerra nel Golfo si allarga: i ribelli Houthi, sostenuti dall\'Iran, hanno colpito due petroliere saudite nell\'ambito di un blocco navale, mentre gli Stati Uniti hanno bombardato l\'Iran per la dodicesima notte di fila. Il Brent ha superato i 100 dollari per poi ritirarsi, segno di un mercato appeso a ogni notizia dal fronte.', perche:'Ogni nave colpita nel Golfo è un pieno di benzina più caro per noi: la guerra decisa da altri arriva puntuale alla pompa sotto casa.', spunto:'Finché il petrolio passa da un mare pieno di missili, il prezzo alla pompa lo decidono i ribelli Houthi, non il libero mercato.', tags:['X','LinkedIn']},
    {cat:'Commodities', rel:'Media', source:'Reuters / Trading Economics', time:'11:20', title:'L\'oro non si muove nemmeno con la guerra, e la Cina cambia le regole', sintesi:'Nonostante bombe e tensioni, l\'oro resta fermo intorno ai 4.061 dollari l\'oncia: con i tassi alti, un metallo che non paga interessi attira meno. Intanto le grandi banche cinesi hanno smesso di vendere ai risparmiatori l\'oro "di carta" (contratti senza metallo reale), spingendo tutti verso il lingotto vero e agitando i prezzi.', perche:'Chi tiene oro come rifugio scopre che oggi sul mercato comanda il rendimento dei titoli di Stato, non la paura della guerra.', spunto:'Un bene rifugio immobile mentre il mondo brucia manda un messaggio chiaro: sui mercati oggi comanda il tasso, non il terrore.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'Cointelegraph / CoinMarketCap News', time:'11:00', title:'Bitcoin scivola sotto i 65 mila e gli investitori scappano dagli ETF', sintesi:'Bitcoin è sceso sotto i 65.000 dollari ed Ethereum sotto i 1.900, trascinati giù dai rendimenti dei titoli di Stato americani saliti troppo. Segnale pesante: i fondi ETF sul Bitcoin hanno visto uscire 225 milioni di dollari in un solo giorno, interrompendo una settimana di soli acquisti. L\'indice di paura degli investitori è crollato a 28.', perche:'Quando i soldi in banca rendono di più, anche chi crede nelle crypto preferisce il sicuro: il sogno dei guadagni facili si sgonfia in fretta.', spunto:'Bastano titoli di Stato un po\' più generosi per far scappare i soldi dal Bitcoin: la "rivoluzione" regge finché non c\'è un\'alternativa noiosa che rende.', tags:['X','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
