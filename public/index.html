<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Lun 7 set 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg / Al Jazeera', time:'06:00', title:'Gli Stati Uniti affondano le petroliere iraniane, Teheran chiude il mare', sintesi:'Nel fine settimana gli Stati Uniti hanno colpito tre petroliere iraniane, distruggendone una, come rappresaglia per gli attacchi missilistici contro navi da guerra americane. Teheran ha risposto colpendo navi legate agli Stati Uniti e annuncia una zona marittima «ristretta» oltre lo Stretto di Hormuz. Il Brent è salito verso i 97 dollari al barile, il livello più alto da luglio.', perche:'Ogni nave che smette di attraversare quel tratto di mare si trasforma, poche settimane dopo, in un rincaro alla pompa e in bolletta.', spunto:'Questa guerra non si combatte più solo con le bombe: si colpiscono le navi cisterna, cioè le arterie dell\'economia mondiale, e il conto arriva a noi al distributore.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNN Business / CNBC', time:'06:25', title:'Il lavoro americano corre il triplo del previsto e la Fed torna a stringere', sintesi:'Ad agosto gli Stati Uniti hanno creato 162.000 posti di lavoro contro i 53.000 attesi, il risultato migliore da marzo, con la disoccupazione ferma al 4,1%. I mercati danno ora il 58% di probabilità a un rialzo dei tassi nella riunione del 15-16 settembre. Donald Trump ha commentato chiedendo l\'esatto contrario: tassi più bassi.', perche:'Un\'economia che assume ancora così tanto dà alla Fed il permesso di rendere il denaro più caro, e quel costo arriva fino ai mutui europei.', spunto:'Il lavoro va forte e la risposta è alzare i tassi: ci siamo abituati all\'idea che una buona notizia per chi lavora sia una cattiva notizia per i mercati, e nessuno la trova più assurda.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'CNBC / Reuters', time:'06:45', title:'Giovedì la Bce alza i tassi e lo sanno già tutti', sintesi:'I mercati assegnano il 98,9% di probabilità a un aumento di un quarto di punto, al 2,5%, nella riunione del 10 settembre. L\'inflazione dell\'area euro è risalita al 3,3% ad agosto, massimo da due anni, spinta dall\'energia rincarata del 14,3% in un anno. Il dato di fondo, senza energia e alimentari, è invece sceso al 2,4%.', perche:'Vuol dire rate del mutuo e prestiti più cari in Italia entro poche settimane, per un\'inflazione che nasce dal petrolio e non dai nostri consumi.', spunto:'L\'inflazione europea la fa la guerra, non la spesa delle famiglie: alzare i tassi qui è come multare chi guida piano perché l\'autostrada è allagata.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'CNBC', time:'07:05', title:'Wall Street chiude la settimana in rosso e oggi tira giù la saracinesca', sintesi:'Venerdì i tre indici principali hanno perso terreno: Dow Jones -0,51% a 53.414, S&P 500 -0,38% a 7.718,60, Nasdaq -0,29% a 26.507. Oggi le Borse americane restano chiuse per la festa del lavoro.', perche:'Con New York ferma, petrolio e valute si muovono senza il contrappeso del mercato azionario: i movimenti di oggi pesano più del solito.', spunto:'I dati sull\'occupazione erano ottimi e la Borsa è scesa lo stesso: quando le buone notizie fanno perdere soldi, il problema non è l\'economia, è quanto sono già care le azioni.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Investing News', time:'07:25', title:'Il bitcoin torna sotto gli 80 mila dollari e si ferma davanti al muro', sintesi:'Dopo il balzo di giovedì fino a 82.200 dollari, il bitcoin è sceso a circa 79.900 nel fine settimana, frenato dal dato forte sul lavoro americano e dal ritorno delle scommesse su un rialzo dei tassi. Resta comunque oltre il 23% sopra i livelli di inizio agosto.', perche:'Chi tiene criptovalute sta di fatto scommettendo sulle mosse della Fed, che se ne accorga o no.', spunto:'Il bitcoin ha smesso di essere un\'alternativa al sistema: oggi è un termometro dei tassi americani, con più oscillazioni e meno regole.', tags:['X','LinkedIn']}
  ],
  afternoon: [
    {cat:'Azionario', rel:'Alta', source:'AP / Markets.com', time:'08:40', title:'Con Wall Street chiusa comanda l\'Asia: Seul vola del 4,6%, Tokyo sopra i 66 mila', sintesi:'Il Kospi coreano è balzato del 4,6% a 6.995 punti, il Nikkei giapponese del 2,1% a 66.399. SK Hynix ha guadagnato l\'8,1% e Samsung il 5,3%: a spingerli è l\'attesa che GPT-6 Astra, il nuovo modello di OpenAI uscito il 3 settembre, faccia esplodere la richiesta di memorie per computer.', perche:'Il pezzo più conteso dell\'intelligenza artificiale non è il software americano ma un componente fabbricato tra Seul e Tokyo, e chi lo produce detta le condizioni.', spunto:'Il giorno in cui Wall Street è chiusa scopriamo chi comanda davvero nell\'intelligenza artificiale: non chi scrive i modelli, ma chi fabbrica la memoria su cui girano.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Reuters / Bloomberg', time:'09:50', title:'Lo yen resta a quota 160 e Washington preme sulla banca centrale giapponese', sintesi:'Lo yen è tornato vicino a 160 per dollaro dopo essere risalito fino a 157 la settimana scorsa. I mercati assegnano il 73% di probabilità a un aumento dei tassi giapponesi il 18 settembre, con gli Stati Uniti che spingono pubblicamente in quella direzione. Secondo gli analisti un solo rialzo non basterà a rimettere in piedi la valuta.', perche:'Una valuta debole rende le auto e l\'elettronica giapponesi più a buon mercato delle nostre: è concorrenza a prezzi scontati per l\'industria europea.', spunto:'Un governo che dice a un\'altra banca centrale quando alzare i tassi non sta facendo diplomazia, sta facendo politica monetaria a casa d\'altri: l\'indipendenza vale finché non dà fastidio.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'Yahoo Finance / Coinmarketcap', time:'11:10', title:'L\'ethereum ruba la scena al bitcoin: quasi un miliardo di dollari in una settimana', sintesi:'I fondi americani sull\'ethereum hanno raccolto 986,9 milioni di dollari nell\'ultima settimana e 3,8 miliardi in tre settimane, il periodo migliore del 2026, con l\'ether sopra i 2.500 dollari. Nel complesso i fondi sulle criptovalute hanno incassato 1,37 miliardi, la settimana più ricca da gennaio. Anche XRP e Solana tornano positivi.', perche:'Chi investe in criptovalute ha smesso di comprare solo bitcoin: i soldi si stanno spostando, e chi è arrivato in ritardo lo scopre sempre per ultimo.', spunto:'Per anni ci hanno ripetuto che l\'unica criptovaluta seria era il bitcoin: adesso i soldi veri vanno altrove, e chi lo ripete ancora sta difendendo un portafoglio, non un\'idea.', tags:['X','LinkedIn']},
    {cat:'Commodities', rel:'Media', source:'CBS News / LiteFinance', time:'11:55', title:'C\'è una guerra sul petrolio e l\'oro vale il 22% meno di gennaio', sintesi:'Nonostante il conflitto in Medio Oriente, l\'oro è entrato in settembre intorno ai 4.370 dollari l\'oncia: circa il 22% sotto il record di 5.589 dollari toccato il 28 gennaio. Anche oggi resta chiuso in una fascia stretta di prezzo, senza riuscire a sfondare al rialzo.', perche:'Il rifugio per eccellenza non sale nemmeno in piena crisi: significa che i grandi investitori stanno mettendo i soldi da un\'altra parte.', spunto:'Se neanche una guerra sul petrolio fa salire l\'oro, il metallo che dovrebbe proteggerci dalle catastrofi ha semplicemente smesso di fare il suo mestiere.', tags:['X','Threads']},
    {cat:'Macro', rel:'Media', source:'CNBC', time:'12:30', title:'Il titolo di Stato americano a due anni paga come non faceva da inizio 2025', sintesi:'Dopo il dato sull\'occupazione di venerdì, il rendimento del titolo di Stato americano a due anni è salito al livello più alto da gennaio 2025. È la scadenza che segue più da vicino le mosse della banca centrale: il mercato sta scommettendo apertamente su un costo del denaro più alto.', perche:'Quando i titoli di Stato americani pagano tanto, i soldi lasciano azioni e obbligazioni europee per andare là: il conto lo paga chi investe qui.', spunto:'Il mercato ha già alzato i tassi da solo, settimane prima della riunione: la Federal Reserve non guida più niente, si limita a firmare quello che i titoli di Stato hanno già deciso.', tags:['LinkedIn','X']},
    {cat:'Azionario', rel:'Media', source:'CNBC / Reuters', time:'13:05', title:'L\'Asia corre sull\'intelligenza artificiale e l\'Europa resta ferma a guardare', sintesi:'Mentre Tokyo e Seul volavano sui chip, le Borse europee hanno passato la mattinata in leggero calo: lo Stoxx 600 giù di quasi lo 0,1%, il Dax tedesco dello 0,14%, il Ftse britannico dello 0,12%.', perche:'La corsa più redditizia degli ultimi due anni sta passando accanto all\'Europa, e i risparmi investiti qui la stanno guardando dalla finestra.', spunto:'L\'Europa non sta perdendo la corsa all\'intelligenza artificiale: non l\'ha proprio iniziata, e continuiamo a chiamarlo prudenza invece che ritardo.', tags:['LinkedIn','Threads']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
