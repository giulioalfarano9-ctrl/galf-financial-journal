<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALF Financial Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --paper: #F7F3E8;
    --paper-dark: #EFE8D6;
    --ink: #1B1815;
    --ink-soft: #4A443C;
    --ink-faint: #8A8271;
    --rule: #1B1815;
    --accent: #7A1F1F;
    --hair: #D8D0BC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #DAD5C6;
    color: var(--ink);
    font-family: "PT Serif", Georgia, "Times New Roman", serif;
  }
  .stage { max-width: 880px; margin: 0 auto; padding: 3rem 1rem 5rem; perspective: 1800px; }
  .stack-wrap { position: relative; }
  .stack-wrap .deck {
    position: absolute; inset: 0; background: var(--paper-dark);
    border: 1px solid var(--hair);
  }
  .stack-wrap .deck.d1 { transform: rotate(-1.1deg) translate(6px, 8px); z-index: 1; }
  .stack-wrap .deck.d2 { transform: rotate(0.8deg) translate(-5px, 12px); z-index: 0; }
  .paper {
    position: relative; z-index: 2;
    background: var(--paper);
    border: 1px solid var(--hair);
    box-shadow: 0 24px 48px rgba(20,16,8,0.28), 0 4px 12px rgba(20,16,8,0.18);
    transform: rotateX(1deg) rotateY(-0.4deg);
    padding: 2.25rem 2.5rem 2.75rem;
  }
  .masthead { text-align: center; }
  .masthead h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 900; font-size: 46px; letter-spacing: 1px; margin: 0;
    text-transform: uppercase;
  }
  .masthead .tagline { font-style: italic; color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .masthead-info {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft);
    margin: 14px 0 6px; padding-top: 8px; border-top: 1px solid var(--rule);
  }
  .rule-thick { border: none; border-top: 3px solid var(--rule); margin: 2px 0 1px; }
  .rule-thin { border: none; border-top: 1px solid var(--rule); margin: 0 0 16px; }
  .editions { text-align: center; margin: 0 0 20px; }
  .editions button {
    font-family: "PT Serif", serif; background: none; border: none; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-faint);
    padding: 4px 14px; border-bottom: 2px solid transparent;
  }
  .editions button.active { color: var(--ink); border-bottom: 2px solid var(--accent); font-weight: 700; }
  .editions span { color: var(--hair); }
  #articles { transform-style: preserve-3d; }
  .lead { border-bottom: 1px double var(--rule); padding-bottom: 20px; margin-bottom: 20px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .lead h2 {
    font-family: "Playfair Display", serif; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 800;
  }
  .byline { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .lead-body { columns: 2; column-gap: 28px; font-size: 15.5px; line-height: 1.65; text-align: justify; hyphens: auto; }
  .lead-body p { margin: 0 0 10px; }
  .lead-body p::first-letter {
    font-family: "Playfair Display", serif; font-size: 46px; font-weight: 900; float: left;
    line-height: 0.8; padding: 4px 6px 0 0; color: var(--ink);
  }
  .analysis { font-size: 14px; color: var(--ink-soft); margin: 8px 0 0; break-inside: avoid; }
  .analysis b { color: var(--ink); }
  .pullquote {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 20px; line-height: 1.4;
    text-align: center; color: var(--ink); margin: 16px auto 6px; max-width: 520px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 8px;
  }
  .pullquote .label { display: block; font-family: "PT Serif", serif; font-style: normal; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 6px; font-weight: 700; }
  .tags-row { text-align: center; font-size: 11px; color: var(--ink-faint); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 8px; }
  .columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .story { border-top: 1px solid var(--hair); padding-top: 14px; margin-top: 14px; break-inside: avoid; }
  .story h3 { font-family: "Playfair Display", serif; font-size: 19px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
  .story .kicker { font-size: 10.5px; }
  .story .byline { margin-bottom: 8px; }
  .story p { font-size: 14px; line-height: 1.6; text-align: justify; hyphens: auto; margin: 0 0 8px; }
  .story .pullquote { font-size: 15px; margin: 10px auto 4px; padding: 8px 4px; }
  .story .tags-row { text-align: left; }
  .footnote { text-align: center; font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 24px;
    border-top: 1px solid var(--hair); padding-top: 12px; }
  @media (max-width: 640px) {
    .paper { padding: 1.5rem 1.25rem 2rem; }
    .masthead h1 { font-size: 30px; }
    .lead h2 { font-size: 24px; }
    .lead-body { columns: 1; }
    .columns-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="stack-wrap">
    <div class="deck d1"></div>
    <div class="deck d2"></div>
    <div class="paper">
      <div class="masthead">
        <h1>Galf Financial Journal</h1>
        <p class="tagline">Notizie che contano. Punti di vista che fanno discutere.</p>
      </div>
      <div class="masthead-info">
        <span id="today-date">Lun 31 ago 2026</span>
        <span id="edition-label">Edizione del mattino</span>
        <span>A cura di Giulio Alfarano</span>
      </div>
      <hr class="rule-thick"><hr class="rule-thin">

      <div class="editions">
        <button id="btn-morning" class="active">Edizione 6:00</button>
        <span>&mdash;</span>
        <button id="btn-afternoon">Edizione 14:00</button>
      </div>

      <div id="articles"></div>

      <p class="footnote">Edizione generata automaticamente sulla base delle notizie finanziarie reali della giornata.</p>
    </div>
  </div>
</div>

<script>
var data = {
  morning: [
    {cat:'Macro', rel:'Alta', source:'CNBC / CME FedWatch', time:'06:15', title:'La Fed non parla più di tagliare: ora il mercato scommette che alzerà', sintesi:'Dopo il discorso di Kevin Warsh a Jackson Hole, i mercati danno il 60,4% di probabilità a un aumento dei tassi a settembre, contro il 56% di venerdì. Il presidente della Fed ha detto che i buoni dati sull\'inflazione dell\'estate «non dimostrano che la tendenza di fondo sia migliorata davvero».', perche:'Se la Fed alza, sale il costo del denaro ovunque: mutui, prestiti alle imprese e interessi che anche l\'Italia paga sul suo debito.', spunto:'Per due anni ci hanno raccontato che il problema inflazione era risolto e mancava solo la data del primo taglio: oggi si discute del contrario, e nessuno di quelli che sbagliarono la previsione ha ancora chiesto scusa.', tags:['LinkedIn','X']},
    {cat:'Geopolitica', rel:'Alta', source:'Bloomberg', time:'06:40', title:'Stati Uniti e Iran tornano a spararsi: il petrolio riparte al rialzo', sintesi:'Domenica le forze americane hanno colpito lanciarazzi iraniani su un\'isola dello Stretto di Hormuz, che si preparavano a piazzare mine nel canale. Teheran ha risposto attaccando Emirati Arabi e Giordania. È il primo scontro diretto dopo un mese di calma: il Brent è salito del 2% in apertura, sopra i 90 dollari, il greggio americano vicino a 86.', perche:'Da quel braccio di mare passa gran parte del petrolio mondiale, e il conto arriva al distributore e in bolletta nel giro di poche settimane.', spunto:'Chiamiamo «calma» un mese senza bombe in uno stretto minato: abbiamo abbassato talmente l\'asticella che la normalità ormai coincide con l\'emergenza gestita.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Media', source:'Bloomberg', time:'07:10', title:'Lo yen sfonda quota 160 e brucia metà di quanto Tokyo aveva speso per difenderlo', sintesi:'La valuta giapponese è scivolata a 160,16 per dollaro, cancellando più della metà dei guadagni ottenuti con l\'intervento sui mercati di fine luglio: il primo acquisto coordinato tra Stati Uniti e Giappone dal 1998. Gli analisti indicano quota 161 e poi la fascia 162-163 come nuovi punti in cui Tokyo potrebbe intervenire di nuovo.', perche:'Uno yen debole rende le merci giapponesi più economiche di quelle europee, e a pagarne il prezzo sono le nostre imprese esportatrici.', spunto:'Due governi si alleano, spendono miliardi per difendere una valuta e un mese dopo siamo punto e a capo: gli Stati possono ancora comprare tempo sui mercati, non più cambiarne la direzione.', tags:['LinkedIn','Threads']},
    {cat:'Azionario', rel:'Media', source:'CNBC', time:'07:35', title:'Agosto chiude in guadagno per tutti, e a tirare è ancora l\'intelligenza artificiale', sintesi:'Il Dow segna un +2,1% nel mese e va verso il quinto rialzo mensile di fila; S&P 500 e Nasdaq salgono del 3% e del 4%, il primo mese positivo da maggio. A trainare è la tecnologia, con il comparto su di quasi il 6%. Eppure nello stesso mese i rendimenti dei titoli di Stato americani hanno toccato i massimi da anni.', perche:'Chi ha un fondo pensione o un piano di accumulo ha guadagnato ad agosto, ma ha guadagnato quasi solo grazie a una manciata di titoli tecnologici.', spunto:'Una Borsa che sale mentre i tassi vanno ai massimi da anni non è un mercato solido: è un mercato che ha deciso di credere a una sola storia, e quella storia si chiama intelligenza artificiale.', tags:['LinkedIn','Threads']},
    {cat:'Commodities', rel:'Media', source:'Business Today / Reuters', time:'08:00', title:'Scoppia lo scontro con l\'Iran e l\'oro scende: il bene rifugio non fa più il rifugio', sintesi:'Nonostante i raid americani, l\'oro ha perso lo 0,91% a 4.488,60 dollari l\'oncia e i fondi quotati sull\'argento sono scesi fino al 4,06%. Il motivo sta tutto nei tassi: con i rendimenti dei titoli di Stato in salita, tenere un metallo che non paga interessi costa troppo.', perche:'Se il rifugio classico scende proprio quando arrivano le bombe, chi cerca protezione per i propri risparmi non sa più dove trovarla.', spunto:'Trent\'anni a venderci l\'oro come assicurazione contro le guerre: arriva la guerra e l\'oro scende. Oggi comanda un prezzo solo, quello dei tassi, e tutto il resto è marketing.', tags:['LinkedIn','X']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk / Cointelegraph', time:'08:20', title:'Bitcoin resta sotto 78 mila dollari, ma i grandi fondi hanno comprato tutto agosto', sintesi:'La criptovaluta ha chiuso domenica a 77.668 dollari, in calo dello 0,74%, frenata dalla svolta dura della Fed. Eppure i fondi quotati americani hanno raccolto circa 924 milioni di dollari nella sola ultima settimana e superato i 3 miliardi nel mese: il migliore del 2026.', perche:'Quando il prezzo scende ma i soldi grossi continuano a entrare, significa che a comprare non sono più i piccoli risparmiatori.', spunto:'Bitcoin nasceva come rivolta contro le banche centrali e oggi si muove al primo cenno del capo della Fed: l\'indipendenza è durata finché nessuno l\'ha messa alla prova.', tags:['X','LinkedIn']}
  ],
  afternoon: [
    {cat:'Macro', rel:'Alta', source:'Destatis / Reuters', time:'14:05', title:'L\'energia rimette in moto i prezzi: la Germania torna al 2,9% e la Bce si prepara ad alzare', sintesi:'I prezzi tedeschi sono saliti del 2,9% in un anno ad agosto, appena sotto il 3% atteso ma in crescita per il terzo mese di fila: erano al 2,4% a giugno e al 2,8% a luglio. A spingerli è l\'energia, su del 10,5% contro l\'8,3% di luglio. I mercati ora danno per probabile un aumento dei tassi della Bce a settembre.', perche:'Se la Bce alza, salgono le rate dei mutui a tasso variabile e il costo dei prestiti per le imprese italiane.', spunto:'Ci avevano promesso che l\'inflazione era una parentesi chiusa: è rientrata dalla stessa porta di sempre, la bolletta, e stavolta non possiamo dare la colpa alla pandemia.', tags:['LinkedIn','X']},
    {cat:'Macro', rel:'Alta', source:'Reuters', time:'13:40', title:'Il mondo vende insieme i titoli di Stato brevi: il Giappone ai massimi da 31 anni', sintesi:'Il rendimento del titolo giapponese a due anni ha toccato lunedì il livello più alto da trentun anni, quello tedesco il massimo da luglio 2024. Nella stessa mattinata è aumentato anche il costo del debito a breve di Regno Unito, Spagna, Portogallo, Polonia e Svizzera.', perche:'È il segnale che gli investitori si aspettano tassi più alti ovunque, non solo negli Stati Uniti: il denaro costerà di più anche qui.', spunto:'Quando sei mercati diversi si muovono nello stesso identico modo nella stessa mattina, non è analisi indipendente: è un unico riflesso condizionato che parte da Washington.', tags:['LinkedIn','Threads']},
    {cat:'Geopolitica', rel:'Media', source:'Reuters', time:'12:15', title:'La Borsa scende, i petroliferi salgono: chi guadagna dalle bombe su Hormuz', sintesi:'Con il Brent oltre 90,70 dollari dopo il raid americano, i titoli energetici europei sono corsi: TotalEnergies, Orlen e OMV su tra l\'1,8% e il 3,8%. L\'indice Stoxx 600 nel frattempo perdeva lo 0,1% a 655,54 punti, con Londra chiusa per festività.', perche:'Ogni rialzo del barile è un costo per chi fa il pieno e un ricavo per chi il petrolio lo vende: sono gli stessi soldi che cambiano tasca.', spunto:'Nessuno scatena una guerra per far salire un titolo, ma finché il conflitto premia in Borsa chi lo alimenta, la pace resterà l\'opzione meno redditizia.', tags:['LinkedIn','X']},
    {cat:'Commodities', rel:'Media', source:'Reuters / JM Bullion', time:'13:20', title:'L\'oro chiude il mese migliore da gennaio mentre tutti parlano di tassi in salita', sintesi:'Il metallo ha chiuso agosto intorno a 4.459 dollari l\'oncia, circa il 10% sopra i livelli di inizio mese: il guadagno mensile più forte da gennaio. È successo proprio nel mese in cui i rendimenti dei titoli di Stato salivano, cioè quando comprare oro dovrebbe convenire meno.', perche:'Vuol dire che qualcuno, in silenzio, si sta assicurando contro qualcosa che nelle previsioni ufficiali non compare.', spunto:'L\'oro sale del 10% mentre salgono i tassi: i manuali dicono che non può succedere, ma i manuali non misurano la sfiducia, e la sfiducia oggi è la merce più comprata del mondo.', tags:['LinkedIn','Threads']},
    {cat:'Crypto', rel:'Media', source:'CoinDesk', time:'11:50', title:'Le regole sulle cripto arrivano al Senato il 15 settembre, e i conti non tornano', sintesi:'Il Clarity Act, la legge che dividerebbe i compiti fra le due autorità di controllo americane e darebbe finalmente un perimetro legale alle cripto, va a un voto procedurale il 15 settembre. Servono 60 voti su 100: i repubblicani ne hanno 53 e sette senatori democratici hanno già respinto la bozza.', perche:'Senza quelle regole, chi investe in cripto continua a muoversi su un mercato che negli Stati Uniti resta legalmente sospeso.', spunto:'Da anni il settore invoca regole chiare, ma ogni volta che si arriva al voto mancano sempre le stesse sette firme: forse l\'ambiguità conviene a più gente di quanta ne ammetta.', tags:['X','LinkedIn']},
    {cat:'Azionario', rel:'Media', source:'Bloomberg / The Information', time:'15:10', title:'Nvidia paga 6 miliardi per un software e si porta via cento ingegneri: non chiamatela acquisizione', sintesi:'Nvidia ha messo sul tavolo 6 miliardi di dollari per la licenza non esclusiva del software con cui la startup Poolside costruiva i suoi modelli, più un miliardo investito a una valutazione di dodici. Oltre cento ingegneri passano a Nvidia, i tre fondatori restano fuori. La lettera ai soci precisa che «non è un\'acquisizione».', perche:'È il modo in cui i giganti della tecnologia si prendono i concorrenti senza far scattare i controlli sulla concorrenza.', spunto:'Compri il software, assumi gli ingegneri, lasci il guscio vuoto con l\'insegna accesa e giuri che l\'azienda è ancora indipendente: l\'antitrust sta perdendo contro un cavillo.', tags:['LinkedIn','X']}
  ]
};

function renderEdition(edition){
  document.getElementById('edition-label').textContent = edition === 'morning' ? 'Edizione del mattino' : 'Edizione del pomeriggio';
  document.getElementById('btn-morning').className = edition === 'morning' ? 'active' : '';
  document.getElementById('btn-afternoon').className = edition === 'afternoon' ? 'active' : '';
  var items = data[edition];
  var container = document.getElementById('articles');
  var lead = items[0];
  var rest = items.slice(1);

  var html = '';
  html += '<div class="lead">' +
    '<span class="kicker">' + lead.cat + ' &middot; Rilevanza ' + lead.rel + '</span>' +
    '<h2>' + lead.title + '</h2>' +
    '<div class="byline">' + lead.source + ' &middot; ' + lead.time + '</div>' +
    '<div class="lead-body"><p>' + lead.sintesi + '</p><p class="analysis"><b>Perché conta.</b> ' + lead.perche + '</p></div>' +
    '<div class="pullquote"><span class="label">Spunto per un post</span>' + lead.spunto + '</div>' +
    '<div class="tags-row">' + lead.tags.join(' &middot; ') + '</div>' +
  '</div>';

  html += '<div class="columns-grid">';
  rest.forEach(function(item){
    html += '<div class="story">' +
      '<span class="kicker">' + item.cat + ' &middot; Rilevanza ' + item.rel + '</span>' +
      '<h3>' + item.title + '</h3>' +
      '<div class="byline">' + item.source + ' &middot; ' + item.time + '</div>' +
      '<p>' + item.sintesi + '</p>' +
      '<p class="analysis"><b>Perché conta.</b> ' + item.perche + '</p>' +
      '<div class="pullquote"><span class="label">Spunto per un post</span>' + item.spunto + '</div>' +
      '<div class="tags-row">' + item.tags.join(' &middot; ') + '</div>' +
    '</div>';
  });
  html += '</div>';

  container.innerHTML = html;
}

function switchEdition(edition){
  var el = document.getElementById('articles');
  el.style.transformOrigin = 'left center';
  el.style.transition = 'transform .35s ease, opacity .35s ease';
  el.style.transform = 'rotateY(-90deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    renderEdition(edition);
    el.style.transition = 'none';
    el.style.transform = 'rotateY(90deg)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.style.transition = 'transform .35s ease, opacity .35s ease';
        el.style.transform = 'rotateY(0deg)';
        el.style.opacity = '1';
      });
    });
  }, 350);
}

document.getElementById('btn-morning').addEventListener('click', function(){ switchEdition('morning'); });
document.getElementById('btn-afternoon').addEventListener('click', function(){ switchEdition('afternoon'); });
renderEdition('morning');
</script>
</body>
</html>
